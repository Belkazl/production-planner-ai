name: Validate established production auth hostname
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  live-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test original trusted login hostname now protects latest planner
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,time
          host="https://production-planner-gateway-v2-production.up.railway.app"
          old="https://prodplan-auth-backend-production.up.railway.app"
          def req(base,path,method="GET",origin=None,data=None):
            headers={"Cache-Control":"no-cache","User-Agent":"ProdPlanAuthCanonicalQA/1.0"}
            if origin: headers["Origin"]=origin;headers["Sec-Fetch-Site"]="same-origin"
            if data is not None:headers["Content-Type"]="application/json"
            body=json.dumps(data).encode() if data is not None else None
            r=urllib.request.Request(base+path,method=method,data=body,headers=headers)
            try:
              with urllib.request.urlopen(r,timeout=25) as x:return x.status,x.read(300000).decode("utf8","replace")
            except urllib.error.HTTPError as x:return x.code,x.read(10000).decode("utf8","replace")
            except Exception as x:return 0,str(x)[:180]
          for i in range(8):
            st,html=req(host,"/")
            if st==200 and 'id="loginTab"' in html and 'type="password"' in html:break
            time.sleep(4)
          print("CANONICAL_LOGIN_FORM",st,'id="loginTab"' in html,flush=True)
          assert st==200 and 'id="loginTab"' in html and 'type="password"' in html,(st,html[:220])
          assert "ppGanttToolV2" not in html,"Gantt exposed before login"
          for path in ["/api/db-storage","/api/plan-progress","/api/optimizer-stop","/api/model","/api/plan"]:
            st,body=req(host,path)
            print("CANONICAL_ANON_BLOCK",path,st,flush=True)
            assert st==401,(path,st,body[:120])
          st,t=req(host,"/api/auth/login","POST",origin=host,data={"email":"nobody+canonical-integration@no-such-account.invalid","password":"nonsecret-invalid-test"})
          print("CANONICAL_REAL_GATEWAY_BAD_PASSWORD",st,t[:110],flush=True)
          assert st in (400,401,422) and "cross_origin_forbidden" not in t,(st,t[:190])
          st,t=req(host,"/api/auth/login","POST",origin="https://malicious.example",data={"email":"x@example.invalid","password":"fake"})
          assert st==403,(st,t[:120])
          st,t=req(old,"/api/auth/me")
          print("PRIVATE_GATEWAY_BACKEND_ALIVE",st,flush=True)
          assert st==401,(st,t[:100])
          print("CANONICAL_AUTH_DOMAIN_PASS",flush=True)
          PY
