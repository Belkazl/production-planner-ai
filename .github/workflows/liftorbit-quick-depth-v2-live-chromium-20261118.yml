name: LiftOrbit live Chromium Quick 10x12 preset and API request acceptance
on:
  workflow_run:
    workflows:
      - LiftOrbit guarded OVH Quick optimization 10 generations x 12 candidates
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chromium:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify completed guarded quick-mode deployment
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'preflight=success' ops/ovh/test-results/ga-quick-depth-v2-release-latest.txt
          grep -Fqx 'rollout=success' ops/ovh/test-results/ga-quick-depth-v2-release-latest.txt
          grep -Fqx 'public_health=success' ops/ovh/test-results/ga-quick-depth-v2-release-latest.txt
      - name: Install isolated Chromium
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify Quick 10x12, request body, persistence, language and other presets
        id: qa
        shell: bash
        run: node ops/ovh/quick-depth-v2-20261118/chromium.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liftorbit-quick-10x12-visual-check
          path: optimization-quick-depth-v2-live-english.png
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/checkout@v4
        if: always()
      - name: Publish safe Quick 10x12 Chromium acceptance
        if: always()
        shell: bash
        env:
          RUN: ${{ github.run_id }}
          QA: ${{ steps.qa.outcome }}
        run: |
          set -euo pipefail
          file=ops/ovh/test-results/ga-quick-depth-v2-browser-latest.txt
          mkdir -p "$(dirname "$file")"
          printf 'workflow_run=%s\nchromium_acceptance=%s\n' "$RUN" "$QA" > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record Quick 10x12 Chromium acceptance'
            git push origin HEAD:main
          fi
