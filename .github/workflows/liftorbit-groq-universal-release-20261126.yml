name: Verify and release universal AI production parameter edits
on:
  push:
    branches: [fix/groq-universal-parameters-20261126]
    paths:
      - .github/workflows/liftorbit-groq-universal-release-20261126.yml
      - ops/ovh/groq-universal-parameters-20261126/**
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/liftorbit-groq-test --no-save --no-package-lock playwright-core@1.58.2
      - name: Test typed parameter tools and browser confirmation
        run: |
          set -euo pipefail
          for file in ops/ovh/groq-universal-parameters-20261126/*.mjs ops/ovh/groq-universal-parameters-20261126/*.js; do node --check "$file"; done
          bash -n ops/ovh/groq-universal-parameters-20261126/release.sh
          node --test ops/ovh/groq-universal-parameters-20261126/test.mjs
          node ops/ovh/groq-universal-parameters-20261126/browser.mjs
      - name: Deploy only reviewed files and verify the real native validator and Groq
        env:
          DEPLOY_HOST: ${{ vars.OVH_HOST }}
          DEPLOY_USER: ${{ vars.OVH_USER }}
          DEPLOY_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: bash ops/ovh/groq-universal-parameters-20261126/release.sh
