name: OVH planner bootstrap source audit (redacted read-only)
on:
  push:
    branches: [ops/railway-migration-20261108]
    paths: [.github/workflows/ovh-planner-bootstrap-source-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect structure of protected launcher without disclosing source or values
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$OVH_HOST" == '51.255.163.121' && "$OVH_USER" == 'liftorbit-ci' ]] || exit 2
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$tmp/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$tmp/hosts"
          chmod 600 "$tmp/key" "$tmp/hosts"
          ssh -i "$tmp/key" -o IdentitiesOnly=yes -o BatchMode=yes \
             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/hosts" \
             "$OVH_USER@$OVH_HOST" \
             'cat "$HOME/liftorbit-migration/production/current/gateway.json"' > "$tmp/gateway-private.json"
          python3 - "$tmp/gateway-private.json" <<'PY'
          import base64, json, re, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          keys=('PP_GENERIC_RESTORE_LAUNCH_V2','PP_GENERIC_RESTORE_BOOT_V1',
                'PP_RESTORE_ETALON_BOOT_V1','PP_GENERIC_CORE_B64',
                'PP_GENERIC_CORE_DIAG_B64','GATEWAY_WRAPPER')
          for key in keys:
              v=data.get(key,'')
              if not isinstance(v,str) or not v:
                  print('OVH_PRIVATE_CODE_SHAPE',key,'MISSING')
                  continue
              text=v
              if key.endswith('_B64'):
                  try:
                      text=base64.b64decode(v,validate=True).decode('utf-8')
                  except Exception:
                      text=''
              stats=[
                  'lines='+str(min(text.count(chr(10))+1,999999)),
                  'apt='+str('apt-get' in text).lower(),
                  'subprocess='+str('subprocess' in text).lower(),
                  'shell='+str('sh -c' in text or 'sh","-c' in text).lower(),
                  'python='+str('python3' in text).lower(),
                  'test='+str('test -' in text).lower(),
                  'pip='+str('pip install' in text or '-m pip' in text).lower(),
              ]
              print('OVH_PRIVATE_CODE_SHAPE',key,*stats)
          for key,v in data.items():
              if not re.fullmatch(r'[A-Z_][A-Z0-9_]{1,90}',key) or not isinstance(v,str):
                  continue
              if 'apt-get' in v or 'subprocess.run' in v or 'subprocess.check_call' in v:
                  print('OVH_PRIVATE_BOOT_SOURCE_MATCH',key,'apt='+str('apt-get' in v).lower(),
                        'run='+str('subprocess.run' in v).lower(),
                        'check_call='+str('subprocess.check_call' in v).lower())
          v=data.get('D_START_GOOD','')
          if isinstance(v,str) and v:
              import ast, hashlib
              print('OVH_LEGACY_SOURCE_STATS',
                    'lines='+str(v.count(chr(10))+1),
                    'chars='+str(len(v)),
                    'sha_prefix='+hashlib.sha256(v.encode()).hexdigest()[:12])
              try:
                  tree=ast.parse(v)
                  print('OVH_LEGACY_SOURCE_PARSE','PYTHON')
                  kinds=sorted(set(type(n).__name__ for n in ast.walk(tree) if getattr(n,'lineno',0) in range(566,579)))
                  print('OVH_LEGACY_SOURCE_NEAR_571',','.join(kinds[:14]) or 'none')
              except SyntaxError:
                  print('OVH_LEGACY_SOURCE_PARSE','NON_PYTHON')
              found=[]
              for i,row in enumerate(v.splitlines(),1):
                  if any(x in row for x in ('apt-get','python3','test -','subprocess.run','check_call')):
                      labels=[tag for tag,tok in [
                          ('APT','apt-get'),('PYTHON','python3'),('TEST','test -'),
                          ('RUN','subprocess.run'),('CHECK','check_call'),
                          ('SHELL','sh -c'),('PIP','pip install')] if tok in row]
                      found.append(str(i)+':'+'/'.join(labels))
              print('OVH_LEGACY_SOURCE_CALL_SITES',','.join(found[:40]) or 'none')
          if isinstance(v,str) and v:
              head=v.splitlines()[0]
              chunks=re.split(r'\\s*(?:&&|;|\\|\\|)\\s*',head)
              print('OVH_LEGACY_FIRST_LINE', 'chars='+str(len(head)), 'shell_segments='+str(len(chunks)),
                    'single_quotes='+str(head.count("'")), 'double_quotes='+str(head.count('"')))
              for i, part in enumerate(chunks[:18],1):
                  names=re.findall(r'\\b(?:apt-get|test|python3?|pip3?|mkdir|chmod|cat|ls|echo|psql|pg_isready|which|grep|sh|bash|curl|sleep|export|touch|cd)\\b',part)
                  tests=re.findall(r'\\btest\\s+(-[A-Za-z]{1,3})',part)
                  apt_flags=re.findall(r'(?:^|\\s)(-(?:q|y|qq|qy|yq|qqy|yqq|n|f))(?:\\s|$)',part)
                  print('OVH_LEGACY_SHELL_SEGMENT',i,
                        'programs='+(','.join(names[:14]) or 'other'),
                        'tests='+(','.join(tests[:8]) or 'none'),
                        'apt_flags='+(','.join(apt_flags[:8]) or 'none'),
                        'size='+str(len(part)))
          if isinstance(v,str) and v:
              for idx, row in enumerate(v.splitlines(),1):
                  categories=[k for k,tok in [
                    ('APT','apt-get'),('TEST','test -'),('PYTHON','python3'),
                    ('PIP','pip'),('SHELL','sh -c'),('CURL','curl'),
                    ('PG','pg_dump'),('INSTALL','install'),('PATH','PATH='),
                    ('SOURCE','source '),('EXPORT','export '),
                    ('IF','if '),('FI','fi'),('SET','set -') ] if tok in row]
                  print('OVH_LEGACY_LINE_CLASS',idx,','.join(categories) or 'other',
                        'length='+str(len(row)))
              for program in ('apt-get','test -','python3','pg_dump','pg_isready'):
                  print('OVH_LEGACY_PROGRAM_OCCURRENCES',program.replace(' ','_'),v.count(program))
          PY
