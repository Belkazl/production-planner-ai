name: Verify published LiftOrbit landing
on:
  push:
    branches: [brand/liftorbit-landing-2026-10-15]
    paths:
      - .github/workflows/plantrick-landing-public-qa.yml
  workflow_dispatch:
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Wait for published site to use new brand
        run: |
          for i in $(seq 1 80); do
            html="$(curl -fsS --max-time 8 'https://prodplan-landing-v1-production.up.railway.app/?brand=liftorbit' || true)"
            if printf '%s' "$html" | grep -q 'LiftOrbit — Production planning made simple' && ! printf '%s' "$html" | grep -q 'ProdPlan AI'; then
              echo "LiftOrbit landing is public"
              exit 0
            fi
            sleep 2
          done
          echo "New LiftOrbit landing not visible"
          exit 1
      - name: Run responsive production-browser regression
        env:
          LANDING_URL: https://prodplan-landing-v1-production.up.railway.app/
        run: |
          node tests/landing-smoke.cjs
          node tests/landing-benefits.cjs
          node tests/landing-v4-no-russian-gallery.cjs
          node tests/plantrick-landing-browser.cjs
      - name: Keep actual public landing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liftorbit-public-landing-views
          path: liftorbit-landing-*.png
          retention-days: 7
          if-no-files-found: ignore
