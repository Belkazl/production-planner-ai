name: Restore LiftOrbit approved etalon UI and GA progress on OVH
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ovh-live-etalon.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false

jobs:
  controlled-repair:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'release(liftorbit): restore etalon UI on OVH with guarded rollback')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a1457d6f33e7ef5b6e8ad59c3e21ef345b8c25f
          path: pinned
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bfaa8c9eeb9764ae376e39094acbbea389f15da0
          path: prior
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b3ac9541ea9c6cdb7a5a8188f4417ab323115c62
          path: repaired
          persist-credentials: false
      - name: Verify exactly two scoped continuation compatibility changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p old/app new/app
          cp -a pinned/. old/app/
          cp -a pinned/. new/app/
          for dest in old/app new/app; do
            base=prior
            if [[ "$dest" = new/app ]]; then base=repaired; fi
            node "$base/ops/ovh/patch-runtime-origins.mjs" "$dest"
            node "$base/ops/ovh/repair-planner-ui.mjs" "$dest"
            node "$base/ops/ovh/repair-ga-state.mjs" "$dest"
            node "$base/ops/ovh/repair-ga-load.mjs" "$dest"
            node "$base/ops/ovh/repair-async-ga.mjs" "$dest"
          done
          node repaired/ops/ovh/repair-continuation.mjs new/app
          node --check new/app/auth-runtime.js
          node --check new/app/python-ga-upstream.mjs
          diff -qr old/app new/app > "$RUNNER_TEMP/ga-continue-diff" || test "$?" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/ga-continue-diff")" -eq 2
          for name in auth-runtime.js python-ga-upstream.mjs; do
            grep -Fqx "Files old/app/$name and new/app/$name differ" "$RUNNER_TEMP/ga-continue-diff"
            sha256sum "old/app/$name" | awk '{print $1}' > "old.$name.sha"
            sha256sum "new/app/$name" | awk '{print $1}' > "new.$name.sha"
          done
          grep -q 'pp-ovh-portable-legacy-continuation' new/app/auth-runtime.js
          grep -q 'resume_plan:continuing' new/app/auth-runtime.js
          grep -q 'continuation_seed_missing_or_invalid' new/app/python-ga-upstream.mjs
          grep -q 'current.modelKey===modelKey' new/app/python-ga-upstream.mjs
          echo 'GA_LEGACY_CONTINUE_EXACT_TWO_FILE_SCOPE_VALIDATED'
      - name: Guarded OVH production source update and automatic rollback on failure
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test "$OVH_HOST" = "51.255.163.121"
          test "$OVH_USER" = "liftorbit-ci"
          test -n "$OVH_SSH_PRIVATE_KEY"
          test -n "$OVH_SSH_KNOWN_HOSTS"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20)
          target="$OVH_USER@$OVH_HOST"
          names=(auth-runtime.js python-ga-upstream.mjs)
          oldHashes=(); newHashes=()
          for name in "${names[@]}"; do
            oldHashes+=("$(cat "old.$name.sha")")
            newHashes+=("$(cat "new.$name.sha")")
          done
          dest=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app
          for name in "${names[@]}"; do
            scp -q "${opts[@]}" "new/app/$name" "$target:$dest/$name.ga-continue.next"
          done
          ssh "${opts[@]}" "$target" "bash -s -- '${oldHashes[0]}' '${newHashes[0]}' '${oldHashes[1]}' '${newHashes[1]}'" <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/liftorbit-migration"
          src="$root/sources/ovh-app"
          backup="$root/patch-backups/ga-continuation-before-20261111"
          mkdir -p "$backup"
          sha() { sha256sum "$1" | awk '{print $1}'; }
          names=(auth-runtime.js python-ga-upstream.mjs)
          previous=("$1" "$3")
          next=("$2" "$4")
          for i in 0 1; do
            name="${names[$i]}"
            test -f "$src/current/$name" && test -f "$src/$name.ga-continue.next"
            test "$(sha "$src/current/$name")" = "${previous[$i]}" || { echo "GA_CONTINUE_PRODUCTION_SOURCE_DRIFT_$i"; exit 5; }
            test "$(sha "$src/$name.ga-continue.next")" = "${next[$i]}" || { echo "GA_CONTINUE_UPLOAD_HASH_MISMATCH_$i"; exit 5; }
          done
          sudo -n /usr/local/sbin/liftorbit-ops smoke > /dev/null || { echo 'GA_CONTINUE_PREDEPLOY_HEALTH_NOT_READY'; exit 6; }
          for i in 0 1; do
            name="${names[$i]}"
            cp -p "$src/current/$name" "$backup/$name"
            test "$(sha "$backup/$name")" = "${previous[$i]}"
          done
          restore() {
            trap - ERR
            for name in "${names[@]}"; do cp -p "$backup/$name" "$src/current/$name" || true; done
            sudo -n /usr/local/sbin/liftorbit-ops update > "$root/patch-backups/ga-continue-rollback-private.log" 2>&1 || true
            echo 'GA_CONTINUE_AUTOMATIC_ROLLBACK_ATTEMPTED'
          }
          trap restore ERR
          for name in "${names[@]}"; do mv "$src/$name.ga-continue.next" "$src/current/$name"; done
          sudo -n /usr/local/sbin/liftorbit-ops update > "$root/patch-backups/ga-continue-update-private.log" 2>&1
          healthy=no
          for attempt in $(seq 1 24); do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke > /dev/null 2>&1; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes || { echo 'GA_CONTINUE_POSTDEPLOY_HEALTH_NOT_READY'; false; }
          for i in 0 1; do
            name="${names[$i]}"
            test "$(sha "$src/current/$name")" = "${next[$i]}"
          done
          trap - ERR
          echo 'GA_LEGACY_CONTINUE_OVH_TWO_FILE_UPDATE_HEALTHY_DATABASE_UNCHANGED'

          REMOTE
      - name: Verify public TLS health and unauthenticated account boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://app.liftorbit.app/__bridge_health > /dev/null
          status=$(curl --silent -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/api/auth/me)
          test "$status" = 401 || { echo 'ETALON_AUTH_BOUNDARY_BAD'; exit 2; }
          echo 'ETALON_PUBLIC_TLS_AUTH_BOUNDARY_OK'
