name: Restore LiftOrbit approved etalon UI on OVH
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ovh-live-etalon.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false

jobs:
  controlled-repair:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'release(liftorbit): restore etalon UI on OVH with guarded rollback')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a1457d6f33e7ef5b6e8ad59c3e21ef345b8c25f
          path: pinned
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 4217386cadd04d6a8defc6d793ffbf83a8decce7
          path: prior
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6e2c508c844293094dc66599c271df0e26e3b409
          path: repaired
          persist-credentials: false
      - name: Verify exactly two scoped OVH compatibility files (UI and GA-state recovery)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p old/app new/app
          cp -a pinned/. old/app/
          cp -a pinned/. new/app/
          node prior/ops/ovh/patch-runtime-origins.mjs old/app
          node prior/ops/ovh/repair-planner-ui.mjs old/app
          node repaired/ops/ovh/patch-runtime-origins.mjs new/app
          node repaired/ops/ovh/repair-planner-ui.mjs new/app
          node repaired/ops/ovh/repair-ga-state.mjs new/app
          node --check old/app/auth-runtime.js
          node --check new/app/auth-runtime.js
          node --check new/app/python-ga-upstream.mjs
          diff -qr old/app new/app > "$RUNNER_TEMP/etalon-diff" || test "$?" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/etalon-diff")" -eq 2
          grep -Fqx "Files old/app/auth-runtime.js and new/app/auth-runtime.js differ" "$RUNNER_TEMP/etalon-diff"
          grep -Fqx "Files old/app/python-ga-upstream.mjs and new/app/python-ga-upstream.mjs differ" "$RUNNER_TEMP/etalon-diff"
          grep -q '__pp_fresh_recovery' new/app/auth-runtime.js
          grep -q 'PP_GA_FRESH_STALE_STATE_SKIPPED' new/app/python-ga-upstream.mjs
          sha256sum old/app/auth-runtime.js | awk '{print $1}' > old.auth.sha
          sha256sum new/app/auth-runtime.js | awk '{print $1}' > new.auth.sha
          sha256sum old/app/python-ga-upstream.mjs | awk '{print $1}' > old.ga.sha
          sha256sum new/app/python-ga-upstream.mjs | awk '{print $1}' > new.ga.sha
          echo 'GA_FRESH_RECOVERY_TWO_FILE_SCOPE_VALIDATED'
      - name: Guarded OVH production source update and automatic rollback on failure
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test "$OVH_HOST" = "51.255.163.121"
          test "$OVH_USER" = "liftorbit-ci"
          test -n "$OVH_SSH_PRIVATE_KEY"
          test -n "$OVH_SSH_KNOWN_HOSTS"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20)
          target="$OVH_USER@$OVH_HOST"
          oldAuth=$(cat old.auth.sha); newAuth=$(cat new.auth.sha)
          oldGa=$(cat old.ga.sha); newGa=$(cat new.ga.sha)
          dest=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app
          scp -q "${opts[@]}" new/app/auth-runtime.js "$target:$dest/auth-runtime.js.ga-recovery.next"
          scp -q "${opts[@]}" new/app/python-ga-upstream.mjs "$target:$dest/python-ga-upstream.mjs.ga-recovery.next"
          ssh "${opts[@]}" "$target" "bash -s -- '$oldAuth' '$newAuth' '$oldGa' '$newGa'" <<'REMOTE'
          set -euo pipefail
          umask 077
          oldAuth="$1";newAuth="$2";oldGa="$3";newGa="$4"
          root="$HOME/liftorbit-migration"
          source="$root/sources/ovh-app"
          auth="$source/current/auth-runtime.js"
          ga="$source/current/python-ga-upstream.mjs"
          incomingAuth="$source/auth-runtime.js.ga-recovery.next"
          incomingGa="$source/python-ga-upstream.mjs.ga-recovery.next"
          backupAuth="$root/patch-backups/ga-recovery-before-auth-runtime.js"
          backupGa="$root/patch-backups/ga-recovery-before-python-upstream.mjs"
          mkdir -p "$root/patch-backups"
          sha() { sha256sum "$1" | awk '{print $1}'; }
          test -f "$auth" && test -f "$ga" && test -f "$incomingAuth" && test -f "$incomingGa"
          test "$(sha "$incomingAuth")" = "$newAuth" || { echo 'RECOVERY_AUTH_UPLOAD_HASH_MISMATCH'; exit 4; }
          test "$(sha "$incomingGa")" = "$newGa" || { echo 'RECOVERY_GA_UPLOAD_HASH_MISMATCH'; exit 4; }
          test "$(sha "$auth")" = "$oldAuth" || { echo 'RECOVERY_PRODUCTION_AUTH_DRIFT_ABORTED'; exit 5; }
          test "$(sha "$ga")" = "$oldGa" || { echo 'RECOVERY_PRODUCTION_GA_DRIFT_ABORTED'; exit 5; }
          sudo -n /usr/local/sbin/liftorbit-ops smoke > /dev/null || { echo 'RECOVERY_PREDEPLOY_HEALTH_NOT_READY'; exit 6; }
          cp -p "$auth" "$backupAuth"
          cp -p "$ga" "$backupGa"
          test "$(sha "$backupAuth")" = "$oldAuth"
          test "$(sha "$backupGa")" = "$oldGa"
          restore() {
            trap - ERR
            cp -p "$backupAuth" "$auth" || true
            cp -p "$backupGa" "$ga" || true
            sudo -n /usr/local/sbin/liftorbit-ops update > "$root/patch-backups/ga-recovery-rollback-private.log" 2>&1 || true
            echo 'GA_FRESH_RECOVERY_ROLLBACK_ATTEMPTED'
          }
          trap restore ERR
          mv "$incomingAuth" "$auth"
          mv "$incomingGa" "$ga"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$root/patch-backups/ga-recovery-update-private.log" 2>&1
          healthy=no
          for attempt in $(seq 1 24); do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke > /dev/null 2>&1; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes || { echo 'GA_FRESH_RECOVERY_SMOKE_NOT_HEALTHY'; false; }
          test "$(sha "$auth")" = "$newAuth" && test "$(sha "$ga")" = "$newGa"
          trap - ERR
          echo 'GA_FRESH_RECOVERY_OVH_TWO_FILE_UPDATE_HEALTHY_DATABASE_UNCHANGED'
          REMOTE
      - name: Verify public TLS health and unauthenticated account boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://app.liftorbit.app/__bridge_health > /dev/null
          status=$(curl --silent -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/api/auth/me)
          test "$status" = 401 || { echo 'ETALON_AUTH_BOUNDARY_BAD'; exit 2; }
          echo 'ETALON_PUBLIC_TLS_AUTH_BOUNDARY_OK'
