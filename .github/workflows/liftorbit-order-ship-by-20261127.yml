name: Ship-by deadlines regression tests
on:
  push:
    branches: [fix/order-ship-by-20261127]
    paths:
      - ops/ovh/order-ship-by-20261127/**
      - .github/workflows/liftorbit-order-ship-by-20261127.yml
  pull_request:
    paths:
      - ops/ovh/order-ship-by-20261127/**
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test deadlines and joint scheduler
        run: |
          cd ops/ovh/order-ship-by-20261127
          python3 -m unittest discover -v
