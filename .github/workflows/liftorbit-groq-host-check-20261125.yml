name: Test Groq connectivity from the actual LiftOrbit host
on:
  push:
    branches: [feat/groq-assistant-20261125]
    paths: [.github/workflows/liftorbit-groq-host-check-20261125.yml]
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Test official API from the intended deployment host without persisting the key
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HOST" = 51.255.163.121
          test "$USER" = liftorbit-ci
          test -n "$GROQ_API_KEY"
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf -- "$d"' EXIT
          printf '%s\n' "$KEY" > "$d/key"
          printf '%s\n' "$KH" > "$d/kh"
          chmod 600 "$d/key" "$d/kh"
          opts=(-i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" -o ConnectTimeout=20)
          cat > "$d/probe.py" <<'PY'
          import sys,json,subprocess
          key=sys.stdin.read().strip()
          if not key or "\r" in key or "\n" in key:raise SystemExit(2)
          data=json.dumps({"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"Reply with exactly OK."}],"max_completion_tokens":128,"reasoning_effort":"low"})
          result=subprocess.run(["curl","--silent","--show-error","--proto","=https","--max-time","25","--header","@-","--header","Content-Type: application/json","--data-binary",data,"--write-out","\n%{http_code}","https://api.groq.com/openai/v1/chat/completions"],input=("Authorization: Bearer "+key+"\n").encode(),capture_output=True,timeout=30)
          if result.returncode:
              print("GROQ_CURL_TRANSPORT_FAILED",result.returncode)
              raise SystemExit(3)
          raw,status=result.stdout.rsplit(b"\n",1)
          if status==b"200":
              value=json.loads(raw)["choices"][0]["message"]["content"]
              if not isinstance(value,str) or not value.strip():raise ValueError("empty_completion")
              print("GROQ_HOST_CURL_COMPLETION_PASS",200)
          else:
              print("GROQ_HOST_CURL_HTTP_STATUS",int(status))
              print("GROQ_EDGE_1010",b"error code: 1010" in raw.lower())
              raise SystemExit(4)
          PY
          # Program text only in the remote command; the key travels only as stdin.
          program=$(python3 -c 'import shlex,sys; print(shlex.quote(open(sys.argv[1]).read()))' "$d/probe.py")
          printf '%s' "$GROQ_API_KEY" | ssh "${opts[@]}" "$USER@$HOST" "python3 -B -I -c $program"
