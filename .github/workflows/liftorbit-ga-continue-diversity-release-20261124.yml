name: LiftOrbit Continue GA must explore fresh candidates on each run
on:
  push:
    branches: [main, fix/ga-continue-random-seed-20261124]
    paths:
      - .github/workflows/liftorbit-ga-continue-diversity-release-20261124.yml
      - ops/ovh/ga-continue-diversity-20261124/**
permissions: {contents: read}
concurrency:
  group: liftorbit-ga-continue-diversity-ovh
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Patch active GA worker only, verify unique randomness and deploy safely
        id: rollout
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121"
          test "$USER" = "liftorbit-ci"
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$KEY" > "$d/key"
          printf '%s\n' "$KH" > "$d/kh"
          chmod 600 "$d/key" "$d/kh"
          ssh_call(){ ssh -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" -o ConnectTimeout=20 "$@"; }
          scp_call(){ scp -q -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" -o ConnectTimeout=20 "$@"; }
          root=/home/liftorbit-ci/liftorbit-migration
          live="$root/sources/current/ga/ga_workers/full_runtime_adapter.py"
          scp_call "$USER@$HOST:$live" "$d/old.py"
          python3 ops/ovh/ga-continue-diversity-20261124/patch.py "$d/old.py" "$d/new.py"
          python3 ops/ovh/ga-continue-diversity-20261124/test.py "$d/old.py" "$d/new.py"
          python3 -m py_compile "$d/new.py"
          echo GA_CONTINUE_SEED_PREDEPLOY_VERIFIED
          if [ "$GITHUB_REF" != refs/heads/main ];then
            echo GA_CONTINUE_SEED_BRANCH_PREFLIGHT_PASS
            exit 0
          fi
          old_sha=$(sha256sum "$d/old.py" | cut -d' ' -f1)
          new_sha=$(sha256sum "$d/new.py" | cut -d' ' -f1)
          stage="$root/sources/ovh-app/ga-continue-diversity-20261124.next"
          scp_call "$d/new.py" "$USER@$HOST:$stage"
          ssh_call "$USER@$HOST" bash -s -- "$old_sha" "$new_sha" <<'REMOTE'
          set -euo pipefail
          root="$HOME/liftorbit-migration"
          target="$root/sources/current/ga/ga_workers/full_runtime_adapter.py"
          stage="$root/sources/ovh-app/ga-continue-diversity-20261124.next"
          backup="$root/patch-backups/ga-continue-diversity-20261124"
          sha(){ sha256sum "$1"|cut -d' ' -f1; }
          test "$(sha "$target")" = "$1" || { echo GA_CONTINUE_CURRENT_WORKER_CHANGED;exit 6; }
          test "$(sha "$stage")" = "$2" || { echo GA_CONTINUE_STAGE_HASH_MISMATCH;exit 6; }
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          mkdir -p "$backup"
          cp -p "$target" "$backup/full_runtime_adapter.py"
          test "$(sha "$backup/full_runtime_adapter.py")" = "$1"
          rollback(){
            trap - ERR
            cp -p "$backup/full_runtime_adapter.py" "$target" || true
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo GA_CONTINUE_SEED_ROLLBACK_ATTEMPTED
          }
          trap rollback ERR
          mv "$stage" "$target"
          python3 -m py_compile "$target"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          ok=no
          for n in $(seq 1 40);do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1;then ok=yes;break;fi
            sleep 5
          done
          test "$ok" = yes
          test "$(sha "$target")" = "$2"
          trap - ERR
          echo GA_CONTINUE_SEED_OVH_DEPLOYED_SMOKE_PASS
          REMOTE
          scp_call "$USER@$HOST:$live" "$d/verified.py"
          test "$(sha256sum "$d/verified.py"|cut -d' ' -f1)" = "$new_sha"
          python3 -m py_compile "$d/verified.py"
          echo GA_CONTINUE_SEED_DEPLOYED_SHA_VERIFIED
      - name: Production public health and account isolation
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          healthy=no
          for i in $(seq 1 14);do
            h=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/__bridge_health || true)
            a=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/api/auth/me || true)
            if [ "$h" = 200 ] && [ "$a" = 401 ];then healthy=yes;break;fi
            sleep 5
          done
          test "$healthy" = yes
          echo GA_CONTINUE_SEED_PUBLIC_HEALTH_AND_AUTH_PASS
