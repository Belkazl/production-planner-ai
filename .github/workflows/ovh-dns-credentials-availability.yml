name: OVH migration - check availability of DNS automation credentials
on:
  push:
    branches: [ops/railway-migration-20261108]
    paths: [.github/workflows/ovh-dns-credentials-availability.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify Cloudflare token, discover zone and inspect only two DNS names (no writes)
        shell: bash
        env:
          CF_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_SECONDARY: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_PRIMARY: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_ZONE_SECONDARY: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,urllib.error,urllib.parse,urllib.request
          token=os.environ.get('CF_PRIMARY') or os.environ.get('CF_SECONDARY') or ''
          zone=os.environ.get('CF_ZONE_PRIMARY') or os.environ.get('CF_ZONE_SECONDARY') or ''
          print('OVH_DNS_AUTOMATION_TOKEN_AVAILABLE',str(bool(token)).lower())
          print('OVH_DNS_AUTOMATION_ZONE_CONFIGURED',str(bool(zone)).lower())
          if not token:
              print('OVH_DNS_AUTOMATION_READY false')
              raise SystemExit(2)
          base='https://api.cloudflare.com/client/v4/'
          def get(path):
              req=urllib.request.Request(base+path,headers={
                  'Authorization':'Bearer '+token,'Accept':'application/json',
                  'User-Agent':'liftorbit-migration-read-only/1.0'
              },method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code,{}
              except (urllib.error.URLError,TimeoutError,ValueError):
                  return 0,{}
          code,verified=get('user/tokens/verify')
          ok=(code==200 and verified.get('success') is True and
              verified.get('result',{}).get('status')=='active')
          print('OVH_DNS_AUTOMATION_TOKEN_VALID',str(ok).lower())
          if not ok:
              print('OVH_DNS_AUTOMATION_READY false')
              raise SystemExit(3)
          code,zones=get('zones?'+urllib.parse.urlencode({'name':'liftorbit.app','per_page':10}))
          found=[z for z in zones.get('result',[]) if
                 isinstance(z,dict) and z.get('name')=='liftorbit.app' and
                 re.fullmatch('[a-f0-9]{32}',z.get('id',''))] if code==200 else []
          print('OVH_DNS_ZONE_LIST_HTTP',code)
          print('OVH_DNS_ZONE_DISCOVERED',str(len(found)==1).lower())
          if not zone and len(found)==1: zone=found[0]['id']
          if not re.fullmatch('[a-f0-9]{32}',zone):
              print('OVH_DNS_ZONE_ID_REQUIRED true')
              print('OVH_DNS_AUTOMATION_READY false')
              raise SystemExit(0)
          if len(found)==1 and found[0]['id']!=zone:
              print('OVH_DNS_ZONE_ID_MISMATCH true')
              raise SystemExit(4)
          accessible=True
          for name in ('liftorbit.app','app.liftorbit.app'):
              code,result=get('zones/'+zone+'/dns_records?'+urllib.parse.urlencode({
                  'name':name,'per_page':100
              }))
              print('OVH_DNS_RECORD_READ',name,'http='+str(code))
              if code!=200 or result.get('success') is not True:
                  accessible=False
                  continue
              records=result.get('result',[])
              for kind in ('A','AAAA','CNAME'):
                  current=[x for x in records if x.get('type')==kind and x.get('name')==name]
                  print('OVH_DNS_RECORD_STATUS',name,'type='+kind,
                        'count='+str(len(current)),
                        'proxied='+(','.join(str(x.get('proxied',False)).lower() for x in current) or 'none'))
          print('OVH_DNS_AUTOMATION_READY',str(accessible).lower())
          PY
