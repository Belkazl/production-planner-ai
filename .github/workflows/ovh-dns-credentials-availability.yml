name: OVH migration - check availability of DNS automation credentials
on:
  push:
    branches: [ops/railway-migration-20261108]
    paths: [.github/workflows/ovh-dns-credentials-availability.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Detect usable DNS credential metadata without printing values or changing DNS
        shell: bash
        env:
          CF_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_SECONDARY: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_PRIMARY: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_ZONE_SECONDARY: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          # This CI stage is *read only*: NEVER print credential values.
          token="${CF_PRIMARY:-${CF_SECONDARY:-}}"
          zone="${CF_ZONE_PRIMARY:-${CF_ZONE_SECONDARY:-}}"
          if [[ -z "$token" ]]; then
            echo 'OVH_DNS_AUTOMATION_TOKEN_AVAILABLE false'
            echo 'OVH_DNS_AUTOMATION_REQUIRES_CLOUDFLARE_ACCESS'
            exit 0
          fi
          echo 'OVH_DNS_AUTOMATION_TOKEN_AVAILABLE true'
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 12 \
             -H "Authorization: Bearer $token" \
             https://api.cloudflare.com/client/v4/user/tokens/verify || true)
          if [[ "$code" == 200 ]]; then
            echo 'OVH_DNS_AUTOMATION_TOKEN_VALID true'
          else
            echo 'OVH_DNS_AUTOMATION_TOKEN_VALID false'
          fi
          if [[ -n "$zone" ]]; then
            echo 'OVH_DNS_AUTOMATION_ZONE_CONFIGURED true'
          else
            echo 'OVH_DNS_AUTOMATION_ZONE_CONFIGURED false'
          fi
