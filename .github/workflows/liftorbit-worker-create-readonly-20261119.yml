name: LiftOrbit inspect worker create after first completed GA
on:
  push:
    branches: [main]
    paths: [.github/workflows/liftorbit-worker-create-readonly-20261119.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read-only pinpoint worker create and server POST
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$HOME/liftorbit-migration/sources/ovh-app/current"
          python3 - <<'PY'
          from pathlib import Path
          import re
          for fn,indices in [
            ('ga_python_workers/ga_workers/manager.py',range(112,166)),
            ('ga_python_workers/ga_workers/server.py',range(90,125)),
            ('python-ga-upstream.mjs',range(20,41))]:
            ls=Path(fn).read_text().splitlines()
            print('FILE',fn)
            for i in indices:
              l=ls[i-1]
              if re.search(r'password|token|secret|credential|authorization|private.key|http(s)?://|process.env|bun.env|database_url|email',l,re.I):l='[redacted]'
              print('FUNC',i,l[:240])
          PY
          REMOTE