name: LiftOrbit freeze regression browser QA
# Wait for restored per-account optimizer state before actual GA launch.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-freeze-regression-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check current site
        run: |
          curl --fail --silent --show-error --max-time 20 https://app.liftorbit.app/__bridge_health >/dev/null
          command -v google-chrome
      - name: Install browser test driver
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Reproduce large-plan optimization freeze
        run: node ops/ovh/browser-freeze-20261118/profile.mjs
      - name: Verify real isolated optimizer run keeps browser responsive
        env:
          FREEZE_TEST_MODE: single-progress
        run: node ops/ovh/browser-freeze-20261118/live-run.mjs
