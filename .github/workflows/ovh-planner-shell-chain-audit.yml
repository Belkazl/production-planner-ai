name: OVH diagnostic - classify private planner shell chain without disclosing values
on:
  push:
    branches: [ops/railway-migration-20261108]
    paths: [.github/workflows/ovh-planner-shell-chain-audit.yml]
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read protected launcher over authenticated SSH and output structure only
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$OVH_HOST" == '51.255.163.121' && "$OVH_USER" == 'liftorbit-ci' ]] || exit 2
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$dir/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$dir/hosts"
          chmod 0600 "$dir/key" "$dir/hosts"
          ssh -i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/hosts" "$OVH_USER@$OVH_HOST" \
            'cat "$HOME/liftorbit-migration/production/current/gateway.json"' > "$dir/gateway.json"
          python3 - "$dir/gateway.json" <<'PY'
          import json, pathlib, re, shlex, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          legacy=data.get('D_START_GOOD')
          launcher=data.get('PP_GENERIC_RESTORE_LAUNCH_V2')
          if not isinstance(legacy,str) or not isinstance(launcher,str):
              raise SystemExit('OVH_PRIVATE_LAUNCHER_MISSING')
          first=legacy.splitlines()[0]
          print('OVH_PRIVATE_FIRST_LINE_LENGTH',len(first))
          lex=shlex.shlex(first,posix=True,punctuation_chars=';&|<>')
          lex.whitespace_split=True
          lex.commenters=''
          try:
              tokens=list(lex)
          except ValueError:
              print('OVH_LEXER_ERROR_UNBALANCED_QUOTES')
              tokens=[]
          known={'apt-get','update','install','-y','-qq','-q','-s','test','python3','base64','-d','-c',
                 'printf','echo','cat','sh','bash','pip','mkdir','cd','export','true','false',
                 '&&','||','|',';','>','>>','<','>&','2','1','0','2>&1',
                 '-m','-u','-E','env','nohup','timeout','set','tee','mktemp','sed',
                 'psql','pg_isready','which','-f','-e','-n'}
          def safe(t):
              if t in known: return t
              if t.startswith('/tmp/'): return 'TMP_PATH'
              if t.startswith('/srv/'): return 'SRV_PATH'
              if t.startswith('/app/'): return 'APP_PATH'
              if t.startswith('/usr/'): return 'USR_PATH'
              if t.startswith('DATABASE_URL=') or t.startswith('$DATABASE_URL'): return 'DATABASE_VAR'
              if t.startswith('-'): return 'OTHER_OPTION'
              if t.startswith('$'): return 'ENV_REF'
              if len(t)>80: return 'LARGE_VALUE'
              return 'ARG'
          print('OVH_PRIVATE_SHELL_TOKEN_COUNT',len(tokens))
          print('OVH_PRIVATE_SHELL_TOKEN_SHAPE',' '.join(safe(t) for t in tokens[:100]))
          ops=[(i,t) for i,t in enumerate(tokens) if t in ('&&','||','|',';','>','>>','<')]
          print('OVH_PRIVATE_SHELL_OPERATOR_COUNT',len(ops))
          print('OVH_PRIVATE_SHELL_OPERATORS',' '.join(t for _,t in ops[:40]))
          test=re.search(r'test\s+-s\s+(/tmp/[A-Za-z0-9_.-]+)',first)
          if test:
              name=test.group(1)
              loc=test.start()
              print('OVH_TEST_TARGET_RELATIONS',
                    'offset='+str(loc),
                    'head_count='+str(first.count(name)),
                    'full_legacy_count='+str(legacy.count(name)),
                    'launcher_count='+str(launcher.count(name)),
                    'prefix_redirect='+str(bool(re.search(r'>\s*'+re.escape(name),first[:loc]))).lower(),
                    'suffix_redirect='+str(bool(re.search(r'>\s*'+re.escape(name),first[loc:]))).lower())
          print('OVH_LEGACY_LINE_COUNT',len(legacy.splitlines()))
          for i,row in enumerate(legacy.splitlines()[:12],1):
              tags=[name for name,expr in [
                  ('SHELL',r'\bsh\b'),('PYTHON',r'\bpython3?\b'),('APT',r'apt-get'),
                  ('TEST',r'\btest\s+-s'),('B64',r'\bbase64\b'),('REDIR',r'>'),
                  ('PIPE',r'\|'),('TRY',r'\btry\b'),('SUBPROC',r'\bsubprocess\b')] if re.search(expr,row)]
              print('OVH_LEGACY_LINE_SHAPE',i,len(row),','.join(tags) or 'plain')
          lex_all=shlex.shlex(legacy,posix=True,punctuation_chars=';&|<>')
          lex_all.whitespace_split=True
          lex_all.commenters=''
          try:
              full_tokens=list(lex_all)
              print('OVH_PRIVATE_FULL_LEX_SUCCESS',len(full_tokens))
              print('OVH_PRIVATE_FULL_TOKEN_SHAPE',' '.join(safe(t) for t in full_tokens[:95]))
              print('OVH_PRIVATE_FULL_OPS',' '.join(t for t in full_tokens if t in ('&&','||','|',';','>','>>','<'))[:200])
          except ValueError:
              print('OVH_PRIVATE_FULL_LEX_UNBALANCED')
          for i,row in enumerate(legacy.splitlines(),1):
              stripped=row.strip()
              categories=[]
              for prefix,tag in [('import ','PY_IMPORT'),('from ','PY_FROM'),('def ','PY_DEF'),('class ','PY_CLASS'),
                                 ('if ','PY_IF'),('for ','PY_FOR'),('while ','PY_WHILE'),('try:','PY_TRY'),
                                 ('except ','PY_EXCEPT'),('return ','PY_RETURN'),('sh ','SHELL'),
                                 ('python3 ','PY_CMD'),('cat ','CAT'),('echo ','ECHO'),('printf ','PRINTF'),
                                 ('apt-get ','APT'),('test ','TEST'),('#','COMMENT'),('PY','HEREDOC_MARKER')]:
                  if stripped.startswith(prefix): categories.append(tag)
              print('OVH_PRIVATE_FULL_LINE_PREFIX',i,','.join(categories) or 'OTHER')
          import ast,base64
          launch=data.get('PP_GENERIC_RESTORE_LAUNCH_V2','')
          if isinstance(launch,str) and launch:
              try:
                  t=ast.parse(launch)
                  calls=[]
                  keys=[]
                  for node in ast.walk(t):
                      if isinstance(node,ast.Call):
                          f=node.func
                          n=(f.attr if isinstance(f,ast.Attribute) else f.id if isinstance(f,ast.Name) else 'OTHER')
                          if n in ('exec','decode','decompress','b64decode','compile','get','getenv','run','check_call','Popen','loads','join'):
                              calls.append(n)
                      if isinstance(node,ast.Constant) and isinstance(node.value,str):
                          if re.fullmatch(r'[A-Z_][A-Z_0-9]{3,72}',node.value):
                              keys.append(node.value)
                  print('OVH_LAUNCHER_AST_CALLS',','.join(calls[:35]))
                  print('OVH_LAUNCHER_AST_CONFIG_KEYS',','.join(keys[:25]))
              except SyntaxError:
                  print('OVH_LAUNCHER_AST_PARSE_FAILED')
          for k in ('PP_GENERIC_CORE_B64','PP_GENERIC_RESTORE_BOOT_V1','PP_RESTORE_ETALON_BOOT_V1'):
              value=data.get(k,'')
              if not isinstance(value,str): continue
              if k.endswith('B64'):
                  try: value=base64.b64decode(value,validate=True).decode('utf8','replace')
                  except ValueError: value=''
              print('OVH_CORE_DIAG',k,'lines='+str(len(value.splitlines())),
                    'has_legacy_start='+str('D_START_GOOD' in value).lower(),
                    'has_subprocess='+str('subprocess' in value).lower(),
                    'has_server='+str('HTTPServer' in value or 'uvicorn' in value).lower())
          for key in ('PP_GENERIC_RESTORE_BOOT_V1','PP_RESTORE_ETALON_BOOT_V1'):
              src=data.get(key,'')
              if not isinstance(src,str): continue
              try: tree=ast.parse(src)
              except SyntaxError:
                  print('OVH_BOOT_AST',key,'parse=NON_PYTHON')
                  continue
              calls=[]
              constants=[]
              for n in ast.walk(tree):
                  if isinstance(n,ast.Call):
                      f=n.func
                      name=(f.attr if isinstance(f,ast.Attribute) else f.id if isinstance(f,ast.Name) else 'OTHER')
                      if re.fullmatch(r'[A-Za-z][A-Za-z0-9_]{0,35}',name): calls.append(name)
                  if isinstance(n,ast.Constant) and isinstance(n.value,str):
                      if re.fullmatch(r'[A-Z_][A-Z0-9_]{3,70}',n.value):
                          constants.append(n.value)
              print('OVH_BOOT_AST',key,'call_shape='+','.join(calls[:45]))
              print('OVH_BOOT_AST_KEYS',key,','.join(constants[:45]) or 'none')
          for key in ('PP_SETUP_ACTIVE_PATCH_B64','PP_CAP_BATCH_BOOT_V2','PP_GENERIC_CORE_B64'):
              raw=data.get(key)
              if not isinstance(raw,str): continue
              try:
                  decoded=base64.b64decode(raw,validate=True).decode('utf8','replace') if key.endswith('_B64') else raw
              except ValueError: decoded=''
              print('OVH_PATCH_SHAPE',key,'lines='+str(len(decoded.splitlines())),
                    'chars='+str(len(decoded)),
                    'has_D_START='+str('D_START_GOOD' in decoded).lower(),
                    'has_subprocess='+str('subprocess' in decoded).lower(),
                    'has_env='+str('os.environ' in decoded).lower())
              try:
                  tr=ast.parse(decoded)
              except SyntaxError:
                  print('OVH_PATCH_PARSE',key,'not_python')
                  continue
              for line_number in (567,568,569,570,571,572,573,574,575):
                  matches=[n for n in ast.walk(tr) if getattr(n,'lineno',0)==line_number]
                  if not matches: continue
                  calls=[]
                  for n in matches:
                      if isinstance(n,ast.Call):
                          f=n.func
                          c=f.attr if isinstance(f,ast.Attribute) else f.id if isinstance(f,ast.Name) else 'OTHER'
                          if re.fullmatch(r'[A-Za-z][A-Za-z0-9_]{0,35}',c): calls.append(c)
                  print('OVH_PATCH_LINE_SHAPE',key,'line='+str(line_number),
                        'kinds='+','.join(sorted(set(type(n).__name__ for n in matches))[:16]),
                        'calls='+','.join(calls[:12]))
          PY
