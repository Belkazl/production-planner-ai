name: OVH diagnostic - classify private planner shell chain without disclosing values
on:
  push:
    branches: [ops/railway-migration-20261108]
    paths: [.github/workflows/ovh-planner-shell-chain-audit.yml]
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read protected launcher over authenticated SSH and output structure only
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$OVH_HOST" == '51.255.163.121' && "$OVH_USER" == 'liftorbit-ci' ]] || exit 2
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$dir/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$dir/hosts"
          chmod 0600 "$dir/key" "$dir/hosts"
          ssh -i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/hosts" "$OVH_USER@$OVH_HOST" \
            'cat "$HOME/liftorbit-migration/production/current/gateway.json"' > "$dir/gateway.json"
          python3 - "$dir/gateway.json" <<'PY'
          import json, pathlib, re, shlex, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          legacy=data.get('D_START_GOOD')
          launcher=data.get('PP_GENERIC_RESTORE_LAUNCH_V2')
          if not isinstance(legacy,str) or not isinstance(launcher,str):
              raise SystemExit('OVH_PRIVATE_LAUNCHER_MISSING')
          first=legacy.splitlines()[0]
          print('OVH_PRIVATE_FIRST_LINE_LENGTH',len(first))
          lex=shlex.shlex(first,posix=True,punctuation_chars=';&|<>')
          lex.whitespace_split=True
          lex.commenters=''
          try:
              tokens=list(lex)
          except ValueError:
              print('OVH_LEXER_ERROR_UNBALANCED_QUOTES')
              tokens=[]
          known={'apt-get','update','install','-y','-qq','-q','-s','test','python3','base64','-d','-c',
                 'printf','echo','cat','sh','bash','pip','mkdir','cd','export','true','false',
                 '&&','||','|',';','>','>>','<','>&','2','1','0','2>&1',
                 '-m','-u','-E','env','nohup','timeout','set','tee','mktemp','sed',
                 'psql','pg_isready','which','-f','-e','-n'}
          def safe(t):
              if t in known: return t
              if t.startswith('/tmp/'): return 'TMP_PATH'
              if t.startswith('/srv/'): return 'SRV_PATH'
              if t.startswith('/app/'): return 'APP_PATH'
              if t.startswith('/usr/'): return 'USR_PATH'
              if t.startswith('DATABASE_URL=') or t.startswith('$DATABASE_URL'): return 'DATABASE_VAR'
              if t.startswith('-'): return 'OTHER_OPTION'
              if t.startswith('$'): return 'ENV_REF'
              if len(t)>80: return 'LARGE_VALUE'
              return 'ARG'
          print('OVH_PRIVATE_SHELL_TOKEN_COUNT',len(tokens))
          print('OVH_PRIVATE_SHELL_TOKEN_SHAPE',' '.join(safe(t) for t in tokens[:100]))
          ops=[(i,t) for i,t in enumerate(tokens) if t in ('&&','||','|',';','>','>>','<')]
          print('OVH_PRIVATE_SHELL_OPERATOR_COUNT',len(ops))
          print('OVH_PRIVATE_SHELL_OPERATORS',' '.join(t for _,t in ops[:40]))
          test=re.search(r'test\s+-s\s+(/tmp/[A-Za-z0-9_.-]+)',first)
          if test:
              name=test.group(1)
              loc=test.start()
              print('OVH_TEST_TARGET_RELATIONS',
                    'offset='+str(loc),
                    'head_count='+str(first.count(name)),
                    'full_legacy_count='+str(legacy.count(name)),
                    'launcher_count='+str(launcher.count(name)),
                    'prefix_redirect='+str(bool(re.search(r'>\s*'+re.escape(name),first[:loc]))).lower(),
                    'suffix_redirect='+str(bool(re.search(r'>\s*'+re.escape(name),first[loc:]))).lower())
          print('OVH_LEGACY_LINE_COUNT',len(legacy.splitlines()))
          for i,row in enumerate(legacy.splitlines()[:12],1):
              tags=[name for name,expr in [
                  ('SHELL',r'\bsh\b'),('PYTHON',r'\bpython3?\b'),('APT',r'apt-get'),
                  ('TEST',r'\btest\s+-s'),('B64',r'\bbase64\b'),('REDIR',r'>'),
                  ('PIPE',r'\|'),('TRY',r'\btry\b'),('SUBPROC',r'\bsubprocess\b')] if re.search(expr,row)]
              print('OVH_LEGACY_LINE_SHAPE',i,len(row),','.join(tags) or 'plain')
          lex_all=shlex.shlex(legacy,posix=True,punctuation_chars=';&|<>')
          lex_all.whitespace_split=True
          lex_all.commenters=''
          try:
              full_tokens=list(lex_all)
              print('OVH_PRIVATE_FULL_LEX_SUCCESS',len(full_tokens))
              print('OVH_PRIVATE_FULL_TOKEN_SHAPE',' '.join(safe(t) for t in full_tokens[:95]))
              print('OVH_PRIVATE_FULL_OPS',' '.join(t for t in full_tokens if t in ('&&','||','|',';','>','>>','<'))[:200])
          except ValueError:
              print('OVH_PRIVATE_FULL_LEX_UNBALANCED')
          for i,row in enumerate(legacy.splitlines(),1):
              stripped=row.strip()
              categories=[]
              for prefix,tag in [('import ','PY_IMPORT'),('from ','PY_FROM'),('def ','PY_DEF'),('class ','PY_CLASS'),
                                 ('if ','PY_IF'),('for ','PY_FOR'),('while ','PY_WHILE'),('try:','PY_TRY'),
                                 ('except ','PY_EXCEPT'),('return ','PY_RETURN'),('sh ','SHELL'),
                                 ('python3 ','PY_CMD'),('cat ','CAT'),('echo ','ECHO'),('printf ','PRINTF'),
                                 ('apt-get ','APT'),('test ','TEST'),('#','COMMENT'),('PY','HEREDOC_MARKER')]:
                  if stripped.startswith(prefix): categories.append(tag)
              print('OVH_PRIVATE_FULL_LINE_PREFIX',i,','.join(categories) or 'OTHER')
          import ast,base64
          launch=data.get('PP_GENERIC_RESTORE_LAUNCH_V2','')
          if isinstance(launch,str) and launch:
              try:
                  t=ast.parse(launch)
                  calls=[]
                  keys=[]
                  for node in ast.walk(t):
                      if isinstance(node,ast.Call):
                          f=node.func
                          n=(f.attr if isinstance(f,ast.Attribute) else f.id if isinstance(f,ast.Name) else 'OTHER')
                          if n in ('exec','decode','decompress','b64decode','compile','get','getenv','run','check_call','Popen','loads','join'):
                              calls.append(n)
                      if isinstance(node,ast.Constant) and isinstance(node.value,str):
                          if re.fullmatch(r'[A-Z_][A-Z_0-9]{3,72}',node.value):
                              keys.append(node.value)
                  print('OVH_LAUNCHER_AST_CALLS',','.join(calls[:35]))
                  print('OVH_LAUNCHER_AST_CONFIG_KEYS',','.join(keys[:25]))
              except SyntaxError:
                  print('OVH_LAUNCHER_AST_PARSE_FAILED')
          for k in ('PP_GENERIC_CORE_B64','PP_GENERIC_RESTORE_BOOT_V1','PP_RESTORE_ETALON_BOOT_V1'):
              value=data.get(k,'')
              if not isinstance(value,str): continue
              if k.endswith('B64'):
                  try: value=base64.b64decode(value,validate=True).decode('utf8','replace')
                  except ValueError: value=''
              print('OVH_CORE_DIAG',k,'lines='+str(len(value.splitlines())),
                    'has_legacy_start='+str('D_START_GOOD' in value).lower(),
                    'has_subprocess='+str('subprocess' in value).lower(),
                    'has_server='+str('HTTPServer' in value or 'uvicorn' in value).lower())
          for key in ('PP_GENERIC_RESTORE_BOOT_V1','PP_RESTORE_ETALON_BOOT_V1'):
              src=data.get(key,'')
              if not isinstance(src,str): continue
              try: tree=ast.parse(src)
              except SyntaxError:
                  print('OVH_BOOT_AST',key,'parse=NON_PYTHON')
                  continue
              calls=[]
              constants=[]
              for n in ast.walk(tree):
                  if isinstance(n,ast.Call):
                      f=n.func
                      name=(f.attr if isinstance(f,ast.Attribute) else f.id if isinstance(f,ast.Name) else 'OTHER')
                      if re.fullmatch(r'[A-Za-z][A-Za-z0-9_]{0,35}',name): calls.append(name)
                  if isinstance(n,ast.Constant) and isinstance(n.value,str):
                      if re.fullmatch(r'[A-Z_][A-Z0-9_]{3,70}',n.value):
                          constants.append(n.value)
              print('OVH_BOOT_AST',key,'call_shape='+','.join(calls[:45]))
              print('OVH_BOOT_AST_KEYS',key,','.join(constants[:45]) or 'none')
          for key in ('PP_SETUP_ACTIVE_PATCH_B64','PP_CAP_BATCH_BOOT_V2','PP_GENERIC_CORE_B64'):
              raw=data.get(key)
              if not isinstance(raw,str): continue
              try:
                  decoded=base64.b64decode(raw,validate=True).decode('utf8','replace') if key.endswith('_B64') else raw
              except ValueError: decoded=''
              print('OVH_PATCH_SHAPE',key,'lines='+str(len(decoded.splitlines())),
                    'chars='+str(len(decoded)),
                    'has_D_START='+str('D_START_GOOD' in decoded).lower(),
                    'has_subprocess='+str('subprocess' in decoded).lower(),
                    'has_env='+str('os.environ' in decoded).lower())
              try:
                  tr=ast.parse(decoded)
              except SyntaxError:
                  print('OVH_PATCH_PARSE',key,'not_python')
                  continue
              for line_number in (567,568,569,570,571,572,573,574,575):
                  matches=[n for n in ast.walk(tr) if getattr(n,'lineno',0)==line_number]
                  if not matches: continue
                  calls=[]
                  for n in matches:
                      if isinstance(n,ast.Call):
                          f=n.func
                          c=f.attr if isinstance(f,ast.Attribute) else f.id if isinstance(f,ast.Name) else 'OTHER'
                          if re.fullmatch(r'[A-Za-z][A-Za-z0-9_]{0,35}',c): calls.append(c)
                  print('OVH_PATCH_LINE_SHAPE',key,'line='+str(line_number),
                        'kinds='+','.join(sorted(set(type(n).__name__ for n in matches))[:16]),
                        'calls='+','.join(calls[:12]))
          cap=data.get('PP_CAP_BATCH_BOOT_V2','')
          if isinstance(cap,str):
              try: ct=ast.parse(cap)
              except SyntaxError: ct=None
              if ct:
                  for node in ast.walk(ct):
                      if isinstance(node,ast.Call):
                          fn=node.func
                          n=fn.attr if isinstance(fn,ast.Attribute) else fn.id if isinstance(fn,ast.Name) else 'OTHER'
                          if n in ('run','Popen','check_call','check_output','wait','communicate','sleep','getenv','exec','compile'):
                              kw=[x.arg or 'STAR' for x in node.keywords]
                              print('OVH_CAP_CALL',node.lineno,n,'keywords='+','.join(kw[:14]),
                                    'arguments='+str(len(node.args)))
                  for i,row in enumerate(cap.splitlines(),1):
                      if any(w in row for w in ('D_START_GOOD','subprocess.run','subprocess.Popen','PP_CAP_BATCH_BOOT')):
                          tags=[w for w in ('D_START_GOOD','subprocess.run','subprocess.Popen','PP_CAP_BATCH_BOOT') if w in row]
                          print('OVH_CAP_RELEVANT_LINE',i,','.join(tags),'length='+str(len(row)))
          if isinstance(cap,str):
              try: tree=ast.parse(cap)
              except SyntaxError: tree=None
              if tree:
                  class RedactStrings(ast.NodeTransformer):
                      def visit_Constant(self,node):
                          if isinstance(node.value,str): return ast.copy_location(ast.Constant(value='HIDDEN_LITERAL'),node)
                          if isinstance(node.value,(int,float)): return ast.copy_location(ast.Constant(value=0),node)
                          return node
                  printed=set()
                  for n in ast.walk(tree):
                      if 64<=getattr(n,'lineno',0)<=69 and type(n).__name__ in ('Assign','Expr','If','AugAssign','Return','Raise'):
                          key=(n.lineno,type(n).__name__)
                          if key in printed: continue
                          printed.add(key)
                          clean=RedactStrings().visit(ast.fix_missing_locations(ast.parse(ast.unparse(n))))
                          anonymized=ast.unparse(clean).replace('\n',' ')
                          print('OVH_CAP_TAIL_AST',n.lineno,type(n).__name__,anonymized[:420])
          import subprocess
          if isinstance(cap,str):
              try: ct=ast.parse(cap)
              except SyntaxError: ct=None
              if ct:
                  changes=[n for n in ast.walk(ct) if isinstance(n,ast.Call)
                           and isinstance(n.func,ast.Attribute) and n.func.attr=='replace'
                           and getattr(n,'lineno',0)==68 and len(n.args)>=2]
                  if changes:
                      n=changes[0]
                      if all(isinstance(x,ast.Constant) and isinstance(x.value,str) for x in n.args[:2]):
                          old,new=[x.value for x in n.args[:2]]
                          count=n.args[2].value if len(n.args)>=3 and isinstance(n.args[2],ast.Constant) else 1
                          original=shlex.split(data['D_START_GOOD'])[2]
                          patched=original.replace(old,new,count)
                          print('OVH_PATCH_SHELL_CHANGE','old_len='+str(len(old)),
                                'new_len='+str(len(new)),'occurrences='+str(original.count(old)),
                                'patch_delta='+str(len(patched)-len(original)))
                          for label,value in [('OLD',old),('NEW',new)]:
                              tags=[token for token in ('python3','base64','psql','postgresql','DATABASE_URL','PP_','import','from ','env','http','/tmp/') if token in value]
                              print('OVH_PATCH_REPLACEMENT_CATEGORIES',label,','.join(tags) or 'OTHER')
                          for name,src in [('ORIGINAL',original),('PATCHED',patched)]:
                              proc=subprocess.run(['sh','-n','-c',src],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=8)
                              print('OVH_PATCH_SHELL_SYNTAX',name,'return='+str(proc.returncode),
                                    'stderr_bytes='+str(len(proc.stderr)))
          if isinstance(cap,str):
              try: tr=ast.parse(cap)
              except SyntaxError: tr=None
              if tr:
                  nodes=[n for n in ast.walk(tr) if isinstance(n,ast.Call)
                         and isinstance(n.func,ast.Attribute) and n.func.attr=='replace'
                         and getattr(n,'lineno',0)==68 and len(n.args)>=2]
                  if nodes and all(isinstance(a,ast.Constant) and isinstance(a.value,str) for a in nodes[0].args[:2]):
                      old,new=[a.value for a in nodes[0].args[:2]]
                      first=shlex.split(data['D_START_GOOD'])[2]
                      for group,label in [(old,'OLD'),(new,'NEW'),(first,'ORIGINAL')]:
                          matches=list(dict.fromkeys(re.findall(r'/tmp/[A-Za-z0-9_.-]+',group)))
                          print('OVH_PATCH_TEMP_FILES',label,'count='+str(len(matches)),
                                'has_python='+str('python3' in group).lower(),
                                'has_env='+str('env' in group).lower())
                          for i,v in enumerate(matches[:6],1):
                              print('OVH_PATCH_TEMP_RELATION',label,i,
                                    'len='+str(len(v)),
                                    'in_original='+str(v in first).lower(),
                                    'in_new='+str(v in new).lower(),
                                    'prior_written='+str(bool(re.search(r'>\s*'+re.escape(v),first[:first.find(v)]))).lower())
                      try: toks=shlex.split(new)
                      except ValueError: toks=[]
                      print('OVH_PATCH_NEW_TOKENS',' '.join(safe(t) for t in toks[:30]))
          # Resolve why the protected etalon restore aborts: emit structural statistics only.
          # Compare the expected etalon write anchor with the actual protected runtime text.
          # Locate the exact database-target error in protected runtime source, without printing source.
          _needle='PP_FIX_VERIFY_DB_TARGET_MISSING'
          for _key,_value in data.items():
              if not isinstance(_value,str) or not _key.startswith('PP_'): continue
              _variants=[('plain',_value)]
              if _key.endswith('_B64'):
                  try: _variants.append(('decoded',base64.b64decode(_value,validate=True).decode('utf8')))
                  except Exception: pass
              for _kind,_source in _variants:
                  if _needle not in _source: continue
                  _lines=_source.splitlines()
                  _locations=[i for i,line in enumerate(_lines,1) if _needle in line]
                  print('OVH_DB_TARGET_ERROR_SOURCE',_key,_kind,
                        'lines='+str(len(_lines)),'occurrences='+str(len(_locations)),
                        'line_numbers='+','.join(str(i) for i in _locations[:8]))
                  try: _tree=ast.parse(_source)
                  except SyntaxError:
                      print('OVH_DB_TARGET_ERROR_SOURCE_PARSE',_key,'not_python')
                      continue
                  for _n in ast.walk(_tree):
                      if isinstance(_n,ast.Raise) and isinstance(_n.exc,ast.Call) and _n.exc.args:
                          _v=_n.exc.args[0]
                          if isinstance(_v,ast.Constant) and _v.value==_needle:
                              print('OVH_DB_TARGET_RAISE',_key,'line='+str(_n.lineno))
                              _parent=[node for node in ast.walk(_tree)
                                       if isinstance(node,(ast.If,ast.Try)) and node.lineno<=_n.lineno <=getattr(node,'end_lineno',_n.lineno)]
                              for _item in sorted(_parent,key=lambda x:getattr(x,'end_lineno',0)-x.lineno)[:2]:
                                  _anon=_HideAnchorLiterals().visit(ast.fix_missing_locations(ast.parse(ast.unparse(_item))))
                                  print('OVH_DB_TARGET_GUARD_ANON',_key,
                                        ast.unparse(_anon).replace(chr(10),' ')[:500])
          
          class _HideAnchorLiterals(ast.NodeTransformer):
              def visit_Constant(self,node):
                  if isinstance(node.value,str):
                      return ast.copy_location(ast.Constant(value='STR_LEN_'+str(len(node.value))),node)
                  if isinstance(node.value,(int,float)):
                      return ast.copy_location(ast.Constant(value=0),node)
                  return node
          import difflib
          _boot=data.get('PP_RESTORE_ETALON_BOOT_V1','')
          _cap=data.get('PP_CAP_BATCH_BOOT_V2','')
          if isinstance(_boot,str) and isinstance(_cap,str):
              _bt=ast.parse(_boot)
              _lits={}
              for _st in _bt.body:
                  if isinstance(_st,ast.Assign) and len(_st.targets)==1 and isinstance(_st.targets[0],ast.Name):
                      if isinstance(_st.value,ast.Constant) and isinstance(_st.value.value,str):
                          _lits[_st.targets[0].id]=_st.value.value
              _needle=_lits.get('needle','')
              _replacement=_lits.get('replacement','')
              print('OVH_ANCHOR_NEEDLE_LENGTH',len(_needle),'lines='+str(len(_needle.splitlines())))
              print('OVH_ANCHOR_NEEDLE_MATCHES_CURRENT_CAP',_cap.count(_needle) if _needle else 0)
              _chunks=_cap.splitlines()
              if _needle:
                  _ranges=[]
                  for _i in range(len(_chunks)):
                      for _span in range(1,min(7,len(_chunks)-_i)+1):
                          _s='\\n'.join(_chunks[_i:_i+_span])
                          _ratio=difflib.SequenceMatcher(None,_needle,_s,autojunk=False).ratio()
                          _ranges.append((_ratio,_i+1,_span,len(_s)))
                  for _ratio,_lineno,_span,_size in sorted(_ranges,reverse=True)[:5]:
                      print('OVH_ANCHOR_NEAREST_WINDOW','line='+str(_lineno),
                            'lines='+str(_span),'chars='+str(_size),
                            'similarity_per_mille='+str(round(_ratio*1000)))
                  for _term in ('subprocess.run','D_START_GOOD','python3','os.environ','write_text','open(','exec(','compile(','start','cap','PP_'):
                      print('OVH_ANCHOR_TOKEN_PRESENCE',_term.replace('(','_'),
                            'needle='+str(_term in _needle).lower(),
                            'replacement='+str(_term in _replacement).lower(),
                            'cap='+str(_term in _cap).lower())
                  for _part,_val in (('needle',_needle),('replacement',_replacement)):
                      try:
                          _anonymous=ast.unparse(_HideAnchorLiterals().visit(ast.parse(_val)))
                          print('OVH_ANCHOR_AST_ANON',_part,_anonymous.replace(chr(10),' ')[:700])
                      except SyntaxError:
                          print('OVH_ANCHOR_AST_ANON',_part,'NOT_STANDALONE_PYTHON')
          
          # Anonymized AST for exact anchor mismatch, with ALL string and numeric literals stripped.
          class _HideLiterals(ast.NodeTransformer):
              def visit_Constant(self,node):
                  if isinstance(node.value,str):
                      return ast.copy_location(ast.Constant(value='STR_LEN_'+str(len(node.value))),node)
                  if isinstance(node.value,(int,float)):
                      return ast.copy_location(ast.Constant(value=0),node)
                  return node
          _restore=data.get('PP_RESTORE_ETALON_BOOT_V1','')
          if isinstance(_restore,str):
              _ast=ast.parse(_restore)
              _anon=_HideLiterals().visit(_ast)
              for _idx,_statement in enumerate(_anon.body,1):
                  _shape=ast.unparse(_statement).replace(chr(10),' ')
                  print('OVH_RESTORE_AST_REDACTED',_idx,type(_statement).__name__,_shape[:750])
          
          for _key in ('PP_GENERIC_RESTORE_BOOT_V1','PP_RESTORE_ETALON_BOOT_V1'):
              _source=data.get(_key,'')
              if not isinstance(_source,str): continue
              try: _tree=ast.parse(_source)
              except SyntaxError:
                  print('OVH_ANCHOR_PARSE_FAIL',_key)
                  continue
              for _n in ast.walk(_tree):
                  if isinstance(_n,ast.Raise) and isinstance(_n.exc,ast.Call) and _n.exc.args:
                      _arg=_n.exc.args[0]
                      if isinstance(_arg,ast.Constant) and isinstance(_arg.value,str):
                          _v=_arg.value
                          _ok=(_v=='PP_RESTORE_WRITE_ANCHOR_MISSING')
                          print('OVH_RESTORE_RAISE',_key,'line='+str(_n.lineno),
                                'is_known_anchor_missing='+str(_ok).lower(),
                                'message_length='+str(len(_v)))
                  if isinstance(_n,ast.Call) and isinstance(_n.func,ast.Attribute) and _n.func.attr=='replace':
                      _args=_n.args
                      _anchor=_args[0].value if _args and isinstance(_args[0],ast.Constant) and isinstance(_args[0].value,str) else None
                      _replacement=_args[1].value if len(_args)>=2 and isinstance(_args[1],ast.Constant) and isinstance(_args[1].value,str) else None
                      print('OVH_RESTORE_REPLACE_SHAPE',_key,
                            'line='+str(_n.lineno),
                            'anchor_constant='+str(_anchor is not None).lower(),
                            'replacement_constant='+str(_replacement is not None).lower(),
                            'anchor_length='+str(len(_anchor)) if _anchor is not None else 'dynamic',
                            'replacement_length='+str(len(_replacement)) if _replacement is not None else 'dynamic')
                      if _anchor:
                          for _target in ('PP_CAP_BATCH_BOOT_V2','PP_GENERIC_RESTORE_BOOT_V1','PP_RESTORE_ETALON_BOOT_V1'):
                              _t=data.get(_target,'')
                              print('OVH_RESTORE_ANCHOR_PRESENCE',_key,_target,
                                    'count='+str(_t.count(_anchor)) if isinstance(_t,str) else 'not_string')
          PY
