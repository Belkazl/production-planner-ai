name: QA landing without Russian screenshot block
on:
  push:
    branches: [landing/v4-hide-russian-screenshot-block-2026-10-15]
    paths:
      - index.html
      - site.js
      - site.css
      - server.ts
      - tests/landing-v4-no-russian-gallery.cjs
      - .github/workflows/landing-v4-qa.yml
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the isolated landing build
        run: |
          test -f index.html
          test -f site.js
          test ! -f auth-bridge.ts
          bun build ./server.ts --target=bun --outdir=/tmp/landing-v4-build
          node --check site.js
      - name: Install Chromium for browser and screenshot QA
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Test platform visuals, removed gallery and full responsive regression
        run: |
          PORT=3000 bun server.ts > /tmp/landing-v4.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          node tests/landing-smoke.cjs
          node tests/landing-benefits.cjs
          node tests/landing-v4-no-russian-gallery.cjs
      - name: Keep responsive screenshots of the cleaned landing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prodplan-landing-v4-cleaned-desktop-mobile
          path: |
            landing-v4-*.png
          if-no-files-found: ignore
          retention-days: 7
