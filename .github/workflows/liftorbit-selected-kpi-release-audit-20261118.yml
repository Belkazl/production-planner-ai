name: LiftOrbit selected KPI release workflow quick audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-selected-kpi-release-audit-20261118.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Record latest KPI chosen reference release jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file=ops/ovh/test-results/kpi-selected-plan-workflow-runs-latest.txt
          mkdir -p "$(dirname "$file")"
          gh api 'repos/Belkazl/production-planner-ai/actions/workflows/liftorbit-ovh-kpi-selected-plan-release-20261118.yml/runs?per_page=8' --jq '.workflow_runs[] | "run_id=\(.id) status=\(.status) conclusion=\(.conclusion) event=\(.event) sha=\(.head_sha[0:10])"' > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record selected KPI release run status'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
          fi
