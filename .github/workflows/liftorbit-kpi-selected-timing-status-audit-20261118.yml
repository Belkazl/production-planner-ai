name: LiftOrbit audit selected KPI timing release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-kpi-selected-timing-status-audit-20261118.yml
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Save safe run-state summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          path=ops/ovh/test-results/kpi-selected-timing-runs-latest.txt
          mkdir -p "$(dirname "$path")"
          gh api 'repos/Belkazl/production-planner-ai/actions/workflows/liftorbit-ovh-kpi-selected-timing-fix-20261118.yml/runs?per_page=8' --jq '.workflow_runs[] | "id=\(.id) status=\(.status) conclusion=\(.conclusion) sha=\(.head_sha[0:10])"' > "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: report selected KPI timing release run'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
          fi
