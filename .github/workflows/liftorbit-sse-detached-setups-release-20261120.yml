name: LiftOrbit restore real setup_operations in interim SSE Gantt
on:
  push:
    branches: [main, fix/sse-detached-setup-operations-20261120]
    paths:
      - .github/workflows/liftorbit-sse-detached-setups-release-20261120.yml
      - ops/ovh/sse-detached-setups-20261120/**
      - ops/ovh/sse-stream-v1-20261120/backend-stream.js.txt
      - ops/ovh/sse-stream-v1-20261120/test-backend.mjs
      - ops/ovh/sse-stream-v1-20261120/build-live-qa.mjs
permissions: {contents: read}
concurrency:
  group: liftorbit-sse-detached-setups-ovh
  cancel-in-progress: false
jobs:
  validate_and_deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Verify both setup schemas and real Gantt; deploy to OVH on main only
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            bash ops/ovh/sse-detached-setups-20261120/deploy.sh
          else
            DETACHED_SETUP_PREFLIGHT_ONLY=yes bash ops/ovh/sse-detached-setups-20261120/deploy.sh
          fi
