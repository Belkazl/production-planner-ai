name: LiftOrbit manager exact startup state/progress source read-only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-manager-stage-readonly-20261119.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Inspect worker startup and progress reporting only (no account data)
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121" && test "$USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$HOME/liftorbit-migration/sources/ovh-app/current"
          python3 - <<'PY'
          from pathlib import Path
          targets=[("manager","ga_python_workers/ga_workers/manager.py"),("adapter","ga_python_workers/ga_workers/full_runtime_adapter.py")]
          for name,p in targets:
              lines=Path(p).read_text().splitlines()
              print("TARGET_START",name,len(lines))
              if name=="manager": intervals=[(1,142),(182,305)]
              else:intervals=[(113,186)]
              for start,end in intervals:
                  for i in range(start-1,min(len(lines),end)):
                      line=lines[i]
                      if any(x in line.lower() for x in ("secret","password","token","authorization","cookie","os.getenv")):
                          print(f"{i+1}: [redacted]");continue
                      print(f"{i+1}: {line[:240]}")
              print("TARGET_END",name)
          PY
          REMOTE
