name: LiftOrbit find raw GA candidate hook
on:
  push:
    branches: [main]
    paths: [.github/workflows/liftorbit-ga-candidate-hook-audit-20261120.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect in-memory optimizer candidate exposure without changing the worker
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121" && test "$USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20)
          base=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/current
          mkdir -p current
          scp -q "${opts[@]}" "$USER@$HOST:$base/ga_python_workers/ga_workers/compile_legacy_ga.py" current/compile.py
          scp -q "${opts[@]}" "$USER@$HOST:$base/ga_python_workers/ga_workers/full_runtime_adapter.py" current/adapter.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          red=re.compile(r'(?i)(password|private.key|credential|cookie|authorization|process.env|database_url|api.key|\bsecret\b|\btoken\b)')
          for fn in ('compile.py','adapter.py'):
            lines=(Path('current')/fn).read_text().splitlines()
            print('FILE',fn,len(lines))
            for i,line in enumerate(lines):
              if fn=='compile.py' and i>179:break
              if fn=='adapter.py' and not (i<75 or i>145):continue
              s=line.rstrip()
              if red.search(s):s='[redacted]'
              print('SOURCE',fn,i+1,s[:210])
          PY