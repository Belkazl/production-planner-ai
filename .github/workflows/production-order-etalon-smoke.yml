name: Production etalon order volume smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  read-only-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome for UI inspection
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Check deployed order editor with real ceramic model
        run: node tests/production-order-etalon-smoke.cjs
      - name: Save production screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-2026-10-13-order-etalon
          path: production-orders-collapsed.png
          retention-days: 7
          if-no-files-found: ignore
