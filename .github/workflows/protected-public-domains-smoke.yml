name: Verify protected production entrypoints
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify public entrypoints reject unauthenticated data requests
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,time
          domains=["https://production-planner-gateway-v2-production.up.railway.app","https://aps-setup-bridge-candidate-v2-production.up.railway.app"]
          for base in domains:
            def call(path,method="GET",origin=None,payload=None):
              h={"Cache-Control":"no-cache","User-Agent":"ProdPlanProtectedPublicAudit/1.0"}
              if origin:h["Origin"]=origin;h["Sec-Fetch-Site"]="same-origin"
              if payload is not None:h["Content-Type"]="application/json"
              body=json.dumps(payload).encode() if payload is not None else None
              req=urllib.request.Request(base+path,method=method,headers=h,data=body)
              try:
                with urllib.request.urlopen(req,timeout=25) as r:return r.status,r.read(80000).decode("utf8","replace")
              except urllib.error.HTTPError as e:return e.code,e.read(15000).decode("utf8","replace")
              except Exception as e:return 0,str(e)[:200]
            for retry in range(12):
              code,h=call("/")
              if code==200 and 'id="loginTab"' in h and 'type="password"' in h:break
              time.sleep(4)
            print("PROTECTED_ROOT",base,code,flush=True)
            assert code==200 and 'type="password"' in h and "ppGanttToolV2" not in h,(base,code,h[:190])
            for path in ["/api/db-storage","/api/plan-progress","/api/plan","/api/model","/api/orders"]:
              status,body=call(path)
              assert status==401,(base,path,status,body[:100])
            for path in ["/api/db-storage","/api/optimizer-stop"]:
              status,body=call(path,"POST",base,{"mutation":"unauthorized"})
              assert status==401,(base,path,status,body[:100])
            status,body=call("/api/auth/login","POST",base,{"email":"nobody+securitycheck@no-such-account.invalid","password":"synthetic-invalid-value"})
            print("SYNTHETIC_LOGIN",base,status,flush=True)
            assert status in (400,401,422) and "cross_origin_forbidden" not in body,(base,status,body[:100])
            print("PROTECTED_ENDPOINT_PASS",base,flush=True)
          print("ALL_PUBLIC_PROTECTED_ENDPOINTS_PASS",flush=True)
          PY
