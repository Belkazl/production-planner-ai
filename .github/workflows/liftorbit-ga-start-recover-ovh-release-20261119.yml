name: LiftOrbit recover from real HTTP 502 on second account GA start
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-start-recover-ovh-release-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Preflight production SHA and Chrome start recovery scenarios
        id: preflight
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121" && test "$USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20)
          root=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/current
          mkdir -p old new
          scp -q "${opts[@]}" "$USER@$HOST:$root/async-plan-transport.js" old/async-plan-transport.js
          cp old/async-plan-transport.js new/async-plan-transport.js
          scp -q "${opts[@]}" "$USER@$HOST:$root/python-ga-upstream.mjs" new/python-ga-upstream.mjs
          scp -q "${opts[@]}" "$USER@$HOST:$root/tests/async-plan-transport-contract.cjs" "$RUNNER_TEMP/async-plan-transport-contract.cjs"
          node ops/ovh/ga-start-recover-20261119/patch.mjs new
          node --check new/async-plan-transport.js
          (cd new && node "$RUNNER_TEMP/async-plan-transport-contract.cjs")
          echo GA_START_EXISTING_PRODUCTION_BUILD_CONTRACT_PASS
          node --check ops/ovh/ga-start-recover-20261119/live-regression.mjs
          diff -u old/async-plan-transport.js new/async-plan-transport.js > "$RUNNER_TEMP/ga-start-one-file.diff" || test "$?" -eq 1
          test "$(grep -c '^@@' "$RUNNER_TEMP/ga-start-one-file.diff")" = 1
          sha256sum old/async-plan-transport.js | cut -d' ' -f1 > "$RUNNER_TEMP/old.sha"
          sha256sum new/async-plan-transport.js | cut -d' ' -f1 > "$RUNNER_TEMP/new.sha"
          command -v google-chrome
          npm install --no-save --no-package-lock playwright-core@1.57.0
          node ops/ovh/ga-start-recover-20261119/browser.cjs new/async-plan-transport.js
          echo GA_START_RECOVERY_PREFLIGHT_PASS
      - name: Deploy one transport source with SHA guard and exact rollback
        id: rollout
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121" && test "$USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20)
          old=$(cat "$RUNNER_TEMP/old.sha")
          new=$(cat "$RUNNER_TEMP/new.sha")
          root=/home/liftorbit-ci/liftorbit-migration
          scp -q "${opts[@]}" new/async-plan-transport.js "$USER@$HOST:$root/sources/ovh-app/async-plan-transport-ga-start-recover-20261119.next"
          ssh "${opts[@]}" "$USER@$HOST" bash -s -- "$old" "$new" <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/liftorbit-migration"
          live="$root/sources/ovh-app/current/async-plan-transport.js"
          staged="$root/sources/ovh-app/async-plan-transport-ga-start-recover-20261119.next"
          backup="$root/patch-backups/ga-start-recover-20261119"
          sha(){ sha256sum "$1" | cut -d' ' -f1; }
          test -r "$live" && test -r "$staged"
          test "$(sha "$live")" = "$1" && test "$(sha "$staged")" = "$2"
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          mkdir -p "$backup"
          cp -p "$live" "$backup/async-plan-transport.js"
          test "$(sha "$backup/async-plan-transport.js")" = "$1"
          rollback(){
            trap - ERR
            cp -p "$backup/async-plan-transport.js" "$live" || true
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo GA_START_RECOVERY_AUTOROLLBACK_ATTEMPTED
          }
          trap rollback ERR
          mv "$staged" "$live"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          healthy=no
          for attempt in $(seq 1 24); do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes
          test "$(sha "$live")" = "$2"
          trap - ERR
          echo GA_START_RECOVERY_OVH_INSTALLED
          REMOTE
      - name: Verify public health and guest auth status
        id: health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            health=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/__bridge_health || true)
            guest=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/api/auth/me || true)
            if [[ "$health" = 200 && "$guest" = 401 ]]; then echo GA_START_RECOVERY_PUBLIC_HEALTHY; exit 0; fi
            sleep 4
          done
          exit 1
      - name: 'Live Chrome 886 operations plus Continue with real start masked as HTML 502'
        id: live
        shell: bash
        env:
          FREEZE_TEST_MODE: deployed
        run: |
          set -euo pipefail
          node ops/ovh/ga-start-recover-20261119/live-regression.mjs
          echo GA_START_RECOVERY_LIVE_886_CONTINUE_PASS
      - name: Restore exact source if live authenticated QA fails
        if: ${{ failure() && steps.rollout.outcome == 'success' }}
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121" && test "$USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20)
          ssh "${opts[@]}" "$USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          root="$HOME/liftorbit-migration"
          live="$root/sources/ovh-app/current/async-plan-transport.js"
          backup="$root/patch-backups/ga-start-recover-20261119"
          test -r "$backup/async-plan-transport.js"
          cp -p "$backup/async-plan-transport.js" "$live"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/qa-rollback-private.log" 2>&1
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          echo GA_START_RECOVERY_ROLLBACK_VALIDATED
          REMOTE
      - name: Summarize verified runtime start recovery release
        if: always()
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          ROLLOUT: ${{ steps.rollout.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          LIVE: ${{ steps.live.outcome }}
        run: echo "GA_START_RECOVERY_RELEASE preflight=$PREFLIGHT rollout=$ROLLOUT health=$HEALTH live=$LIVE"
