name: Read OVH units build failure safely
on:
  push:
    branches: [diagnose/units-build-failure-20261123]
    paths: [.github/workflows/liftorbit-units-build-failure-audit-20261123.yml]
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read redacted build error diagnostics only
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = 51.255.163.121
          test "$USER" = liftorbit-ci
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$KEY" > "$d/key"
          printf '%s\n' "$KH" > "$d/kh"
          chmod 600 "$d/key" "$d/kh"
          ssh -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" "$USER@$HOST" python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path.home()/"liftorbit-migration/patch-backups/resource-units-single-source-20261123/update-private.log"
          print("BUILD_LOG_FOUND",p.exists())
          if p.exists():
            lines=p.read_text(errors="replace").splitlines()
            print("LINES",len(lines))
            hits=[i for i,l in enumerate(lines) if re.search(r'error|failed|build|exception|unexpected|ModuleNotFound|exit code|bun:|SyntaxError|PP_.*ANCHOR|src/|Dockerfile|RUN bun',l,re.I)]
            seen=set()
            for i in hits[-80:]:
              for j in range(max(0,i-1),min(len(lines),i+2)):
                if j in seen:continue
                seen.add(j)
                line=lines[j]
                if re.search(r'password|private.key|bearer|authorization|secret|credential|token',line,re.I):line="[REDACTED]"
                print(f"{j+1:04d}: {line[:230]}")
          PY