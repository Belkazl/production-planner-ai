name: LiftOrbit OVH Stop button cancellation UI recovery 2026-11-17
# Repair Stop UI after confirmed GA cancellation; do not alter worker, Gantt or project data.
# Only stop-ui.js changes with strict SHA, Docker preflight and rollback.
# Worker cancel live 44057183015 and Stop race 44059488526 passed.
# Tested delayed GA error, cancelled worker HTTP409 and early Stop.
# Strict stop source SHA and account-scoped API cancellation required.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ovh-stop-ui-recovery-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'release(liftorbit): repair Stop button after confirmed GA cancellation')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable production app
        uses: actions/checkout@v4
        with:
          ref: 4a1457d6f33e7ef5b6e8ad59c3e21ef345b8c25f
          path: pinned
          persist-credentials: false
      - name: Checkout previous verified OVH patch
        uses: actions/checkout@v4
        with:
          ref: 4765adaf3fe2c22f6130a23b87544dd36eb4b36f
          path: prior
          persist-credentials: false
      - name: Checkout tested Stop UI
        uses: actions/checkout@v4
        with:
          ref: 1a949a33a26500afed651cb316c94c9a0f2fba61
          path: repaired
          persist-credentials: false
      - name: Checkout already released GA JSON compactor
        uses: actions/checkout@v4
        with:
          ref: 0158a0514b7bca113fee92b2389747d081a8a1f6
          path: compact
          persist-credentials: false
      - name: Verify exact one-file change and pinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p old/app new/app app
          cp -a pinned/. old/app/
          cp -a pinned/. new/app/
          cp repaired/stop-ui.js new/app/stop-ui.js
          for side in old new; do
            for script in patch-runtime-origins.mjs repair-planner-ui.mjs repair-ga-state.mjs repair-ga-load.mjs repair-continuation.mjs repair-async-ga.mjs; do
              node "prior/ops/ovh/$script" "$side/app"
            done
            node compact/ops/ovh/compact-ga-progress.mjs "$side/app"
          done
          node --check old/app/stop-ui.js
          node --check new/app/stop-ui.js
          (cd new/app && node tests/early-stop-contract.cjs)
          grep -q 'ppScheduleStopReconciliation' new/app/stop-ui.js
          grep -q 'ppConfirmStoppedAfterAmbiguousResponse' new/app/stop-ui.js
          diff -qr old/app new/app > "$RUNNER_TEMP/ga-stop-patch-diff" || test "$?" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/ga-stop-patch-diff")" -eq 1
          grep -Fqx 'Files old/app/stop-ui.js and new/app/stop-ui.js differ' "$RUNNER_TEMP/ga-stop-patch-diff"
          grep -q 'ppScheduleStopReconciliation' new/app/stop-ui.js
          sha256sum old/app/stop-ui.js | cut -d' ' -f1 > old.stop-ui.sha
          sha256sum new/app/stop-ui.js | cut -d' ' -f1 > new.stop-ui.sha
          echo 'GA_STOP_EXACT_ONE_STOP_UI_FILE_CHANGED'
          docker build --quiet -t liftorbit-stop-release:preflight new/app > "$RUNNER_TEMP/ga-stop-build.log" 2>&1 || {
            echo 'GA_STOP_DOCKER_PRECHECK_FAILED'
            exit 22
          }
          echo 'GA_STOP_DOCKER_PRECHECK_PASS'
      - name: Apply guarded OVH app update with automatic rollback
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test "$OVH_HOST" = "51.255.163.121"
          test "$OVH_USER" = "liftorbit-ci"
          test -n "$OVH_SSH_PRIVATE_KEY"
          test -n "$OVH_SSH_KNOWN_HOSTS"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20)
          target="$OVH_USER@$OVH_HOST"
          oldSha=$(cat old.stop-ui.sha)
          newSha=$(cat new.stop-ui.sha)
          root=/home/liftorbit-ci/liftorbit-migration
          scp -q "${opts[@]}" new/app/stop-ui.js "$target:$root/sources/ovh-app/stop-ui.js.stop.next"
          ssh "${opts[@]}" "$target" bash -s -- "$oldSha" "$newSha" <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/liftorbit-migration"
          app="$root/sources/ovh-app/current/stop-ui.js"
          next="$root/sources/ovh-app/stop-ui.js.stop.next"
          backup="$root/patch-backups/ga-stop-ui-20261117"
          expectedOld="$1"; expectedNew="$2"
          sha(){ sha256sum "$1" | cut -d' ' -f1; }
          test -f "$app" && test -f "$next"
          test "$(sha "$app")" = "$expectedOld" || { echo 'GA_STOP_SOURCE_DRIFT_ABORT'; exit 5; }
          test "$(sha "$next")" = "$expectedNew" || { echo 'GA_STOP_UPLOAD_HASH_MISMATCH'; exit 5; }
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null || { echo 'GA_STOP_PREDEPLOY_SMOKE_FAILED'; exit 6; }
          mkdir -p "$backup"
          cp -p "$app" "$backup/stop-ui.js"
          test "$(sha "$backup/stop-ui.js")" = "$expectedOld"
          rollback(){
            trap - ERR
            cp -p "$backup/stop-ui.js" "$app" || true
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo 'GA_STOP_AUTOMATIC_ROLLBACK_ATTEMPTED'
          }
          trap rollback ERR
          mv "$next" "$app"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          healthy=no
          for attempt in $(seq 1 24); do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes || { echo 'GA_STOP_POSTDEPLOY_HEALTH_FAILED'; false; }
          test "$(sha "$app")" = "$expectedNew"
          trap - ERR
          echo 'GA_STOP_UI_OVH_DEPLOYED_HEALTHY'
          REMOTE
      - name: Public HTTPS, guest boundary and no redirect
        shell: bash
        run: |
          set -euo pipefail
          healthy=no
          for attempt in $(seq 1 15); do
            public=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 https://app.liftorbit.app/__bridge_health || true)
            direct=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 --resolve app.liftorbit.app:443:51.255.163.121 https://app.liftorbit.app/__bridge_health || true)
            auth=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 https://app.liftorbit.app/api/auth/me || true)
            if [[ "$public" = 200 && "$direct" = 200 && "$auth" = 401 ]]; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes
          echo 'GA_STOP_PUBLIC_API_HEALTHY'
