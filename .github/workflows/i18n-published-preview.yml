name: Verify published English/Russian QA preview
on:
  push:
    branches: [feature/2026-10-15-i18n-complete-ui]
  workflow_dispatch:
jobs:
  public-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Visit actual i18n QA deployment (read only)
        run: node tests/i18n-published-preview.cjs
      - name: Save both-language screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-published-preview-en-ru
          path: |
            locale-qa-login-en.png
            locale-qa-login-ru.png
          retention-days: 3
          if-no-files-found: ignore
