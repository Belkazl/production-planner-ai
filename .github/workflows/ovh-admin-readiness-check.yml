name: OVH read-only administrator readiness check
# 2026-11-09 post-integration readiness after six-service CI success.
on:
  push:
    branches: [ops/railway-migration-20261108]
    paths: [.github/workflows/ovh-admin-readiness-check.yml]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check existing SSH scope and installed bootstrap (no mutations)
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$OVH_HOST" == 51.255.163.121 && "$OVH_USER" == liftorbit-ci ]] || exit 2
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$tmp/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$tmp/hosts"
          chmod 600 "$tmp/key" "$tmp/hosts"
          ssh -i "$tmp/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$tmp/hosts" "$OVH_USER@$OVH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          if sudo -n true 2>/dev/null; then
            echo 'OVH_UNATTENDED_ADMIN_POSSIBLE'
          else
            echo 'OVH_UNATTENDED_ADMIN_NOT_AVAILABLE'
          fi
          if [[ -x /usr/local/sbin/liftorbit-ops ]]; then
            echo 'OVH_STAGING_HELPER_PRESENT'
            if sudo -n -l /usr/local/sbin/liftorbit-ops status >/dev/null 2>&1; then
              echo 'OVH_RESTRICTED_HELPER_AVAILABLE'
            else
              echo 'OVH_RESTRICTED_HELPER_NOT_AUTHORIZED'
            fi
          else
            echo 'OVH_BOOTSTRAP_REQUIRED'
          fi
          planner_source="$HOME/liftorbit-migration/sources/planner"
          if [[ -d "$planner_source" && -w "$planner_source" ]]; then
            echo 'OVH_PLANNER_STAGING_DIRECTORY_WRITABLE'
          else
            echo 'OVH_PLANNER_STAGING_DIRECTORY_NOT_WRITABLE'
          fi
          if [[ -f "$planner_source/Dockerfile" && -w "$planner_source/Dockerfile" ]]; then
            echo 'OVH_PLANNER_DOCKERFILE_WRITABLE'
          else
            echo 'OVH_PLANNER_DOCKERFILE_NOT_WRITABLE'
          fi
          if test -f /opt/liftorbit/full.compose.yml; then
            echo 'OVH_COMPOSE_PRESENT'
          else
            echo 'OVH_COMPOSE_MISSING'
          fi
          if [[ -x /usr/local/sbin/liftorbit-ops ]] && sudo -n -l /usr/local/sbin/liftorbit-ops status >/dev/null 2>&1; then
            sudo -n /usr/local/sbin/liftorbit-ops status
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1; then
              echo 'OVH_SERVER_ALL_SIX_HEALTHY'
            else
              echo 'OVH_SERVER_SIX_SERVICE_SMOKE_INCOMPLETE'
            fi
          fi
          # Verify independently staged marketing landing, without exposing content or secrets.
          python3 - <<'PY'
          import json,urllib.request
          for key,url in (('home','http://127.0.0.1:18080/'),
                          ('health','http://127.0.0.1:18080/health')):
              try:
                  with urllib.request.urlopen(url,timeout=5) as response:
                      status=response.status
                      body=response.read(4096) if key=='health' else b''
                  print('OVH_LANDING_HTTP',key,status)
                  if key=='health':
                      try:
                          data=json.loads(body.decode('utf8'))
                          print('OVH_LANDING_SERVICE_IDENTITY_OK',
                                str(data.get('service')=='prodplan-landing-v1' and data.get('ok') is True).lower())
                      except Exception:
                          print('OVH_LANDING_SERVICE_IDENTITY_OK false')
              except Exception as error:
                  print('OVH_LANDING_HTTP',key,'unreachable',type(error).__name__)
          PY
          # Diagnose only loopback port ownership, no application data or privileged changes.
          python3 - <<'PY'
          import re,socket,subprocess,urllib.request,urllib.error
          for port in (18082,18083,18084):
              try:
                  with socket.create_connection(('127.0.0.1',port),timeout=1):
                      listening=True
              except OSError:
                  listening=False
              print('OVH_PORT_LISTEN',port,'yes' if listening else 'no')
          p=subprocess.run(['ss','-H','-ltnp','( sport = :18082 )'],capture_output=True,text=True,timeout=8)
          print('OVH_SS_DIAGNOSTIC_RC',p.returncode)
          print('OVH_SS_LISTENER_COUNT',len([x for x in p.stdout.splitlines() if x.strip()]))
          names=sorted(set(line.split('users:(("',1)[1].split('"',1)[0]
              for line in p.stdout.splitlines() if 'users:(("' in line))
          print('OVH_SS_VISIBLE_PROCESS_NAMES',','.join(names) if names else 'redacted_or_not_visible')
          pid_match=re.search(r'pid=([0-9]+)',p.stdout)
          if pid_match:
              import os,pathlib
              pid=int(pid_match.group(1))
              proc=pathlib.Path('/proc')/str(pid)
              status_text=(proc/'status').read_text(errors='replace')
              owner_line=next((x for x in status_text.splitlines() if x.startswith('Uid:')),'')
              process_uid=int(owner_line.split()[1]) if owner_line else -1
              same_user=(process_uid==os.getuid())
              def classify_path(value):
                  if not isinstance(value,str): return 'UNKNOWN'
                  if value.startswith('/home/liftorbit-ci/liftorbit-migration/'): return 'LIFTORBIT_MIGRATION'
                  if value.startswith('/opt/liftorbit/'): return 'LIFTORBIT_STAGING'
                  if value.startswith('/home/liftorbit-ci/'): return 'CI_HOME_OTHER'
                  if value.startswith('/usr/') or value.startswith('/opt/'): return 'SYSTEM'
                  return 'OTHER'
              try: cwd=os.readlink(str(proc/'cwd'))
              except OSError: cwd=''
              try: exe=os.readlink(str(proc/'exe'))
              except OSError: exe=''
              try: argv=(proc/'cmdline').read_bytes().decode('utf8','replace').split(chr(0))
              except OSError: argv=[]
              try: cgroup=(proc/'cgroup').read_text(errors='replace')
              except OSError: cgroup=''
              parent=next((x.split()[1] for x in status_text.splitlines() if x.startswith('PPid:')),'unknown')
              print('OVH_LISTENER_PID',pid)
              print('OVH_LISTENER_OWNED_BY_CI',str(same_user).lower())
              print('OVH_LISTENER_CWD_CLASS',classify_path(cwd))
              print('OVH_LISTENER_EXE_CLASS',classify_path(exe))
              print('OVH_LISTENER_ARG_CLASS','bun' if any('bun' in x.lower() for x in argv[:2]) else 'other')
              print('OVH_LISTENER_ARG_LIFTORBIT',str(any('liftorbit' in x.lower() for x in argv)).lower())
              print('OVH_LISTENER_ARG_APP',str(any('app' in x.lower() for x in argv)).lower())
              print('OVH_LISTENER_CONTAINERIZED',str(any(x in cgroup for x in ('docker','containerd','kubepods'))).lower())
              print('OVH_LISTENER_PARENT_PID',parent)
          else:
              print('OVH_LISTENER_PID_NOT_VISIBLE')
          for suffix in ('/__bridge_health','/'):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18082'+suffix,timeout=3) as response:
                      code=response.status
              except urllib.error.HTTPError as error:
                  code=error.code
              except Exception:
                  code='unreachable'
              print('OVH_PORT18082_HTTP', 'bridge' if suffix=='/__bridge_health' else 'root',code)
          PY
          REMOTE
          local_sha=$(sha256sum ops/ovh/full.compose.yml | cut -d ' ' -f1)
          remote_sha=$(ssh -i "$tmp/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$tmp/hosts" "$OVH_USER@$OVH_HOST" \
            'sha256sum /opt/liftorbit/full.compose.yml | cut -d " " -f1' 2>/dev/null || true)
          if [[ -n "$remote_sha" && "$local_sha" == "$remote_sha" ]]; then
            echo 'OVH_SERVER_COMPOSE_MATCHES_TESTED_RELEASE'
          else
            echo 'OVH_SERVER_COMPOSE_NEEDS_SYNC'
          fi
          # Read-only root key check; authentication errors are expected and printed as booleans.
          if ssh -i "$tmp/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=9 -o UserKnownHostsFile="$tmp/hosts" "root@$OVH_HOST" \
            'test "$(id -u)" -eq 0' </dev/null >/dev/null 2>&1; then
            echo 'OVH_EXISTING_ROOT_SSH_KEY_AVAILABLE'
          else
            echo 'OVH_EXISTING_ROOT_SSH_KEY_UNAVAILABLE'
          fi
