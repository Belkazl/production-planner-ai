name: Inspect current KPI comparison base on OVH
on:
  push:
    branches: [fix/kpi-use-last-accepted-plan-20261123]
    paths: [.github/workflows/inspect-kpi-immediate-baseline-20261123.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect KPI client scopes and Plan persistence (read-only)
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = 51.255.163.121
          test "$USER" = liftorbit-ci
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$KEY" > "$d/key"
          printf '%s\n' "$KH" > "$d/kh"
          chmod 600 "$d/key" "$d/kh"
          ssh -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" "$USER@$HOST" python3 - <<'PY'
          from pathlib import Path
          s=(Path.home()/"liftorbit-migration/sources/ovh-app/current/restart-optimizer-ui.js").read_text()
          lines=s.splitlines()
          print("KPI_SOURCE_LINECOUNT",len(lines))
          import re
          for a,b in [(620,855),(885,930)]:
            print('SPAN',a,b)
            for n in range(a,min(b,len(lines))+1):
              print(f'{n:04d} {lines[n-1][:310]}')
          for term in ['function readyContinue(){','function markContinue(){','function rememberFirstResult','function recordSelection','function bindRenderer','function ppProjectAfterPlan']:
            print('TERM',term,'COUNT',s.count(term))
          PY