name: Release reviewed equipment toolbar
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-reviewed-equipment-toolbar.yml
      - ops/ovh/equipment-toolbar-release/release.sh
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: release
      - uses: actions/checkout@v4
        with:
          ref: f990a2aca3d13863a0fe225523ff2db153facbec
          persist-credentials: false
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pinned candidate
        working-directory: candidate
        run: |
          bash -n ../release/ops/ovh/equipment-toolbar-release/release.sh
          npm install --prefix /tmp/liftorbit-equipment-sdk-toolbar-test --no-save --no-package-lock --ignore-scripts playwright-core@1.58.2
          node --test ops/ovh/equipment-sdk-toolbar-20261127/test_patch.mjs
          node ops/ovh/equipment-sdk-toolbar-20261127/browser_accept.mjs
      - name: Install and verify the production toolbar
        working-directory: candidate
        env:
          DEPLOY_HOST: ${{ vars.OVH_HOST }}
          DEPLOY_USER: ${{ vars.OVH_USER }}
          DEPLOY_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: bash ../release/ops/ovh/equipment-toolbar-release/release.sh
