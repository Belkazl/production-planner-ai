name: LiftOrbit strict GA continuation regression 2026-11-16
on:
  push:
    branches: [fix/ga-continuation-resume-20261116]
    paths:
      - python-ga-upstream.mjs
      - tests/python-ga-upstream.test.mjs
      - tests/ga-continuation-resume-safe.test.mjs
      - .github/workflows/liftorbit-ga-continuation-qa-20261116.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ga-continuation-resume-20261116
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all GA resume, foreign-account refusal, stop and saved-plan regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check python-ga-upstream.mjs
          node --test tests/python-ga-upstream.test.mjs tests/ga-account-owned-recovery.test.mjs tests/ga-continuation-resume-safe.test.mjs
