name: LiftOrbit GA progress persistence optimization with zero-timeout regression
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-progress-db-checkpoints-release-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact current source and validate one-file checkpoint patch
        id: preflight
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121" && test "$USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/known"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/known"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known" -o ConnectTimeout=20)
          root=/home/liftorbit-ci/liftorbit-migration
          mkdir -p old new
          scp -q "${opts[@]}" "$USER@$HOST:$root/sources/ovh-app/current/python-ga-upstream.mjs" old/python-ga-upstream.mjs
          test "$(sha256sum old/python-ga-upstream.mjs | cut -d' ' -f1)" = e552a2e213a5b9308e423c3cb94700e87b97ff2684dc4179433b33f3210834ad
          cp old/python-ga-upstream.mjs new/python-ga-upstream.mjs
          node ops/ovh/ga-progress-db-checkpoints-20261119/patch.mjs new
          node --check new/python-ga-upstream.mjs
          node ops/ovh/ga-progress-db-checkpoints-20261119/test.cjs new
          diff -u old/python-ga-upstream.mjs new/python-ga-upstream.mjs > "$RUNNER_TEMP/ga-checkpoint.diff" || test "$?" -eq 1
          test "$(grep -c '^@@' "$RUNNER_TEMP/ga-checkpoint.diff")" = 1
          sha256sum old/python-ga-upstream.mjs | cut -d' ' -f1 > "$RUNNER_TEMP/old.sha"
          sha256sum new/python-ga-upstream.mjs | cut -d' ' -f1 > "$RUNNER_TEMP/new.sha"
          command -v google-chrome
          npm install --no-save --no-package-lock playwright-core@1.57.0
          echo "GA_DB_CHECKPOINT_PREFLIGHT_PASSED"
      - name: Deploy one account-owned state file with verified rollback
        id: rollout
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121" && test "$USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/known"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/known"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known" -o ConnectTimeout=20)
          old=$(cat "$RUNNER_TEMP/old.sha")
          new=$(cat "$RUNNER_TEMP/new.sha")
          root=/home/liftorbit-ci/liftorbit-migration
          scp -q "${opts[@]}" new/python-ga-upstream.mjs "$USER@$HOST:$root/sources/ovh-app/python-ga-upstream-db-checkpoint-20261119.next"
          ssh "${opts[@]}" "$USER@$HOST" bash -s -- "$old" "$new" <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/liftorbit-migration"
          live="$root/sources/ovh-app/current/python-ga-upstream.mjs"
          staged="$root/sources/ovh-app/python-ga-upstream-db-checkpoint-20261119.next"
          backup="$root/patch-backups/ga-db-checkpoint-20261119"
          sha(){ sha256sum "$1" | cut -d' ' -f1; }
          test -r "$live" && test -r "$staged"
          test "$(sha "$live")" = "$1" && test "$(sha "$staged")" = "$2"
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          mkdir -p "$backup"
          cp -p "$live" "$backup/python-ga-upstream.mjs"
          test "$(sha "$backup/python-ga-upstream.mjs")" = "$1"
          rollback(){
           trap - ERR
           cp -p "$backup/python-ga-upstream.mjs" "$live" || true
           sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
           echo "GA_DB_CHECKPOINT_INTERNAL_ROLLBACK_ATTEMPTED"
          }
          trap rollback ERR
          mv "$staged" "$live"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          healthy=no
          for attempt in $(seq 1 24); do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes
          test "$(sha "$live")" = "$2"
          trap - ERR
          echo "GA_DB_CHECKPOINT_PATCH_OVH_INSTALLED"
          REMOTE
      - name: Verify public API is healthy and sessions remain protected
        id: health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            h=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/__bridge_health || true)
            a=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/api/auth/me || true)
            if [[ "$h" = 200 && "$a" = 401 ]]; then echo "GA_DB_CHECKPOINT_PUBLIC_HEALTHY"; exit 0; fi
            sleep 4
          done
          exit 1
      - name: Real 886-operation GA must complete with zero truncated and timed-out status replies
        id: live
        shell: bash
        env:
          FREEZE_TEST_MODE: deployed
        run: |
          set -euo pipefail
          node ops/ovh/ga-progress-db-checkpoints-20261119/regression.mjs
      - name: Restore exact previous source on any production regression
        if: ${{ failure() && steps.rollout.outcome == 'success' }}
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121" && test "$USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/known"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/known"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known" -o ConnectTimeout=20)
          ssh "${opts[@]}" "$USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          root="$HOME/liftorbit-migration"
          live="$root/sources/ovh-app/current/python-ga-upstream.mjs"
          backup="$root/patch-backups/ga-db-checkpoint-20261119"
          test -r "$backup/python-ga-upstream.mjs"
          cp -p "$backup/python-ga-upstream.mjs" "$live"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/qa-rollback-private.log" 2>&1
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          echo "GA_DB_CHECKPOINT_QA_ROLLBACK_PASSED"
          REMOTE
      - name: Report grounded result only
        if: always()
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          ROLLOUT: ${{ steps.rollout.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          LIVE: ${{ steps.live.outcome }}
        run: echo "GA_DB_CHECKPOINT_RELEASE preflight=$PREFLIGHT rollout=$ROLLOUT health=$HEALTH live=$LIVE"
