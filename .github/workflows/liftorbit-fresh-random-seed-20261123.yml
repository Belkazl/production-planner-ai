name: LiftOrbit new random seed for each fresh optimization OVH
on:
  push:
    branches: [main, fix/ga-fresh-random-seed-20261123]
    paths:
      - .github/workflows/liftorbit-fresh-random-seed-20261123.yml
permissions: {contents: read}
concurrency:
  group: liftorbit-fresh-random-seed-release
  cancel-in-progress: false
jobs:
  validate_and_deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Validate live adapter source and deploy single file to OVH on main only
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121"
          test "$USER" = "liftorbit-ci"
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$KEY" > "$dir/key"
          printf '%s\n' "$KH" > "$dir/kh"
          chmod 600 "$dir/key" "$dir/kh"
          ssh_call(){
            ssh -i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/kh" -o ConnectTimeout=20 "$@"
          }
          scp_call(){
            scp -q -i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/kh" -o ConnectTimeout=20 "$@"
          }
          target=/home/liftorbit-ci/liftorbit-migration/sources/current/ga/ga_workers/full_runtime_adapter.py
          scp_call "$USER@$HOST:$target" "$dir/old.py"
          python3 - "$dir/old.py" "$dir/new.py" <<'PY'
          from pathlib import Path
          import sys,ast
          s=Path(sys.argv[1]).read_text()
          before="    seed=opts.get('seed',1729)"
          after="""    # Each fresh optimization must explore an independent random trajectory.
              # Explicit seeds still permit reproducible runs; continuation unchanged.
              import secrets
              seed=opts.get('seed')
              if seed is None:
                  seed=1729 if continuing else secrets.randbits(32)"""
          after="\n".join(x[10:] if x.startswith("          ") else x for x in after.split("\n"))
          assert s.count(before)==1, "CURRENT_GA_SEED_ANCHOR_DRIFT"
          assert "    continuing=bool(opts.get('continue') or opts.get('continue_run'))" in s
          assert "ga['optimize'](gens,population,seed,continuing,objective)" in s
          t=s.replace(before,after)
          ast.parse(t)
          assert "secrets.randbits(32)" in t and t.count("secrets.randbits(32)")==1
          Path(sys.argv[2]).write_text(t)
          # Verify random fresh path and explicit/continuation seed contracts.
          import secrets
          def choose(opts,continuing):
              seed=opts.get('seed')
              if seed is None:
                  seed=1729 if continuing else secrets.randbits(32)
              return seed
          assert choose({'seed':123},False)==123
          assert choose({},True)==1729
          assert len({choose({},False) for _ in range(16)})==16
          print("FRESH_SEED_SOURCE_AND_SEMANTICS_PASS")
          PY
          python3 -m py_compile "$dir/new.py"
          if [ "$GITHUB_REF" != "refs/heads/main" ];then
            echo FRESH_SEED_READONLY_PREFLIGHT_PASS
            exit 0
          fi
          old_sha=$(sha256sum "$dir/old.py" | cut -d' ' -f1)
          new_sha=$(sha256sum "$dir/new.py" | cut -d' ' -f1)
          stage=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/fresh-seed-20261123.next
          scp_call "$dir/new.py" "$USER@$HOST:$stage"
          ssh_call "$USER@$HOST" bash -s -- "$old_sha" "$new_sha" <<'REMOTE'
          set -euo pipefail
          root="$HOME/liftorbit-migration"
          target="$root/sources/current/ga/ga_workers/full_runtime_adapter.py"
          stage="$root/sources/ovh-app/fresh-seed-20261123.next"
          backup="$root/patch-backups/ga-fresh-random-seed-20261123"
          sha(){ sha256sum "$1" | cut -d' ' -f1; }
          test "$(sha "$target")" = "$1"
          test "$(sha "$stage")" = "$2"
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          mkdir -p "$backup"
          cp -p "$target" "$backup/full_runtime_adapter.py"
          rollback(){
            trap - ERR
            cp -p "$backup/full_runtime_adapter.py" "$target" || true
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo FRESH_RANDOM_SEED_ROLLBACK_ATTEMPTED
          }
          trap rollback ERR
          mv "$stage" "$target"
          python3 -m py_compile "$target"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/deploy-private.log" 2>&1
          healthy=no
          for i in $(seq 1 35);do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1;then healthy=yes;break;fi
            sleep 5
          done
          test "$healthy" = yes
          test "$(sha "$target")" = "$2"
          trap - ERR
          echo FRESH_RANDOM_SEED_OVH_DEPLOYED_AND_SMOKE_PASS
          REMOTE
          scp_call "$USER@$HOST:$target" "$dir/deployed.py"
          test "$(sha256sum "$dir/deployed.py" | cut -d' ' -f1)" = "$new_sha"
          echo FRESH_RANDOM_SEED_DEPLOYED_BYTES_VERIFIED
