# corrected diagnostic bindings
name: LiftOrbit diagnose native Continue abort signal without production edits
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-signal-diagnose-20261120.yml
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test native Continue with UI signal omitted on disposable account
        shell: bash
        env:
          FREEZE_TEST_MODE: skip-gantt
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.57.0
          node ops/ovh/ga-post502-isolation-20261119/generate-signal-diagnose.mjs
          node --check ops/ovh/ga-post502-isolation-20261119/_signal-diagnose.mjs
          node ops/ovh/ga-post502-isolation-20261119/_signal-diagnose.mjs