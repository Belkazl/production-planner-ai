name: Weekly shift calendars - isolated tests
on:
  push:
    branches: [feat/weekly-shift-calendars-20261125]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s ops/ovh/weekly-shift-calendars-20261125 -p 'test_*.py'
      - run: node --test ops/ovh/weekly-shift-calendars-20261125/test-editor.mjs
