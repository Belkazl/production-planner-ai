name: LiftOrbit real Chrome verify smooth GA percent and no fabricated progress
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-smooth-percent-chrome-20261118.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify guarded UI deployment
        run: |
          set -euo pipefail
          grep -Fqx 'preflight=success' ops/ovh/test-results/ga-smooth-progress-release-latest.txt
          grep -Fqx 'rollout=success' ops/ovh/test-results/ga-smooth-progress-release-latest.txt
          grep -Fqx 'public_health=success' ops/ovh/test-results/ga-smooth-progress-release-latest.txt
          command -v google-chrome
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://app.liftorbit.app/__bridge_health)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://app.liftorbit.app/api/auth/me)" = 401
      - name: Install lightweight Chrome driver
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Test 10 to 20 one point at a time and Stop Continue reload
        id: acceptance
        run: node ops/ovh/ga-candidate-progress-20261118/chrome.mjs
      - uses: actions/checkout@v4
        if: always()
      - name: Save real Chrome acceptance
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ steps.acceptance.outcome }}
        run: |
          set -euo pipefail
          file=ops/ovh/test-results/ga-smooth-progress-chrome-latest.txt
          mkdir -p "$(dirname "$file")"
          printf 'workflow_run=%s\nchrome_acceptance=%s\n' "$RUN_ID" "$RESULT" > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if ! git diff --cached --quiet;then
            git commit -m 'ci: record smooth GA percent Chrome QA'
            for i in 1 2 3;do git pull --rebase origin main;if git push origin HEAD:main;then exit 0;fi;sleep 2;done
            echo 'CHROME_REPORT_NOT_PUBLISHED'
            exit 0
          fi
