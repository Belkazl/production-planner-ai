name: LiftOrbit guarded OVH GA continuation recovery release
# Never pass incompatible resume_state to GA; use same-account validated ordering only.
# Preserve tenant ownership, established etalon UI, compact progress and persistence.
# 25 updated continuation/account-isolation tests passed in Actions 43911894950.
# Require full Docker build and strict source SHA before live update.
# Only one backend bridge file changes; current production SHA must match.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ovh-ga-continuation-recovery-release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'release(liftorbit): repair stale GA continuation with safe owned order seed')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable production app
        uses: actions/checkout@v4
        with:
          ref: 4a1457d6f33e7ef5b6e8ad59c3e21ef345b8c25f
          path: pinned
          persist-credentials: false
      - name: Checkout previous verified OVH patch
        uses: actions/checkout@v4
        with:
          ref: 4765adaf3fe2c22f6130a23b87544dd36eb4b36f
          path: prior
          persist-credentials: false
      - name: Checkout current deployed ownership safeguards
        uses: actions/checkout@v4
        with:
          ref: fb0ce6d76c022fbb79b383e4888a189d63703e26
          path: previous-owned
          persist-credentials: false
      - name: Checkout tested continuation source and regressions
        uses: actions/checkout@v4
        with:
          ref: c228648e41a4c65f2b9f1325c577a3ba03d6fb1b
          path: repaired
          persist-credentials: false
      - name: Checkout already released GA JSON compactor
        uses: actions/checkout@v4
        with:
          ref: 0158a0514b7bca113fee92b2389747d081a8a1f6
          path: compact
          persist-credentials: false
      - name: Verify exactly three synchronized backend and GA contract test files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p old/app new/app app
          cp -a pinned/. old/app/
          cp -a pinned/. new/app/
          cp previous-owned/python-ga-upstream.mjs old/app/python-ga-upstream.mjs
          cp repaired/python-ga-upstream.mjs new/app/python-ga-upstream.mjs
          for side in old new; do
            for script in patch-runtime-origins.mjs repair-planner-ui.mjs repair-ga-state.mjs repair-ga-load.mjs repair-async-ga.mjs; do
              node "prior/ops/ovh/$script" "$side/app"
            done
            node compact/ops/ovh/compact-ga-progress.mjs "$side/app"
          done
          node prior/ops/ovh/repair-continuation.mjs old/app
          grep -q "PP_GA_RESUME_SAFE_ORDER_SEED" new/app/python-ga-upstream.mjs
          node --check old/app/python-ga-upstream.mjs
          node --check new/app/python-ga-upstream.mjs
          cp repaired/tests/ga-account-owned-recovery.test.mjs new/app/tests/ga-account-owned-recovery.test.mjs
          cp repaired/tests/ga-continuation-resume-safe.test.mjs new/app/tests/ga-continuation-resume-safe.test.mjs
          cp repaired/tests/python-ga-upstream.test.mjs new/app/tests/python-ga-upstream.test.mjs
          cp repaired/tests/continuation-compat-contract.cjs new/app/tests/continuation-compat-contract.cjs
          node new/app/tests/continuation-compat-contract.cjs
          node --test new/app/tests/python-ga-upstream.test.mjs new/app/tests/ga-account-owned-recovery.test.mjs new/app/tests/ga-continuation-resume-safe.test.mjs
          rm -f new/app/tests/ga-account-owned-recovery.test.mjs new/app/tests/ga-continuation-resume-safe.test.mjs
          diff -qr old/app new/app > "$RUNNER_TEMP/ga-continuation-patch-diff" || test "$?" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/ga-continuation-patch-diff")" -eq 3
          grep -Fqx 'Files old/app/python-ga-upstream.mjs and new/app/python-ga-upstream.mjs differ' "$RUNNER_TEMP/ga-continuation-patch-diff"
          grep -Fqx 'Files old/app/tests/python-ga-upstream.test.mjs and new/app/tests/python-ga-upstream.test.mjs differ' "$RUNNER_TEMP/ga-continuation-patch-diff"
          grep -Fqx 'Files old/app/tests/continuation-compat-contract.cjs and new/app/tests/continuation-compat-contract.cjs differ' "$RUNNER_TEMP/ga-continuation-patch-diff"
          grep -q 'PP_GA_UNOWNED_FINAL_REPLACED_BY_VERIFIED_OWNED_BEST' new/app/python-ga-upstream.mjs
          sha256sum old/app/python-ga-upstream.mjs | cut -d' ' -f1 > old.python-upstream.sha
          sha256sum new/app/python-ga-upstream.mjs | cut -d' ' -f1 > new.python-upstream.sha
          sha256sum old/app/tests/python-ga-upstream.test.mjs | cut -d' ' -f1 > old.python-test.sha
          sha256sum new/app/tests/python-ga-upstream.test.mjs | cut -d' ' -f1 > new.python-test.sha
          sha256sum old/app/tests/continuation-compat-contract.cjs | cut -d' ' -f1 > old.continuation-contract.sha
          sha256sum new/app/tests/continuation-compat-contract.cjs | cut -d' ' -f1 > new.continuation-contract.sha
          echo 'GA_CONTINUATION_EXACT_THREE_BACKEND_AND_TEST_FILES_READY'
          docker build --quiet -t liftorbit-continuation-release:preflight new/app > "$RUNNER_TEMP/ga-continuation-docker-build.log" 2>&1 || {
            echo 'GA_CONTINUATION_PINNED_DOCKER_BUILD_FAILED'
            exit 22
          }
          echo 'GA_CONTINUATION_PINNED_DOCKER_BUILD_PASS'
      - name: Apply guarded OVH app update with automatic rollback
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test "$OVH_HOST" = "51.255.163.121"
          test "$OVH_USER" = "liftorbit-ci"
          test -n "$OVH_SSH_PRIVATE_KEY"
          test -n "$OVH_SSH_KNOWN_HOSTS"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20)
          target="$OVH_USER@$OVH_HOST"
          oldSha=$(cat old.python-upstream.sha)
          newSha=$(cat new.python-upstream.sha)
          oldTestSha=$(cat old.python-test.sha)
          newTestSha=$(cat new.python-test.sha)
          oldContractSha=$(cat old.continuation-contract.sha)
          newContractSha=$(cat new.continuation-contract.sha)
          root=/home/liftorbit-ci/liftorbit-migration
          scp -q "${opts[@]}" new/app/python-ga-upstream.mjs "$target:$root/sources/ovh-app/python-ga-upstream.mjs.continuation.next"
          scp -q "${opts[@]}" new/app/tests/python-ga-upstream.test.mjs "$target:$root/sources/ovh-app/python-ga-upstream.test.mjs.continuation.next"
          scp -q "${opts[@]}" new/app/tests/continuation-compat-contract.cjs "$target:$root/sources/ovh-app/continuation-compat-contract.cjs.continuation.next"
          ssh "${opts[@]}" "$target" bash -s -- "$oldSha" "$newSha" "$oldTestSha" "$newTestSha" "$oldContractSha" "$newContractSha" <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/liftorbit-migration"
          app="$root/sources/ovh-app/current/python-ga-upstream.mjs"
          tests="$root/sources/ovh-app/current/tests/python-ga-upstream.test.mjs"
          contract="$root/sources/ovh-app/current/tests/continuation-compat-contract.cjs"
          next="$root/sources/ovh-app/python-ga-upstream.mjs.continuation.next"
          nextTest="$root/sources/ovh-app/python-ga-upstream.test.mjs.continuation.next"
          nextContract="$root/sources/ovh-app/continuation-compat-contract.cjs.continuation.next"
          backup="$root/patch-backups/ga-continuation-20261116"
          sha(){ sha256sum "$1" | cut -d' ' -f1; }
          for f in "$app" "$tests" "$contract" "$next" "$nextTest" "$nextContract"; do test -f "$f"; done
          test "$(sha "$app")" = "$1" || { echo 'GA_CONTINUATION_PRODUCTION_SOURCE_DRIFT_ABORT'; exit 5; }
          test "$(sha "$tests")" = "$3" || { echo 'GA_CONTINUATION_TEST_SOURCE_DRIFT_ABORT'; exit 5; }
          test "$(sha "$contract")" = "$5" || { echo 'GA_CONTINUATION_CONTRACT_SOURCE_DRIFT_ABORT'; exit 5; }
          test "$(sha "$next")" = "$2" || { echo 'GA_CONTINUATION_UPLOAD_INTEGRITY_FAILED'; exit 5; }
          test "$(sha "$nextTest")" = "$4" || { echo 'GA_CONTINUATION_TEST_UPLOAD_INTEGRITY_FAILED'; exit 5; }
          test "$(sha "$nextContract")" = "$6" || { echo 'GA_CONTINUATION_CONTRACT_UPLOAD_INTEGRITY_FAILED'; exit 5; }
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null || { echo 'GA_CONTINUATION_PREDEPLOY_SMOKE_FAILED'; exit 6; }
          mkdir -p "$backup"
          cp -p "$app" "$backup/python-ga-upstream.mjs"
          cp -p "$tests" "$backup/python-ga-upstream.test.mjs"
          cp -p "$contract" "$backup/continuation-compat-contract.cjs"
          test "$(sha "$backup/python-ga-upstream.mjs")" = "$1"
          test "$(sha "$backup/python-ga-upstream.test.mjs")" = "$3"
          test "$(sha "$backup/continuation-compat-contract.cjs")" = "$5"
          rollback(){
            trap - ERR
            cp -p "$backup/python-ga-upstream.mjs" "$app" || true
            cp -p "$backup/python-ga-upstream.test.mjs" "$tests" || true
            cp -p "$backup/continuation-compat-contract.cjs" "$contract" || true
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo 'GA_CONTINUATION_AUTOMATIC_ROLLBACK_ATTEMPTED'
          }
          trap rollback ERR
          mv "$next" "$app"
          mv "$nextTest" "$tests"
          mv "$nextContract" "$contract"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          healthy=no
          for attempt in $(seq 1 24); do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes || { echo 'GA_CONTINUATION_POSTDEPLOY_HEALTH_FAILED'; false; }
          test "$(sha "$app")" = "$2"
          test "$(sha "$tests")" = "$4"
          test "$(sha "$contract")" = "$6"
          trap - ERR
          echo 'GA_CONTINUATION_OVH_DEPLOYED_HEALTHY'
          REMOTE
      - name: Public HTTPS, guest boundary and no redirect
        shell: bash
        run: |
          set -euo pipefail
          healthy=no
          for attempt in $(seq 1 15); do
            public=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 https://app.liftorbit.app/__bridge_health || true)
            direct=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 --resolve app.liftorbit.app:443:51.255.163.121 https://app.liftorbit.app/__bridge_health || true)
            auth=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 https://app.liftorbit.app/api/auth/me || true)
            if [[ "$public" = 200 && "$direct" = 200 && "$auth" = 401 ]]; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes
          echo 'GA_CONTINUATION_PUBLIC_API_HEALTHY'
