name: LiftOrbit read-only live GA finalization pressure diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ovh-pressure-diag-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify public health and install test driver
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/__bridge_health)" = 200
          command -v google-chrome
          npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Run isolated account GA and measure OVH resource pressure
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
          FREEZE_TEST_MODE: no-intermediate
        run: |
          set -euo pipefail
          test "$OVH_HOST" = "51.255.163.121"
          test "$OVH_USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh_opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=12)
          timeout 245s node ops/ovh/account-plan-mismatch-20261118/ceramic-complex-bounded.mjs > "$RUNNER_TEMP/isolation.log" 2>&1 &
          qa_pid=$!
          for n in 1 2 3 4 5 6; do
            sleep 22
            echo "OVH_PRESSURE_SAMPLE=$n"
            ssh "${ssh_opts[@]}" "$OVH_USER@$OVH_HOST" bash -s <<'REMOTE' || true
          set -euo pipefail
          printf 'utc=%s\n' "$(date -u +%H:%M:%S)"
          free -m | awk '/^Mem:/{printf "host_mem_mb total=%s used=%s free=%s available=%s\n",$2,$3,$4,$7}'
          ps -eo comm,pcpu,pmem,rss --sort=-pcpu | awk 'NR<=13{print}'
          if sudo -n /usr/local/sbin/liftorbit-ops status >/dev/null 2>&1; then echo 'maintenance_status=ok';else echo 'maintenance_status=unavailable';fi
          REMOTE
            curl -sS -o /dev/null -w 'public_health=%{http_code} duration=%{time_total}\n' --max-time 8 https://app.liftorbit.app/__bridge_health || true
            if ! kill -0 "$qa_pid" 2>/dev/null; then break;fi
          done
          qa_status=0
          wait "$qa_pid" || qa_status=$?
          echo "QA_END_STATUS=$qa_status"
          grep -E 'QA_REAL_GA|QA_INTERMEDIATE|LIVE_CERAMIC_COMPLEX_SAMPLE|LIVE_FREEZE_FAILED|CERAMIC_DURABLE|LIVE_CERAMIC_COMPLEX_GA_FINISHED|LIVE_FREEZE_CLEANUP' "$RUNNER_TEMP/isolation.log" | cut -c 1-450 || true
          test "$qa_status" = 0
