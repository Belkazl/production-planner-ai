name: LiftOrbit app - bypass intermittent Cloudflare 502 via direct OVH DNS
on:
  push:
    branches: [ops/railway-migration-20261108]
    paths:
      - .github/workflows/liftorbit-app-direct-ovh-20261110.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftorbit-app-direct-ovh-20261110
  cancel-in-progress: false
jobs:
  route-to-direct-ovh:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Confirm direct OVH HTTPS works for app and landing before DNS edit
        shell: bash
        run: |
          set -euo pipefail
          for name in 'app.liftorbit.app:/__bridge_health' 'app.liftorbit.app:/' 'liftorbit.app:/health'; do
            host="${name%%:*}"; path="${name#*:}"
            for attempt in 1 2 3; do
              curl --fail --silent --show-error --connect-timeout 6 --max-time 18 \
                --resolve "$host:443:51.255.163.121" "https://$host$path" -o /dev/null
              echo "DIRECT_OVH_PRECHECK_OK host=$host attempt=$attempt"
            done
          done
      - name: Switch ONLY app.liftorbit.app A record from Cloudflare proxy to direct OVH
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          token=os.environ.get('CF_TOKEN') or ''
          if len(token)<15: raise SystemExit('CF_TOKEN_UNAVAILABLE')
          base='https://api.cloudflare.com/client/v4/'
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def api(path, method='GET', payload=None):
              req=urllib.request.Request(base+path,headers=headers,method=method,
                 data=None if payload is None else json.dumps(payload).encode())
              with urllib.request.urlopen(req,timeout=18) as response:
                  doc=json.load(response)
              if not doc.get('success'):raise RuntimeError('CLOUDFLARE_API_OPERATION_FAILED')
              return doc['result']
          zones=api('zones?name=liftorbit.app')
          matches=[z for z in zones if z.get('name')=='liftorbit.app']
          if len(matches)!=1:raise SystemExit('ZONE_VERIFICATION_FAILED')
          zid=matches[0]['id']
          def records(name):
              items=api('zones/'+zid+'/dns_records?'+urllib.parse.urlencode({'name':name}))
              return [x for x in items if x.get('name')==name and x.get('type') in ('A','AAAA','CNAME')]
          landing=records('liftorbit.app')
          if len(landing)!=1 or landing[0]['type']!='A' or landing[0]['content']!='51.255.163.121':
              raise SystemExit('LANDING_DNS_ORIGIN_UNEXPECTED')
          app=records('app.liftorbit.app')
          if len(app)!=1 or app[0]['type']!='A' or app[0]['content']!='51.255.163.121':
              raise SystemExit('APP_DNS_ORIGIN_UNEXPECTED')
          old=app[0]
          print('DNS_BEFORE_PROXY',old.get('proxied'),'OVH_ORIGIN_OK')
          if old.get('proxied') is True:
              changed=api('zones/'+zid+'/dns_records/'+old['id'],'PATCH',{'proxied':False})
              if changed.get('type')!='A' or changed.get('content')!='51.255.163.121' or changed.get('proxied') is not False:
                  raise RuntimeError('DNS_UPDATE_RESPONSE_FAILED')
              print('APP_CLOUDFLARE_PROXY_DISABLED')
          elif old.get('proxied') is not False:
              raise SystemExit('APP_PROXY_STATE_UNEXPECTED')
          after=records('app.liftorbit.app')
          if len(after)!=1 or after[0]['type']!='A' or after[0]['content']!='51.255.163.121' or after[0].get('proxied') is not False:
              raise SystemExit('DNS_READBACK_FAILED')
          landing_after=records('liftorbit.app')
          if len(landing_after)!=1 or landing_after[0]['id']!=landing[0]['id'] or landing_after[0].get('proxied')!=landing[0].get('proxied'):
              raise SystemExit('LANDING_DNS_UNINTENTIONAL_CHANGE')
          print('APP_DIRECT_OVH_DNS_CONFIRMED')
          print('LANDING_DNS_UNCHANGED')
          PY
      - name: Verify authenticated gateway boundary and direct origin after DNS edit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            curl --fail --silent --show-error --connect-timeout 6 --max-time 20 \
              --resolve app.liftorbit.app:443:51.255.163.121 \
              https://app.liftorbit.app/ -o /dev/null
            curl --fail --silent --show-error --connect-timeout 6 --max-time 20 \
              --resolve app.liftorbit.app:443:51.255.163.121 \
              https://app.liftorbit.app/__bridge_health -o /dev/null
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              --resolve app.liftorbit.app:443:51.255.163.121 \
              https://app.liftorbit.app/api/auth/me)
            [[ "$code" == 401 ]] || { echo "APP_AUTH_BOUNDARY_FAILED HTTP=$code"; exit 3; }
            echo "APP_DIRECT_OVH_HTTP_TLS_AUTH_OK attempt=$attempt"
            sleep 1
          done
          echo 'APP_DIRECT_OVH_CUTOVER_SMOKE_PASS'
