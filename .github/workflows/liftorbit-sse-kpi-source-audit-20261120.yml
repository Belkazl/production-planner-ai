name: Inspect native KPI renderer and SSE preview fields read-only
on:
  push:
    branches: [fix/sse-interim-kpi-20261120]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact KPI handling and source fields
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" python3 - <<'PY'
          from pathlib import Path
          base=Path('/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/current')
          targets=[('auth-runtime.js',
            ['function renderKpisWithDelta','function renderKpis(','function ppFixedFirstBestKpiDelta',
             'function renderKpis','previousKpiMetrics','function updateKpis',
             'duration_minutes','operator_wait_minutes','machine_idle_minutes']),
            ('restart-optimizer-ui.js',['ppSelectedPlanKpiReferenceV2','ppFixedFirstBestKpiDelta','__PP_KPI_FIRST_BEST_V1__']),
            ('python-ga-upstream.mjs',['function boundedPreview','const boundedPreview','operator_wait_minutes','batch_count'])]
          for file,needles in targets:
            src=(base/file).read_text()
            print('KPI_SOURCE_FILE',file,'SIZE',len(src))
            for needle in needles:
              offsets=[]
              start=0
              while (i:=src.find(needle,start))>=0:
                offsets.append(i)
                start=i+len(needle)
              print('KPI_NEEDLE',repr(needle),'COUNT',len(offsets))
              for i in offsets[:2]:
                print('KPI_SOURCE_EXCERPT',repr(src[max(0,i-350):i+2400]))
          PY
