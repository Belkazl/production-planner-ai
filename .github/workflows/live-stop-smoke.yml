name: Check live stop optimizer
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - name: Verify stop optimizer code in the protected release
        run: |
          bun run build-bridge.ts
          bun run feature-stop.ts
          bun run gantt-details.ts
          bun run order-accordion.ts
          bun run auth-bridge.ts
          bun run ceramics-resource-repair.ts
          bun run restart-optimizer.ts
          bun run documents-tab.ts
          bun run ga-execution-budget.ts
          bun run language-build.ts
          bun build ./index.ts --target=bun --outdir=/tmp/pp-test-build
          node --check stop-ui.js
          node --check language-ui.js
          grep -q "ppStopOptimizationV1" index.ts
          grep -q "ppStopOptimizer" index.ts
          grep -q "ppOptimizerStartOver" index.ts
          grep -q "ppLanguageUiJs" index.ts
          node tests/start-over-session.cjs
      - name: Check live protected gateway is healthy and denies anonymous optimizer calls
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          origin="https://production-planner-gateway-v2-production.up.railway.app"
          def read(path):
              req=urllib.request.Request(origin+path,headers={"User-Agent":"ProdPlanProtectedStopSmoke/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=35) as response:
                      return response.status,response.read(20000).decode("utf8","replace")
              except urllib.error.HTTPError as error:
                  return error.code,error.read(20000).decode("utf8","replace")
          st,h=read("/__bridge_health")
          assert st==200,(st,h[:300])
          st,login=read("/")
          assert st==200 and 'type="password"' in login,(st,login[:200])
          for path in ["/api/plan-progress","/api/plan","/api/optimizer-stop","/api/optimizer-reset"]:
              st,body=read(path)
              assert st in (401,405),(path,st,body[:200])
          print("PROTECTED_STOP_BUILD_AND_LIVE_AUTH_PASS")
          PY
