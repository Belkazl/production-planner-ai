name: Check live stop optimizer
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live candidate UI and API
        run: |
          python3 - <<'PY'
          import urllib.request, time
          url="https://aps-setup-bridge-candidate-v2-production.up.railway.app"
          def fetch(path,method="GET"):
              req=urllib.request.Request(url+path,method=method)
              with urllib.request.urlopen(req,timeout=50) as r:
                  return r.status,r.read().decode("utf-8")
          status,html=fetch("/")
          assert status==200,(status,len(html))
          assert 'ppStopOptimizationV1' in html, "stop script missing"
          assert 'ppStopOptimizer' in html, "stop button missing"
          assert 'ppGanttToolV2' in html, "Gantt component missing"
          assert 'ppStopModal' in html, "stop choices modal missing"
          print("SMOKE_UI_OK",len(html),flush=True)
          status,body=fetch("/__bridge_health")
          assert status==200,(status,body[:1000])
          print("SMOKE_HEALTH_OK",body[:500],flush=True)
          import json,re
          status,body=fetch("/api/plan-progress?ppProgressCache=off")
          d=json.loads(body)
          scalars={k:v for k,v in d.items() if isinstance(v,(str,int,float,bool)) or v is None}
          print("GA_PROGRESS_FIELDS",json.dumps(scalars,ensure_ascii=False),flush=True)
          for ident in ["ppRealOptProgressV1","ppLivePanelV2"]:
              m=re.search(r'<script id="'+ident+r'">(.*?)</script>',html,re.S)
              if m:
                  script=m.group(1)
                  print("SCRIPT",ident,"bytes",len(script))
                  for word in ["function update(","function render(","async function poll(","btn.textContent=","d.percent","d.generation","d.iteration","d.running","d.success"]:
                      i=script.find(word)
                      if i>=0:print("EXCERPT",ident,word,json.dumps(script[max(0,i-250):i+750],ensure_ascii=False),flush=True)
          for word in ["opt.onclick=","opt.onclick ="]:
              i=html.find(word)
              if i>=0:print("OPT_BUTTON_HANDLER",json.dumps(html[max(0,i-80):i+2000],ensure_ascii=False),flush=True)
          PY
