name: Check live stop optimizer
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Verify the authenticated Stop UI in Chrome
        run: node ops/ovh/stop-restore-previous-20261118/chrome.mjs
