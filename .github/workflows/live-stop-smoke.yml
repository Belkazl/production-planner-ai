name: Check live stop optimizer
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live candidate UI and API
        run: |
          python3 - <<'PY'
          import http.cookiejar, json, secrets, urllib.request, uuid
          url="https://app.liftorbit.app"
          client=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def fetch(path,method="GET",body=None):
              req=urllib.request.Request(url+path,method=method,data=json.dumps(body).encode() if body is not None else None,headers={"Content-Type":"application/json"})
              with client.open(req,timeout=50) as r:
                  return r.status,r.read().decode("utf-8")
          status,_=fetch("/api/auth/register","POST",{
              "email":"stop-smoke-"+uuid.uuid4().hex+"@liftorbit.invalid",
              "password":secrets.token_urlsafe(28),"company":"Disposable stop smoke test"})
          assert status==200,status
          status,html=fetch("/")
          assert status==200,(status,len(html))
          assert 'ppStopOptimizationV1' in html, "stop script missing"
          assert 'ppStopOptimizer' in html, "stop button missing"
          assert 'ppGanttToolV2' in html, "Gantt component missing"
          assert 'ppStopModal' in html, "stop choices modal missing"
          print("SMOKE_UI_OK",len(html),flush=True)
          status,body=fetch("/__bridge_health")
          assert status==200,(status,body[:1000])
          print("SMOKE_HEALTH_OK",body[:500],flush=True)
          import json,re
          status,body=fetch("/api/plan-progress?ppProgressCache=off")
          d=json.loads(body)
          assert d.get("ok") is True, "progress API did not return an accepted response"
          print("AUTHENTICATED_STOP_AND_PROGRESS_OK")
          PY
