name: Plan navigation OVH release
on:
  push:
    branches: [fix/plan-default-navigation-20261127]
    paths:
      - ops/ovh/plan-default-navigation-20261127/**
      - .github/workflows/liftorbit-planning-start-release-20261127.yml
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test native navigation and preserved chat
        run: |
          node --test ops/ovh/plan-default-navigation-20261127/test_*.mjs
          node --check ops/ovh/plan-default-navigation-20261127/browser_accept.mjs
          bash -n ops/ovh/plan-default-navigation-20261127/release.sh
          bash -n ops/ovh/plan-default-navigation-20261127/remote_release.sh
      - run: npm install --prefix /tmp/liftorbit-plan-default-navigation-test --no-save --no-package-lock --ignore-scripts playwright-core@1.58.2
      - name: Stage navigation patch, test chat and projects, deploy and verify
        env:
          DEPLOY_HOST: ${{ vars.OVH_HOST }}
          DEPLOY_USER: ${{ vars.OVH_USER }}
          DEPLOY_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: bash ops/ovh/plan-default-navigation-20261127/release.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: plan-default-nav-live
          path: /tmp/plan-default-nav-live.png
          retention-days: 7
