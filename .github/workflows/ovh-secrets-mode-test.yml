name: OVH migration - separate staging and production email modes safely
on:
  push:
    branches: [ops/railway-migration-20261108]
    paths: [.github/workflows/ovh-secrets-mode-test.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test synthetic secret transformation (no real secrets or records)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/ovh/render-secrets.py
          python3 - <<'PY'
          import json,pathlib,tempfile,subprocess
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)
              source=p/'source'
              source.mkdir()
              params={
                'postgres':{'DATABASE_URL':'postgresql://postgres:example@postgres.railway.internal:5432/railway'},
                'postgres-me4i':{'DATABASE_URL':'postgresql://postgres:example@postgres-me4i.railway.internal:5432/railway'},
                'gateway':{'PP_GENERIC_RESTORE_LAUNCH_V2':'synthetic-only'},
                'auth-gateway':{
                  'PP_QA_STATE_TOKEN':'synthetic-state-token',
                  'PP_QA_AUTH_ONLY':'1',
                  'RESEND_API_KEY':'synthetic-resend-token',
                  'PP_PASSWORD_RESET_FROM':'example@liftorbit.app',
                  'PP_PASSWORD_RESET_PUBLIC_ORIGIN':'https://app.liftorbit.app'},
                'auth-app':{'PP_PY_GA_STATE_TOKEN':'synthetic-state-token',
                            'PP_PY_GA_WORKER_TOKEN':'synthetic-worker-token',
                            'PP_PY_GA_WORKERS_ENABLED':'1',
                            'PP_PY_GA_PERSISTENCE_ENABLED':'1'},
                'ga-worker':{'PP_WORKER_INTERNAL_TOKEN':'synthetic-worker-token',
                             'PP_PY_GA_ADAPTER':'synthetic-adapter',
                             **{f'PP_RUNTIME_SRC_{i:02d}':'synthetic-chunk' for i in range(1,22)}}
              }
              for name,values in params.items():
                  (source/(name+'.json')).write_text(json.dumps(values))
              script='ops/ovh/render-secrets.py'
              for mode in ('staging','production'):
                  target=p/mode
                  result=subprocess.run(['python3',script,'--source',str(source),
                                         '--output',str(target),'--mode',mode],
                                         capture_output=True,text=True,check=True)
                  auth=json.loads((target/'auth.json').read_text())
                  for key in ('RESEND_API_KEY','PP_PASSWORD_RESET_FROM'):
                      assert (key in auth)==(mode=='production'),(mode,key)
                  assert auth['PP_PASSWORD_RESET_PUBLIC_ORIGIN']=='https://app.liftorbit.app'
                  assert (target/'postgres-main.env').is_file()
                  assert (target/'postgres-auth.env').is_file()
                  assert (target/'auth.json').stat().st_mode & 0o077 == 0
                  assert 'synthetic-resend-token' not in result.stdout+result.stderr
                  print('OVH_SECRET_MODE_SAFE',mode)
              bad=params['auth-gateway'].copy()
              bad['PP_PASSWORD_RESET_PUBLIC_ORIGIN']='https://unexpected.example'
              (source/'auth-gateway.json').write_text(json.dumps(bad))
              bad_target=p/'should-fail'
              fail=subprocess.run(['python3',script,'--source',str(source),
                                   '--output',str(bad_target),'--mode','production'],
                                  capture_output=True,text=True)
              assert fail.returncode!=0
              assert 'production_password_reset_origin_mismatch' in fail.stderr
              assert 'synthetic-resend-token' not in fail.stdout+fail.stderr
              print('OVH_PRODUCTION_EMAIL_INVALID_ORIGIN_REJECTED')
          PY
