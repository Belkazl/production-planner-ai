name: LiftOrbit guarded OVH GA stale model versus foreign plan correction
# Distinguish updated same-account model from genuinely foreign GA result.
# Suppress obsolete best previews when account model has changed.
# Stale equipment, stale setup and foreign-account isolation regressions passed 44111694762.
# Strict source hash, full Docker build and automatic rollback required.
# Verified in isolated account GA regressions 44111694762; no database changes.
# Repair anchored OVH progress persistence kept unchanged; tests passed 44112678060.
# Bounded Docker build failure logs enabled for safe predeployment diagnosis.
# Docker preflight uses the already-deployed continuation contract from pinned previous release.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ovh-ga-stale-model-release-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'release(liftorbit): correct stale account model GA result classification')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable production app
        uses: actions/checkout@v4
        with:
          ref: 4a1457d6f33e7ef5b6e8ad59c3e21ef345b8c25f
          path: pinned
          persist-credentials: false
      - name: Checkout previous verified OVH patch
        uses: actions/checkout@v4
        with:
          ref: 4765adaf3fe2c22f6130a23b87544dd36eb4b36f
          path: prior
          persist-credentials: false
      - name: Checkout deployed own-model GA bridge
        uses: actions/checkout@v4
        with:
          ref: c228648e41a4c65f2b9f1325c577a3ba03d6fb1b
          path: deployed
          persist-credentials: false
      - name: Checkout tested current GA stale model fix
        uses: actions/checkout@v4
        with:
          ref: e37784584b1bfe8f51b556f7bd37276e3914005f
          path: repaired
          persist-credentials: false
      - name: Checkout already released GA JSON compactor
        uses: actions/checkout@v4
        with:
          ref: 0158a0514b7bca113fee92b2389747d081a8a1f6
          path: compact
          persist-credentials: false
      - name: Verify exact one-file change and pinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p old/app new/app app
          cp -a pinned/. old/app/
          cp -a pinned/. new/app/
          cp deployed/python-ga-upstream.mjs old/app/python-ga-upstream.mjs
          cp repaired/python-ga-upstream.mjs new/app/python-ga-upstream.mjs
          # The current production Docker build already uses the updated
          # continuation contract installed with the previous GA release.
          # Pinned 2026-10 tests predate that fix and are intentionally obsolete.
          cp deployed/tests/continuation-compat-contract.cjs old/app/tests/continuation-compat-contract.cjs
          cp deployed/tests/continuation-compat-contract.cjs new/app/tests/continuation-compat-contract.cjs
          for side in old new; do
            for script in patch-runtime-origins.mjs repair-planner-ui.mjs repair-ga-state.mjs repair-ga-load.mjs repair-async-ga.mjs; do
              node "prior/ops/ovh/$script" "$side/app"
            done
            node compact/ops/ovh/compact-ga-progress.mjs "$side/app"
          done
          node --check old/app/python-ga-upstream.mjs
          node --check new/app/python-ga-upstream.mjs
          cp repaired/tests/python-ga-upstream.test.mjs new/app/tests/python-ga-upstream.test.mjs
          cp repaired/tests/ga-account-owned-recovery.test.mjs new/app/tests/ga-account-owned-recovery.test.mjs
          node --test new/app/tests/python-ga-upstream.test.mjs new/app/tests/ga-account-owned-recovery.test.mjs
          cp old/app/tests/python-ga-upstream.test.mjs new/app/tests/python-ga-upstream.test.mjs
          rm -f new/app/tests/ga-account-owned-recovery.test.mjs
          diff -qr old/app new/app > "$RUNNER_TEMP/ga-stale-model-patch-diff" || test "$?" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/ga-stale-model-patch-diff")" -eq 1
          grep -Fqx 'Files old/app/python-ga-upstream.mjs and new/app/python-ga-upstream.mjs differ' "$RUNNER_TEMP/ga-stale-model-patch-diff"
          grep -q 'PP_GA_OWN_MODEL_VERSION_STALE_TERMINAL' new/app/python-ga-upstream.mjs
          sha256sum old/app/python-ga-upstream.mjs | cut -d' ' -f1 > old.python-upstream.sha
          sha256sum new/app/python-ga-upstream.mjs | cut -d' ' -f1 > new.python-upstream.sha
          echo 'GA_STALE_MODEL_EXACT_ONE_SOURCE_CHANGED'
          docker build --progress=plain -t liftorbit-stale-model-release:preflight new/app > "$RUNNER_TEMP/ga-stale-model-docker-build.log" 2>&1 || {
            echo 'GA_STALE_MODEL_DOCKER_BUILD_FAILED'
            echo 'GA_STALE_MODEL_DOCKER_FAILURE_TAIL_BEGIN'
            tail -n 35 "$RUNNER_TEMP/ga-stale-model-docker-build.log" | cut -c 1-300
            echo 'GA_STALE_MODEL_DOCKER_FAILURE_TAIL_END'
            exit 22
          }
          echo 'GA_STALE_MODEL_DOCKER_BUILD_PASSED'
      - name: Apply guarded OVH app update with automatic rollback
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test "$OVH_HOST" = "51.255.163.121"
          test "$OVH_USER" = "liftorbit-ci"
          test -n "$OVH_SSH_PRIVATE_KEY"
          test -n "$OVH_SSH_KNOWN_HOSTS"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20)
          target="$OVH_USER@$OVH_HOST"
          oldSha=$(cat old.python-upstream.sha)
          newSha=$(cat new.python-upstream.sha)
          root=/home/liftorbit-ci/liftorbit-migration
          scp -q "${opts[@]}" new/app/python-ga-upstream.mjs "$target:$root/sources/ovh-app/python-ga-upstream.mjs.stale-model.next"
          ssh "${opts[@]}" "$target" bash -s -- "$oldSha" "$newSha" <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/liftorbit-migration"
          app="$root/sources/ovh-app/current/python-ga-upstream.mjs"
          next="$root/sources/ovh-app/python-ga-upstream.mjs.stale-model.next"
          backup="$root/patch-backups/ga-stale-model-20261117"
          expectedOld="$1"; expectedNew="$2"
          sha(){ sha256sum "$1" | cut -d' ' -f1; }
          test -f "$app" && test -f "$next"
          test "$(sha "$app")" = "$expectedOld" || { echo 'GA_STALE_MODEL_SOURCE_DRIFT_ABORT'; exit 5; }
          test "$(sha "$next")" = "$expectedNew" || { echo 'GA_STALE_MODEL_UPLOAD_HASH_MISMATCH'; exit 5; }
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null || { echo 'GA_STALE_MODEL_PREDEPLOY_SMOKE_FAILED'; exit 6; }
          mkdir -p "$backup"
          cp -p "$app" "$backup/python-ga-upstream.mjs"
          test "$(sha "$backup/python-ga-upstream.mjs")" = "$expectedOld"
          rollback(){
            trap - ERR
            cp -p "$backup/python-ga-upstream.mjs" "$app" || true
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo 'GA_STALE_MODEL_AUTOMATIC_ROLLBACK_ATTEMPTED'
          }
          trap rollback ERR
          mv "$next" "$app"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          healthy=no
          for attempt in $(seq 1 24); do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes || { echo 'GA_STALE_MODEL_POSTDEPLOY_HEALTH_FAILED'; false; }
          test "$(sha "$app")" = "$expectedNew"
          trap - ERR
          echo 'GA_STALE_MODEL_OVH_DEPLOYED_HEALTHY'
          REMOTE
      - name: Public HTTPS, guest boundary and no redirect
        shell: bash
        run: |
          set -euo pipefail
          healthy=no
          for attempt in $(seq 1 15); do
            public=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 https://app.liftorbit.app/__bridge_health || true)
            direct=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 --resolve app.liftorbit.app:443:51.255.163.121 https://app.liftorbit.app/__bridge_health || true)
            auth=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 https://app.liftorbit.app/api/auth/me || true)
            if [[ "$public" = 200 && "$direct" = 200 && "$auth" = 401 ]]; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes
          echo 'GA_STALE_MODEL_PUBLIC_API_HEALTHY'
