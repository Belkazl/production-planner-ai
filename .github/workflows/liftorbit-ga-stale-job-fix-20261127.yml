name: Verify and release GA orphaned-job recovery
on:
  push:
    branches: [fix/ga-status-recovery-20261127]
    paths:
      - ops/ovh/ga-status-recovery-20261127/patch.mjs
      - ops/ovh/ga-status-recovery-20261127/test.mjs
      - ops/ovh/ga-status-recovery-20261127/release.sh
      - .github/workflows/liftorbit-ga-stale-job-fix-20261127.yml
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/liftorbit-ga-status-test --no-save --no-package-lock --ignore-scripts playwright-core@1.58.2
      - name: Verify exact live bridge and install only after tests
        env:
          DEPLOY_HOST: ${{ vars.OVH_HOST }}
          DEPLOY_USER: ${{ vars.OVH_USER }}
          DEPLOY_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          bash -n ops/ovh/ga-status-recovery-20261127/release.sh
          bash ops/ovh/ga-status-recovery-20261127/release.sh
