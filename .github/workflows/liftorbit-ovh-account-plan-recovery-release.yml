name: LiftOrbit guarded OVH GA account-owned final and preview recovery
# Never publish foreign previews; allow only previously verified own-job checkpoint fallback.
# Guarded one-source-file release; tenant ownership tests and rollback required.
# Source regression run 43417095503 passed with foreign tenant plans rejected.
# Preflight requires real Docker build of unchanged etalon and valid owned-plan contract.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ovh-account-plan-recovery-release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'release(liftorbit): recover verified same-account GA plan on final rejection')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable production app
        uses: actions/checkout@v4
        with:
          ref: 4a1457d6f33e7ef5b6e8ad59c3e21ef345b8c25f
          path: pinned
          persist-credentials: false
      - name: Checkout previous verified OVH patch
        uses: actions/checkout@v4
        with:
          ref: 4765adaf3fe2c22f6130a23b87544dd36eb4b36f
          path: prior
          persist-credentials: false
      - name: Checkout tested ownership fix
        uses: actions/checkout@v4
        with:
          ref: fb0ce6d76c022fbb79b383e4888a189d63703e26
          path: repaired
          persist-credentials: false
      - name: Checkout already released GA JSON compactor
        uses: actions/checkout@v4
        with:
          ref: 0158a0514b7bca113fee92b2389747d081a8a1f6
          path: compact
          persist-credentials: false
      - name: Verify exact one-file change and pinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p old/app new/app app
          cp -a pinned/. old/app/
          cp -a pinned/. new/app/
          cp repaired/python-ga-upstream.mjs new/app/python-ga-upstream.mjs
          for side in old new; do
            for script in patch-runtime-origins.mjs repair-planner-ui.mjs repair-ga-state.mjs repair-ga-load.mjs repair-continuation.mjs repair-async-ga.mjs; do
              node "prior/ops/ovh/$script" "$side/app"
            done
            node compact/ops/ovh/compact-ga-progress.mjs "$side/app"
          done
          node --check old/app/python-ga-upstream.mjs
          node --check new/app/python-ga-upstream.mjs
          cp repaired/tests/ga-account-owned-recovery.test.mjs new/app/tests/ga-account-owned-recovery.test.mjs
          node --test new/app/tests/ga-account-owned-recovery.test.mjs new/app/tests/python-ga-upstream.test.mjs
          rm -f new/app/tests/ga-account-owned-recovery.test.mjs
          diff -qr old/app new/app > "$RUNNER_TEMP/ga-account-patch-diff" || test "$?" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/ga-account-patch-diff")" -eq 1
          grep -Fqx 'Files old/app/python-ga-upstream.mjs and new/app/python-ga-upstream.mjs differ' "$RUNNER_TEMP/ga-account-patch-diff"
          grep -q 'PP_GA_UNOWNED_FINAL_REPLACED_BY_VERIFIED_OWNED_BEST' new/app/python-ga-upstream.mjs
          sha256sum old/app/python-ga-upstream.mjs | cut -d' ' -f1 > old.python-upstream.sha
          sha256sum new/app/python-ga-upstream.mjs | cut -d' ' -f1 > new.python-upstream.sha
          echo 'GA_ACCOUNT_EXACT_ONE_WORKER_BRIDGE_SOURCE_CHANGED'
          docker build --quiet -t liftorbit-owned-release:preflight new/app > "$RUNNER_TEMP/ga-account-docker-build.log" 2>&1 || {
            echo 'GA_ACCOUNT_PINNED_DOCKER_BUILD_FAILED'
            exit 22
          }
          echo 'GA_ACCOUNT_PINNED_DOCKER_BUILD_PASS'
      - name: Apply guarded OVH app update with automatic rollback
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test "$OVH_HOST" = "51.255.163.121"
          test "$OVH_USER" = "liftorbit-ci"
          test -n "$OVH_SSH_PRIVATE_KEY"
          test -n "$OVH_SSH_KNOWN_HOSTS"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20)
          target="$OVH_USER@$OVH_HOST"
          oldSha=$(cat old.python-upstream.sha)
          newSha=$(cat new.python-upstream.sha)
          root=/home/liftorbit-ci/liftorbit-migration
          scp -q "${opts[@]}" new/app/python-ga-upstream.mjs "$target:$root/sources/ovh-app/python-ga-upstream.mjs.account.next"
          ssh "${opts[@]}" "$target" bash -s -- "$oldSha" "$newSha" <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/liftorbit-migration"
          app="$root/sources/ovh-app/current/python-ga-upstream.mjs"
          next="$root/sources/ovh-app/python-ga-upstream.mjs.account.next"
          backup="$root/patch-backups/ga-owned-final-20261113"
          expectedOld="$1"; expectedNew="$2"
          sha(){ sha256sum "$1" | cut -d' ' -f1; }
          test -f "$app" && test -f "$next"
          test "$(sha "$app")" = "$expectedOld" || { echo 'GA_ACCOUNT_PRODUCTION_SOURCE_DRIFT_ABORT'; exit 5; }
          test "$(sha "$next")" = "$expectedNew" || { echo 'GA_ACCOUNT_UPLOAD_INTEGRITY_FAILED'; exit 5; }
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null || { echo 'GA_ACCOUNT_PREDEPLOY_SMOKE_FAILED'; exit 6; }
          mkdir -p "$backup"
          cp -p "$app" "$backup/python-ga-upstream.mjs"
          test "$(sha "$backup/python-ga-upstream.mjs")" = "$expectedOld"
          rollback(){
            trap - ERR
            cp -p "$backup/python-ga-upstream.mjs" "$app" || true
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo 'GA_ACCOUNT_AUTOMATIC_ROLLBACK_ATTEMPTED'
          }
          trap rollback ERR
          mv "$next" "$app"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          healthy=no
          for attempt in $(seq 1 24); do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes || { echo 'GA_ACCOUNT_POSTDEPLOY_HEALTH_FAILED'; false; }
          test "$(sha "$app")" = "$expectedNew"
          trap - ERR
          echo 'GA_ACCOUNT_OWNED_FALLBACK_OVH_DEPLOYED_HEALTHY'
          REMOTE
      - name: Public HTTPS, guest boundary and no redirect
        shell: bash
        run: |
          set -euo pipefail
          healthy=no
          for attempt in $(seq 1 15); do
            public=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 https://app.liftorbit.app/__bridge_health || true)
            direct=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 --resolve app.liftorbit.app:443:51.255.163.121 https://app.liftorbit.app/__bridge_health || true)
            auth=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 https://app.liftorbit.app/api/auth/me || true)
            if [[ "$public" = 200 && "$direct" = 200 && "$auth" = 401 ]]; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes
          echo 'GA_ACCOUNT_PUBLIC_API_HEALTHY'
