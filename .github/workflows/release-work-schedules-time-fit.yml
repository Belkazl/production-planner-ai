name: Verify and release Work schedules time fields
on:
  push:
    branches: [main, release/work-schedules-time-fit-20261127, release/work-schedules-time-fit-retry-20261127]
    paths:
      - ops/ovh/work-schedules-time-fit/**
      - .github/workflows/release-work-schedules-time-fit.yml
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          bash -n ops/ovh/work-schedules-time-fit/release.sh
          npm install --prefix /tmp/liftorbit-equipment-sdk-toolbar-test --no-save --no-package-lock --ignore-scripts playwright-core@1.58.2
          node ops/ovh/work-schedules-time-fit/browser_accept.mjs
  release:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --prefix /tmp/liftorbit-equipment-sdk-toolbar-test --no-save --no-package-lock --ignore-scripts playwright-core@1.58.2
      - name: Release and verify work schedules time fields
        env:
          DEPLOY_HOST: ${{ vars.OVH_HOST }}
          DEPLOY_USER: ${{ vars.OVH_USER }}
          DEPLOY_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: bash ops/ovh/work-schedules-time-fit/release.sh
