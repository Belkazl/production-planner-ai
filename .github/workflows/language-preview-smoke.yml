name: Verify deployed EN/RU preview login
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  preview-login:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Exercise public read-only language preview
        run: node tests/language-preview-smoke.cjs
      - name: Save login screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-preview-en-ru-login
          path: |
            preview-login-english.png
            preview-login-russian.png
          retention-days: 3
          if-no-files-found: ignore
