name: Diagnose LiftOrbit native GA polling without production mutation
on:
  push:
    branches: [diagnostics/sse-native-poll-20261120]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect read-only live Chrome request origin diagnostic
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.57.0
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('ops/ovh/ga-start-recover-20261119/live-regression.mjs','utf8');
          const once=(a,b)=>{if(s.split(a).length!==2)throw Error('DRIFT '+a);s=s.replace(a,b)}
          once('const page=await ctx.newPage();',`const page=await ctx.newPage();
          const cdp=await ctx.newCDPSession(page);
          await cdp.send("Network.enable");
          let diagCount=0;
          cdp.on("Network.requestWillBeSent",e=>{
           try{
            const u=new URL(e.request.url);
            if(u.pathname==="/api/plan-progress"&&e.request.method==="GET"){
             const frames=e.initiator?.stack?.callFrames?.slice(0,7).map(f=>({
              file:f.url?.split("/").pop()?.split("?")[0],fn:f.functionName,line:f.lineNumber+1,col:f.columnNumber+1
             }));
             console.log("NATIVE_POLL_STACK",JSON.stringify({n:++diagCount,params:[...u.searchParams.keys()],via:e.initiator.type,frames}));
            }
           }catch{}
          });`);
          once('if(!guard.v4||!guard.shed)throw Error("LIVE_ADAPTIVE_GA_PROGRESS_NOT_INSTALLED_"+JSON.stringify(guard));',
              'console.log("NATIVE_DIAG_GUARD_OBSERVED",JSON.stringify(guard));');
          const start=' const safeAudit=plan=>{',end='} catch(e){';
          const i=s.indexOf(start),j=s.lastIndexOf(end);
          if(i<0||j<=i)throw Error('DIAG_SOURCE_RANGE_DRIFT');
          s=s.slice(0,i)+` for(let i=0;i<12;i++){
            await page.waitForTimeout(2500);
            const active=await page.evaluate(()=>({running:window.__PP_STOP_DEBUG__?.()?.running,
             phase:window.__PP_STOP_DEBUG__?.()?.remotePhase, percent:window.__PP_GA_PROGRESS_V5__?.state?.shown,
             progress:window.__PP_SSE_PROGRESS_V1__?.state?.percent}));
            console.log("NATIVE_DIAG_SAMPLE",i,JSON.stringify(active));
            if(!active.running&&i>4)break;
          }
          console.log("NATIVE_DIAG_TOTAL",diagCount);
          `+s.slice(j);
          fs.writeFileSync('ops/ovh/ga-start-recover-20261119/_native-poll-diagnostic.mjs',s);
          NODE
          node ops/ovh/ga-start-recover-20261119/_native-poll-diagnostic.mjs
      - name: Inspect protected OVH client source read-only
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          scp -q -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST:/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/current/restart-optimizer-ui.js" "$RUNNER_TEMP/ui.js"
          UI_PATH="$RUNNER_TEMP/ui.js" node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync(process.env.UI_PATH,'utf8');
          const lines=src.split('\n');
          const terms=['/api/plan-progress','plan-progress?','ppNoCache','ppReconnect','ppStopConfirm','setInterval(','ppLightweightLiveGanttV2','ppSingleServerProgressV5'];
          for(const term of terms){
            const hits=[];
            for(let i=0;i<lines.length;i++)if(lines[i].includes(term))hits.push(i+1);
            console.log('AUDIT_TERM',term,'COUNT',hits.length,'LINES',hits.slice(0,100).join(','));
            if(term.includes('progress')||term.startsWith('pp')){
              for(const n of hits.slice(0,40)){
                // Source snippets are local code, never runtime tokens or model contents.
                let snippet=lines.slice(Math.max(0,n-2),Math.min(lines.length,n+2)).join(' ').trim().slice(0,450);
                snippet=snippet.replace(/[\x00-\x1f]/g,' ').replace(/Bearer\s+[^\s'"]+/ig,'Bearer [redacted]');
                console.log('AUDIT_SNIPPET_LINE',n,snippet);
              }
            }
          }
          console.log('AUDIT_SOURCE_LENGTH',src.length);
          NODE
