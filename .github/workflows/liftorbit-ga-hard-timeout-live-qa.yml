name: LiftOrbit 1008-operation real GA hard-timeout acceptance
# Postrelease regression: verify 1008-operation real GA after account-ownership bridge change.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-hard-timeout-live-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Observe large real GA progress responses on disposable user only
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, uuid, secrets, time, sys
          base="https://app.liftorbit.app";cookie=""
          def query(path,method="GET",body=None):
            global cookie
            headers={"Origin":base,"Sec-Fetch-Site":"same-origin","Accept":"application/json"}
            if cookie:headers["Cookie"]=cookie
            data=json.dumps(body).encode() if body is not None else None
            if body is not None:headers["Content-Type"]="application/json"
            req=urllib.request.Request(base+path,method=method,data=data,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                status=r.status;headers=r.headers;raw=r.read(16_000_001)
            except urllib.error.HTTPError as e:
              status=e.code;headers=e.headers;raw=e.read(16_000_001)
            except Exception as e:
              print("GA_PAYLOAD_TRANSPORT_ERROR",type(e).__name__,flush=True)
              return 0,{},0,"exception",False
            if path=="/api/auth/register":cookie=(headers.get("Set-Cookie") or "").split(";")[0]
            mime=(headers.get("Content-Type") or "").split(";")[0]
            try:obj=json.loads(raw);parsed=True
            except (ValueError,UnicodeError):obj={};parsed=False
            return status,obj,len(raw),mime,parsed
          def check(label,r,allowed=(200,)):
            status,data,size,mime,parsed=r
            print("GA_PAYLOAD",label,"http",status,"bytes",size,"mime",mime,"json",parsed,
                  "phase",str(data.get("phase") or "-")[:28],
                  "running",data.get("running"),
                  "best_ops",len((data.get("best_preview") or {}).get("operations") or []),
                  "candidate_ops",len((data.get("candidate_preview") or {}).get("operations") or []),flush=True)
            if status not in allowed or not parsed:
              raise RuntimeError("GA_PAYLOAD_"+label+"_INVALID")
            return data
          rq=lambda typ,ref:{"resource_type":typ,"match_mode":"specific","resource_ref":ref,
                            "resource_refs":[ref],"quantity":1}
          eq=[{"id":"EQ"+str(n),"name":"QA machine","kind":"workstation","capacity":600,"capacity_unit":"m2"} for n in range(14)]
          staff=[{"id":"EM"+str(n),"name":"QA employee","shift":"day"} for n in range(5)]
          ops=[{"id":"OP"+str(n),"name":"QA step","sequence":n+1,"duration_min":30,
                "resource_requirements":[rq("equipment","EQ"+str(n)),rq("employee","EM"+str(n%5))]} for n in range(7)]
          orders=[{"id":"O"+str(n),"quantity":7200,"unit":"m2","technical_process_id":"TP"} for n in range(12)]
          model={"scheduler_mode":"resource","start":"2026-11-12T08:00:00","equipment":eq,
            "employees":staff,"shifts":{"day":[["08:00","12:00"],["13:00","17:00"]]},
            "orders":orders,"technical_processes":[{"id":"TP","name":"QA pipeline","operations":ops}],
            "materials":[],"setup_rules":[]}
          stopped=False
          try:
            check("register",query("/api/auth/register","POST",{
              "email":"ga-payload-"+uuid.uuid4().hex+"@liftorbit.invalid",
              "password":secrets.token_urlsafe(32),"company":"Disposable GA payload QA"}))
            key="qa-"+uuid.uuid4().hex
            check("storage",query("/api/db-storage","POST",{"storage":{
              "prodplan.projects.v2":json.dumps([{"id":key,"name":"QA","model":model}]),
              "prodplan.project.active.v2":key}}))
            check("start",query("/api/plan","POST",{"generations":15000,"population":80,
              "seed":4321,"objective":"duration","__pp_async_start":True}),allowed=(202,))
            sizes=[]
            for tick in range(58):
              time.sleep(4)
              result=query("/api/plan-progress")
              status,data,size,mime,parsed=result
              print("GA_PAYLOAD_SAMPLE",tick,"status",status,"bytes",size,"mime",mime,
                    "valid_json",parsed,"running",data.get("running"),
                    "best_rows",len((data.get("best_preview") or {}).get("operations") or []),
                    "candidate_rows",len((data.get("candidate_preview") or {}).get("operations") or []),
                    "final_rows",len((data.get("result") or {}).get("operations") or []),flush=True)
              sizes.append(size)
              if status!=200 or not parsed:raise RuntimeError("PROGRESS_NOT_VALID_JSON")
              if data.get("running") is False:break
            print("GA_PAYLOAD_SUMMARY","samples",len(sizes),"largest_bytes",max(sizes or [0]),flush=True)
            final=data.get("result") or {}
            success=data.get("phase")=="completed" and data.get("success") is True
            checkpoint=bool(final.get("optimization_time_limit_reached"))
            resumable=isinstance(final.get("resume_state"),dict)
            print("GA_LIVE_180SEC_TIMEOUT_ACCEPTANCE",
                  "phase",str(data.get("phase") or "none")[:24],
                  "success",success,
                  "time_budget_reached",checkpoint,
                  "resumable",resumable,
                  "final_rows",len(final.get("operations") or []),
                  "error",str(data.get("error") or "none")[:50],flush=True)
            if not(success and checkpoint and resumable and final.get("valid") is True
                   and len(final.get("operations") or [])>=1000):
              raise RuntimeError("LIVE_GA_HARD_TIMEOUT_RECOVERY_NOT_VERIFIED")
          except Exception as e:
            print("GA_PAYLOAD_QA_FAILED",type(e).__name__,str(e)[:80],flush=True)
            sys.exit(1)
          finally:
            if cookie:
              try:
                status,data,size,mime,parsed=query("/api/optimizer-stop","POST",{})
                print("GA_PAYLOAD_QA_STOP","status",status,flush=True)
              except Exception:pass
          PY
