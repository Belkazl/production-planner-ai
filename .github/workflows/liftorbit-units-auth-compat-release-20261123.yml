name: Apply canonical units to actual LiftOrbit auth compatibility page
on:
  push:
    branches: [main, fix/units-auth-compat-html-20261123]
    paths:
      - .github/workflows/liftorbit-units-auth-compat-release-20261123.yml
      - ops/ovh/units-auth-compat-20261123/**
permissions: {contents: read}
concurrency:
  group: liftorbit-auth-native-units-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Guard auth fallback, tested unit helper and deploy one file to OVH on main
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = 51.255.163.121
          test "$USER" = liftorbit-ci
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$KEY" > "$d/key"
          printf '%s\n' "$KH" > "$d/known_hosts"
          chmod 600 "$d/key" "$d/known_hosts"
          ssh_call(){ ssh -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" -o ConnectTimeout=20 "$@"; }
          scp_call(){ scp -q -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" -o ConnectTimeout=20 "$@"; }
          root=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app
          scp_call "$USER@$HOST:$root/current/auth-runtime.js" "$d/old.js"
          scp_call "$USER@$HOST:$root/current/restart-optimizer-html.js" "$d/unit.js"
          node ops/ovh/units-auth-compat-20261123/patch.mjs "$d/old.js" "$d/new.js" "$d/unit.js"
          node --check "$d/new.js"
          node --check "$d/unit.js"
          node - "$d/old.js" "$d/new.js" "$d/unit.js" <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),vm=require('node:vm');
          const [before,after,unit]=process.argv.slice(2).map(f=>fs.readFileSync(f,'utf8'));
          const old="return new Response(enhanced,{";
          const fixed="return new Response(ppResourceUnitsHtml(enhanced),{";
          assert.equal(after.replace(fixed,old),before,"one auth fallback line only");
          assert.equal(after.split(fixed).length,2);
          assert(unit.includes("return ppResourceUnitsHtml(html);"),"restart module unit transformer deployed");
          assert.equal(unit.split("function ppResourceUnitsHtml(input){").length,2);
          const ctx={};
          const unitSource=unit.slice(unit.indexOf("function ppResourceUnitsHtml(input){"));
          vm.runInNewContext(unitSource+";this.transform=ppResourceUnitsHtml;",ctx);
          assert.equal(ctx.transform("login-only page"),"login-only page");
          console.log("UNITS_AUTH_FALLBACK_HTML_AND_HELPER_PREFLIGHT_PASS");
          JS
          if [ "$GITHUB_REF" != refs/heads/main ];then
            echo UNITS_AUTH_FALLBACK_READONLY_PREFLIGHT_PASS
            exit 0
          fi
          old_sha=$(sha256sum "$d/old.js"|cut -d' ' -f1)
          new_sha=$(sha256sum "$d/new.js"|cut -d' ' -f1)
          stage="$root/auth-runtime.units-canonical-20261123.next"
          scp_call "$d/new.js" "$USER@$HOST:$stage"
          ssh_call "$USER@$HOST" bash -s -- "$old_sha" "$new_sha" <<'REMOTE'
          set -euo pipefail
          root="$HOME/liftorbit-migration/sources/ovh-app"
          target="$root/current/auth-runtime.js"
          stage="$root/auth-runtime.units-canonical-20261123.next"
          backup="$HOME/liftorbit-migration/patch-backups/units-auth-compat-20261123"
          sha(){ sha256sum "$1"|cut -d' ' -f1; }
          test "$(sha "$target")" = "$1" || { echo UNITS_AUTH_SOURCE_DRIFT;exit 5; }
          test "$(sha "$stage")" = "$2" || { echo UNITS_AUTH_STAGE_MISMATCH;exit 5; }
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          mkdir -p "$backup"
          cp -p "$target" "$backup/auth-runtime.js"
          rollback(){
            trap - ERR
            cp -p "$backup/auth-runtime.js" "$target" || true
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo UNITS_AUTH_ROLLBACK_ATTEMPTED
          }
          trap rollback ERR
          mv "$stage" "$target"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          healthy=no
          for i in $(seq 1 40);do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1;then healthy=yes;break;fi
            sleep 5
          done
          test "$healthy" = yes
          test "$(sha "$target")" = "$2"
          trap - ERR
          echo UNITS_AUTH_DEPLOYED_SMOKE_PASS
          REMOTE
          scp_call "$USER@$HOST:$root/current/auth-runtime.js" "$d/deployed.js"
          test "$(sha256sum "$d/deployed.js"|cut -d' ' -f1)" = "$new_sha"
          echo UNITS_AUTH_DEPLOYED_SHA_VERIFIED
      - name: Verify published app and auth isolation
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          ok=no
          for i in $(seq 1 12);do
            health=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/__bridge_health || true)
            unauth=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/api/auth/me || true)
            if [ "$health" = 200 ] && [ "$unauth" = 401 ];then ok=yes;break;fi
            sleep 5
          done
          test "$ok" = yes
          echo UNITS_AUTH_PUBLIC_HEALTH_PASS
  browser:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Actual published Unit fields in Production and Materials, legacy units sync and save QA
        env:
          PP_UNITS_LIVE: "1"
        run: node ops/ovh/units-single-source-20261123/preflight.mjs