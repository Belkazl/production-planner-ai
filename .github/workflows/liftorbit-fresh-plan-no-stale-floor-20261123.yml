name: Fix fresh optimizer ignoring pre-reset saved project plan
on:
  push:
    branches: [main, fix/fresh-repeat-old-plan-leak-20261123]
    paths:
      - .github/workflows/liftorbit-fresh-plan-no-stale-floor-20261123.yml
      - ops/ovh/fresh-plan-leak-20261123/**
permissions: {contents: read}
concurrency:
  group: liftorbit-fresh-result-isolation-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Guard client quality floor and native persisted-plan selector, deploy only on main
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = 51.255.163.121
          test "$USER" = liftorbit-ci
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$KEY" > "$d/key"
          printf '%s\n' "$KH" > "$d/kh"
          chmod 600 "$d/key" "$d/kh"
          ssh_call(){ ssh -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" -o ConnectTimeout=20 "$@"; }
          scp_call(){ scp -q -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" -o ConnectTimeout=20 "$@"; }
          root=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app
          scp_call "$USER@$HOST:$root/current/restart-optimizer-ui.js" "$d/old-ui.js"
          scp_call "$USER@$HOST:$root/current/restart-optimizer-html.js" "$d/old-html.js"
          node ops/ovh/fresh-plan-leak-20261123/patch.mjs "$d/old-ui.js" "$d/old-html.js" "$d/new-ui.js" "$d/new-html.js"
          node --check "$d/new-ui.js"
          node --check "$d/new-html.js"
          node - "$d/old-ui.js" "$d/old-html.js" "$d/new-ui.js" "$d/new-html.js" <<'JS'
          const fs=require("node:fs"),assert=require("node:assert/strict"),vm=require("node:vm");
          const [oldUi,oldHtml,newUi,newHtml]=process.argv.slice(2).map(p=>fs.readFileSync(p,"utf8"));
          assert.equal(newUi.split("const currentFreshPlan=window.__ppFreshReferencePlan;").length,2);
          assert.equal(newHtml.split("window.__ppFreshRestartProject===id&&!window.__ppFreshReferencePlan").length,2);
          assert.equal(newHtml.split("if(!(window.__ppFreshRestartMode===true&&window.__ppFreshRestartProject===id)&&prev&&").length,2);
          assert.equal(newUi.split("quick:Object.freeze({generations:3,population:6})").length,2);
          for(const marker of ["function ppOneSseProgressAndGantt(){","__PP_CONTINUATION_SEED_V2__","ppOptimizerStartOver"]){
            assert(oldUi.includes(marker));assert(newUi.includes(marker));
          }
          const ctx={};vm.runInNewContext(newHtml+";this.transform=ppStartOverHtml;",ctx);
          const sample=[
            "function ppIncumbentCurrentPlan(){let saved=null;",
            "const entry=find(id),prev=entry&&entry.lastPlan,goal=",
            "if(prev&&prev.valid!==false&&Number(prev._revision??entry.revision)"
          ].join("\n");
          const transformed=ctx.transform(sample);
          assert(transformed.includes("window.__ppFreshRestartProject===id&&!window.__ppFreshReferencePlan"));
          assert(transformed.includes("if(!(window.__ppFreshRestartMode===true&&window.__ppFreshRestartProject===id)&&prev&&"));
          assert(!transformed.includes("if(!window.__ppFreshRestartPending&&prev&&"));
          assert(transformed.includes("ppIncumbentCurrentPlan(){if(window.__ppFreshRestartPending)return null;"));
          assert.equal(ctx.transform("unrelated content"),"unrelated content");
          console.log("FRESH_NO_STALE_NATIVE_HTML_AND_CLIENT_TEST_PASS");
          JS
          old_ui=$(sha256sum "$d/old-ui.js"|cut -d' ' -f1)
          old_html=$(sha256sum "$d/old-html.js"|cut -d' ' -f1)
          new_ui=$(sha256sum "$d/new-ui.js"|cut -d' ' -f1)
          new_html=$(sha256sum "$d/new-html.js"|cut -d' ' -f1)
          if [ "$GITHUB_REF" != refs/heads/main ];then
            echo FRESH_NO_STALE_PLAN_READONLY_PREFLIGHT_PASS
            exit 0
          fi
          scp_call "$d/new-ui.js" "$USER@$HOST:$root/restart-optimizer-ui.fresh-no-old.next"
          scp_call "$d/new-html.js" "$USER@$HOST:$root/restart-optimizer-html.fresh-no-old.next"
          ssh_call "$USER@$HOST" bash -s -- "$old_ui" "$old_html" "$new_ui" "$new_html" <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/liftorbit-migration/sources/ovh-app"
          ui="$root/current/restart-optimizer-ui.js"
          html="$root/current/restart-optimizer-html.js"
          ui_next="$root/restart-optimizer-ui.fresh-no-old.next"
          html_next="$root/restart-optimizer-html.fresh-no-old.next"
          backup="$HOME/liftorbit-migration/patch-backups/fresh-no-stale-plan-20261123"
          sha(){ sha256sum "$1"|cut -d' ' -f1; }
          test "$(sha "$ui")" = "$1" || { echo FRESH_NO_STALE_UI_DRIFT;exit 5; }
          test "$(sha "$html")" = "$2" || { echo FRESH_NO_STALE_HTML_DRIFT;exit 5; }
          test "$(sha "$ui_next")" = "$3" || { echo FRESH_NO_STALE_UI_UPLOAD_CORRUPT;exit 5; }
          test "$(sha "$html_next")" = "$4" || { echo FRESH_NO_STALE_HTML_UPLOAD_CORRUPT;exit 5; }
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          mkdir -p "$backup"
          cp -p "$ui" "$backup/restart-optimizer-ui.js"
          cp -p "$html" "$backup/restart-optimizer-html.js"
          rollback(){
            trap - ERR
            cp -p "$backup/restart-optimizer-ui.js" "$ui" || true
            cp -p "$backup/restart-optimizer-html.js" "$html" || true
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo FRESH_NO_STALE_PLAN_ROLLBACK_ATTEMPTED
          }
          trap rollback ERR
          mv "$ui_next" "$ui"
          mv "$html_next" "$html"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          healthy=no
          for i in $(seq 1 40);do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1;then healthy=yes;break;fi
            sleep 5
          done
          test "$healthy" = yes
          test "$(sha "$ui")" = "$3"
          test "$(sha "$html")" = "$4"
          trap - ERR
          echo FRESH_NO_STALE_PLAN_OVH_DEPLOYED_HEALTHY
          REMOTE
          scp_call "$USER@$HOST:$root/current/restart-optimizer-ui.js" "$d/deployed-ui.js"
          scp_call "$USER@$HOST:$root/current/restart-optimizer-html.js" "$d/deployed-html.js"
          test "$(sha256sum "$d/deployed-ui.js"|cut -d' ' -f1)" = "$new_ui"
          test "$(sha256sum "$d/deployed-html.js"|cut -d' ' -f1)" = "$new_html"
          echo FRESH_NO_STALE_PLAN_DEPLOYED_FILES_VERIFIED
      - name: Production HTTPS and auth boundary
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          ok=no
          for i in $(seq 1 12);do
            health=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/__bridge_health || true)
            guest=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/api/auth/me || true)
            if [ "$health" = 200 ] && [ "$guest" = 401 ];then ok=yes;break;fi
            sleep 5
          done
          test "$ok" = yes
          echo FRESH_NO_STALE_PLAN_PUBLIC_HEALTH_PASS
  browser:
    if: github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Verify first fresh result never replaced by valid previous stored plan
        run: node ops/ovh/fresh-plan-leak-20261123/live.mjs