name: LiftOrbit STOP previous rollback release status audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-stop-restore-previous-run-status-20261118.yml
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Record exact new STOP rollout run status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          path=ops/ovh/test-results/stop-restore-previous-runs-latest.txt
          mkdir -p "$(dirname "$path")"
          gh api 'repos/Belkazl/production-planner-ai/actions/workflows/liftorbit-ovh-stop-restore-previous-release-20261118.yml/runs?per_page=7' --jq '.workflow_runs[] | "run_id=\(.id) status=\(.status) conclusion=\(.conclusion) event=\(.event) sha=\(.head_sha[0:10])"' > "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record STOP rollback release run status'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
          fi
