name: LiftOrbit SSE push production release and 886-operation regression
on:
  workflow_run:
    workflows: ["LiftOrbit SSE end-to-end protocol and UI tests"]
    types: [completed]
permissions: {contents: read}
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify pinned SSE patch and stage exact four production source files
        id: preflight
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121" && test "$USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20)
          base=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/current
          ga_root=/home/liftorbit-ci/liftorbit-migration/sources/current/ga
          mkdir -p old/ga_python_workers/ga_workers new
          for file in python-ga-upstream.mjs restart-optimizer-ui.js async-plan-transport.js; do
            scp -q "${opts[@]}" "$USER@$HOST:$base/$file" "old/$file"
          done
          for file in manager.py server.py; do
            scp -q "${opts[@]}" "$USER@$HOST:$ga_root/ga_workers/$file" "old/ga_python_workers/ga_workers/$file"
          done
          cp -a old/. new/
          node ops/ovh/sse-stream-v1-20261120/patch-worker.mjs new
          node ops/ovh/sse-stream-v1-20261120/patch-backend.mjs new
          node ops/ovh/sse-stream-v1-20261120/patch-frontend.mjs new
          node ops/ovh/sse-stream-v1-20261120/patch-native-transport.mjs new
          node --check new/async-plan-transport.js
          node --check new/python-ga-upstream.mjs
          node --check new/restart-optimizer-ui.js
          python3 -m py_compile new/ga_python_workers/ga_workers/manager.py new/ga_python_workers/ga_workers/server.py
          node ops/ovh/sse-stream-v1-20261120/build-live-qa.mjs
          node --check ops/ovh/sse-stream-v1-20261120/_live-qa.mjs
          python3 ops/ovh/sse-stream-v1-20261120/test-worker.py
          python3 ops/ovh/sse-stream-v1-20261120/test-worker-http.py
          node ops/ovh/sse-stream-v1-20261120/test-backend.mjs
          npm install --no-save --no-package-lock playwright-core@1.57.0
          node ops/ovh/sse-stream-v1-20261120/test-client.cjs
          for file in python-ga-upstream.mjs restart-optimizer-ui.js async-plan-transport.js; do
            sha256sum "old/$file" | cut -d' ' -f1 > "$RUNNER_TEMP/original-$file.sha"
            sha256sum "new/$file" | cut -d' ' -f1 > "$RUNNER_TEMP/new-$file.sha"
          done
          for file in manager.py server.py; do
            sha256sum "old/ga_python_workers/ga_workers/$file" | cut -d' ' -f1 > "$RUNNER_TEMP/original-$file.sha"
            sha256sum "new/ga_python_workers/ga_workers/$file" | cut -d' ' -f1 > "$RUNNER_TEMP/new-$file.sha"
          done
          echo SSE_NATIVE_EVENT_STREAM_4_SOURCE_PINNED_PREFLIGHT_PASS
      - name: Backup and deploy private-worker, Bun SSE bridge, one browser progress bar
        id: rollout
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20)
          base=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app
          for file in python-ga-upstream.mjs restart-optimizer-ui.js async-plan-transport.js; do
            scp -q "${opts[@]}" "new/$file" "$USER@$HOST:$base/sse-v1-$file.next"
          done
          for file in manager.py server.py; do
            scp -q "${opts[@]}" "new/ga_python_workers/ga_workers/$file" "$USER@$HOST:$base/sse-v1-$file.next"
          done
          ssh "${opts[@]}" "$USER@$HOST" bash -s --            "$(cat "$RUNNER_TEMP/original-python-ga-upstream.mjs.sha")" "$(cat "$RUNNER_TEMP/new-python-ga-upstream.mjs.sha")"            "$(cat "$RUNNER_TEMP/original-restart-optimizer-ui.js.sha")" "$(cat "$RUNNER_TEMP/new-restart-optimizer-ui.js.sha")" "$(cat "$RUNNER_TEMP/original-async-plan-transport.js.sha")" "$(cat "$RUNNER_TEMP/new-async-plan-transport.js.sha")"            "$(cat "$RUNNER_TEMP/original-manager.py.sha")" "$(cat "$RUNNER_TEMP/new-manager.py.sha")"            "$(cat "$RUNNER_TEMP/original-server.py.sha")" "$(cat "$RUNNER_TEMP/new-server.py.sha")" <<'REMOTE'
          set -euo pipefail
          root="$HOME/liftorbit-migration"
          base="$root/sources/ovh-app"
          backup="$root/patch-backups/sse-native-push-v1-20261120"
          names=(python-ga-upstream.mjs restart-optimizer-ui.js async-plan-transport.js manager.py server.py)
          files=("$base/current/python-ga-upstream.mjs" "$base/current/restart-optimizer-ui.js"
                 "$base/current/async-plan-transport.js"
                 "$root/sources/current/ga/ga_workers/manager.py"
                 "$root/sources/current/ga/ga_workers/server.py")
          staged=("$base/sse-v1-python-ga-upstream.mjs.next" "$base/sse-v1-restart-optimizer-ui.js.next"
                  "$base/sse-v1-async-plan-transport.js.next"
                  "$base/sse-v1-manager.py.next" "$base/sse-v1-server.py.next")
          expected=("$@")
          sha(){ sha256sum "$1" | cut -d' ' -f1; }
          test "${#expected[@]}" -eq 10
          for i in 0 1 2 3 4; do
            test "$(sha "${files[$i]}")" = "${expected[$((2*i))]}"
            test "$(sha "${staged[$i]}")" = "${expected[$((2*i+1))]}"
          done
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          mkdir -p "$backup"
          for i in 0 1 2 3 4; do
            cp -p "${files[$i]}" "$backup/${names[$i]}"
            test "$(sha "$backup/${names[$i]}")" = "${expected[$((2*i))]}"
          done
          rollback(){
            trap - ERR
            for i in 0 1 2 3 4; do cp -p "$backup/${names[$i]}" "${files[$i]}" || true; done
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo SSE_NATIVE_PUSH_ROLLBACK_ATTEMPTED
          }
          trap rollback ERR
          for i in 0 1 2 3 4; do mv "${staged[$i]}" "${files[$i]}"; done
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          healthy=no
          for attempt in $(seq 1 32); do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1; then healthy=yes;break;fi
            sleep 5
          done
          test "$healthy" = yes
          for i in 0 1 2 3 4; do test "$(sha "${files[$i]}")" = "${expected[$((2*i+1))]}"; done
          trap - ERR
          echo SSE_NATIVE_PUSH_PRODUCTION_DEPLOYED
          REMOTE
      - name: Validate HTTPS service, authentication and stream access boundary
        id: health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            health=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/__bridge_health || true)
            guest=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/api/auth/me || true)
            stream=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/api/plan-events || true)
            if [[ "$health" = 200 && "$guest" = 401 && "$stream" = 401 ]]; then
              echo SSE_AUTH_BOUNDARY_HTTPS_HEALTH_PASS
              exit 0
            fi
            sleep 4
          done
          exit 1
      - name: Genuine 886-operation two-run SSE browser optimization, zero periodic API, final 100 and 502 recovery
        id: live
        shell: bash
        run: |
          set -euo pipefail
          node ops/ovh/sse-stream-v1-20261120/_live-qa.mjs
          echo SSE_NATIVE_TWO_RUN_REAL_886_OPERATIONS_VALIDATED
      - name: Restore exact previous four files if public regression fails
        if: ${{ failure() && steps.rollout.outcome == 'success' }}
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          root="$HOME/liftorbit-migration"
          backup="$root/patch-backups/sse-native-push-v1-20261120"
          base="$root/sources/ovh-app/current"
          for n in python-ga-upstream.mjs restart-optimizer-ui.js async-plan-transport.js manager.py server.py; do test -r "$backup/$n"; done
          cp -p "$backup/python-ga-upstream.mjs" "$base/python-ga-upstream.mjs"
          cp -p "$backup/restart-optimizer-ui.js" "$base/restart-optimizer-ui.js"
          cp -p "$backup/async-plan-transport.js" "$base/async-plan-transport.js"
          cp -p "$backup/manager.py" "$root/sources/current/ga/ga_workers/manager.py"
          cp -p "$backup/server.py" "$root/sources/current/ga/ga_workers/server.py"
          if ! sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/qa-rollback-private.log" 2>&1; then
            echo SSE_ROLLBACK_REBUILD_NONZERO_CHECKING_ACTIVE_HEALTH
          fi
          healthy=no
          for attempt in $(seq 1 24); do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1; then healthy=yes;break;fi
            sleep 5
          done
          test "$healthy" = yes
          echo SSE_NATIVE_PUSH_FOUR_FILE_ROLLBACK_VERIFIED
          REMOTE
      - name: Summary
        if: always()
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          ROLLOUT: ${{ steps.rollout.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          LIVE: ${{ steps.live.outcome }}
        run: echo "SSE_NATIVE_PUSH_V1 preflight=$PREFLIGHT rollout=$ROLLOUT health=$HEALTH live=$LIVE"