name: Parallel ten-tenant optimizer regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  parallel-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - name: Compile production-equivalent gateway
        run: |
          bun run build-bridge.ts
          bun run feature-stop.ts
          bun run gantt-details.ts
          bun run order-accordion.ts
          bun run auth-bridge.ts
          bun run ceramics-resource-repair.ts
          bun run restart-optimizer.ts
          bun run documents-tab.ts
          bun run ga-execution-budget.ts
          bun run language-build.ts
          bun build index.ts --target=bun --outdir=/tmp/parallel-check
      - name: Ten real overlapping HTTP jobs with isolated input and output
        run: |
          bun tests/parallel-tenants-mock.ts >/tmp/parallel-mock.log 2>&1 &
          mockpid=$!
          APS_UPSTREAM=http://127.0.0.1:18080 PP_AUTH_GATEWAY_ORIGIN=http://127.0.0.1:18080 PORT=8080 bun index.ts >/tmp/parallel-gateway.log 2>&1 &
          gatewaypid=$!
          trap 'kill "$gatewaypid" "$mockpid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/__bridge_health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          python3 tests/parallel-tenants.py || { tail -100 /tmp/parallel-gateway.log; cat /tmp/parallel-mock.log; exit 1; }
