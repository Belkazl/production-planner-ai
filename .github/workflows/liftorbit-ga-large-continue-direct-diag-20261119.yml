name: LiftOrbit directly re-run large 886-operation Continue without UI resume plan
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-large-continue-direct-diag-20261119.yml
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: First real large plan then direct server continue without UI seeds
        shell: bash
        env:
          FREEZE_TEST_MODE: skip-gantt
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.57.0
          node ops/ovh/ga-post502-isolation-20261119/generate-repeat-direct-continue.mjs
          node --check ops/ovh/ga-post502-isolation-20261119/_direct-continue-second.mjs
          node ops/ovh/ga-post502-isolation-20261119/_direct-continue-second.mjs
