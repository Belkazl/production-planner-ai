name: Inspect current OVH fresh reset GA source
on:
  push:
    branches: [diagnose/fresh-repeat-4335-20261123]
    paths: [.github/workflows/inspect-fresh-repeat-4335-20261123.yml]
permissions: {contents: read}
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Find old plan and repeat-run pathways without modifying OVH
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = 51.255.163.121
          test "$USER" = liftorbit-ci
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$KEY" > "$d/key"
          printf '%s\n' "$KH" > "$d/kh"
          chmod 600 "$d/key" "$d/kh"
          ssh -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" "$USER@$HOST" python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path.home()/"liftorbit-migration/sources"
          ui=root/"ovh-app/current"
          ga=root/"current/ga/ga_workers"
          files=[ui/"restart-optimizer-ui.js",ga/"full_runtime_adapter.py",ga/"continuation.py"]
          print("SERVER_APP_SOURCE_DIRS")
          for folder in [ui,root/"planner",ga]:
            print('DIR',folder)
            for p in sorted(folder.glob("*"))[:60]:print('CHILD',p.name)
          from pathlib import Path
          import re
          p=ui/"restart-optimizer-html.js"
          print('HTML_PATCH_FILE',len(p.read_text().splitlines()))
          for i,line in enumerate(p.read_text().splitlines(),1):print(f'HTML {i:04d} {line[:280]}')
          p=ui/"baselines/2026-10-10/aps-setup-bridge/index.ts"
          ls=p.read_text(errors="replace").splitlines()
          hits=[i for i,line in enumerate(ls) if re.search(r'ppFreshObjectiveFloor|ppIncumbentCurrentPlan|ppIncumbentDecision|ppDec=|__ppFreshRestartPending',line)]
          print('INDEX_FOUND',len(hits),'total lines',len(ls))
          for i in hits[:32]:
            for j in range(max(0,i-2),min(len(ls),i+4)):
              print(f'INDEX {j+1:04d} {ls[j][:240]}')
          p=ui/"Dockerfile"
          for i,line in enumerate(p.read_text().splitlines(),1):
            if i<100: print(f'DOCKER {i:04d} {line[:245]}')
          PY