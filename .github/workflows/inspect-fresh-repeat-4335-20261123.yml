name: Inspect current OVH fresh reset GA source
on:
  push:
    branches: [diagnose/fresh-repeat-4335-20261123]
    paths: [.github/workflows/inspect-fresh-repeat-4335-20261123.yml]
permissions: {contents: read}
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Find old plan and repeat-run pathways without modifying OVH
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = 51.255.163.121
          test "$USER" = liftorbit-ci
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$KEY" > "$d/key"
          printf '%s\n' "$KH" > "$d/kh"
          chmod 600 "$d/key" "$d/kh"
          ssh -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" "$USER@$HOST" python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path.home()/"liftorbit-migration/sources"
          ui=root/"ovh-app/current"
          ga=root/"current/ga/ga_workers"
          files=[ui/"restart-optimizer-ui.js",ga/"full_runtime_adapter.py",ga/"continuation.py"]
          print("SERVER_APP_SOURCE_DIRS")
          for folder in [ui,root/"planner",ga]:
            print('DIR',folder)
            for p in sorted(folder.glob("*"))[:60]:print('CHILD',p.name)
          pats={
            "restart-optimizer-ui.js":r'optimizer-reset|ppOptimizerStartOver|__ppFreshRestartPending|freshRestart|__ppOptimizerCommittedPlan|cached|original|__ppFreshReferencePlan|__ppFreshDisplayBaseline',
            "full_runtime_adapter.py":r'continuing=|seed=|hint=|order_ids=|_pp_schedule_sequence|load_resume_plan|fresh_ga_seeded|ga\[.optimize.\]|best_checkpoint|result=copy|progress\(',
            "continuation.py":r'best_order|def load_resume_plan|state\.update',
          }
          for f in files:
            print("FILE",f.name,'exists',f.exists())
            if not f.exists():continue
            lines=f.read_text(errors="replace").splitlines()
            hits=[i for i,l in enumerate(lines) if re.search(pats.get(f.name,''),l,re.I)]
            print("LINES",len(lines),"MATCHES",len(hits))
            seen=set()
            for i in hits[:75]:
              for j in range(max(0,i-3),min(len(lines),i+5)):
                if j in seen: continue
                seen.add(j)
                print(f"{j+1:04d} {lines[j][:260]}")
          PY