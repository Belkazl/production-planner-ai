name: Inspect current OVH fresh reset GA source
on:
  push:
    branches: [diagnose/fresh-repeat-4335-20261123]
    paths: [.github/workflows/inspect-fresh-repeat-4335-20261123.yml]
permissions: {contents: read}
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Find old plan and repeat-run pathways without modifying OVH
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = 51.255.163.121
          test "$USER" = liftorbit-ci
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$KEY" > "$d/key"
          printf '%s\n' "$KH" > "$d/kh"
          chmod 600 "$d/key" "$d/kh"
          ssh -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" "$USER@$HOST" python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path.home()/"liftorbit-migration/sources"
          ui=root/"ovh-app/current"
          ga=root/"current/ga/ga_workers"
          files=[ui/"restart-optimizer-ui.js",ga/"full_runtime_adapter.py",ga/"continuation.py"]
          print("SERVER_APP_SOURCE_DIRS")
          for folder in [ui,root/"planner",ga]:
            print('DIR',folder)
            for p in sorted(folder.glob("*"))[:60]:print('CHILD',p.name)
          ranges={
            "restart-optimizer-ui.js":[(62,196),(419,644),(1420,1600)],
            "restart-optimizer-server.js":[(1,190)],
            "restart-optimizer.ts":[(1,175)],
            "full_runtime_adapter.py":[(375,424),(470,532)],
          }
          for name,spans in ranges.items():
            p=(ui/name) if name.endswith(".js") or name.endswith(".ts") else (ga/name)
            if not p.exists(): continue
            lines=p.read_text(errors="replace").splitlines()
            print("FILE_SPANS",name,"TOTAL",len(lines))
            for a,b in spans:
              print("SPAN",a,b)
              for n in range(a,min(b,len(lines))+1):
                print(f"{n:04d} {lines[n-1][:260]}")
          p=ui/"python-ga-upstream.mjs"
          print("BACKEND_MATCHES")
          lines=p.read_text(errors="replace").splitlines()
          import re
          for i,s in enumerate(lines):
            if re.search(r'optimizer-reset|resume_plan|resume_state|continue_run|/api/plan|/api/optimizer-reset',s,re.I):
              print(f"{i+1:04d} {s[:220]}")
          PY