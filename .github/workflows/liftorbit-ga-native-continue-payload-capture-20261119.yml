name: LiftOrbit inspect sanitized actual Continue UI optimization request
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-native-continue-payload-capture-20261119.yml
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Capture native second POST payload on isolated model without forwarding it to production
        shell: bash
        env:
          FREEZE_TEST_MODE: skip-gantt
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.57.0
          node ops/ovh/ga-post502-isolation-20261119/generate-native-payload-inspect.mjs
          node --check ops/ovh/ga-post502-isolation-20261119/_native-payload-inspect.mjs
          node ops/ovh/ga-post502-isolation-20261119/_native-payload-inspect.mjs
