name: Security test authenticated ProdPlan bridge
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - name: Validate authentication server code syntax
        run: |
          bun build ./auth-runtime.js --target=bun --outdir=/tmp/pp-auth-check
          bun build ./auth-bridge.ts --target=bun --outdir=/tmp/pp-auth-builder-check
      - name: Compile approved plan and secure bridge
        run: |
          bun run build-bridge.ts
          bun run feature-stop.ts
          bun run gantt-details.ts
          bun run order-accordion.ts
          bun run auth-bridge.ts
          bun run ceramics-resource-repair.ts
          bun build ./index.ts --target=bun --outdir=/tmp/pp-auth-release-check
      - name: Install Chromium browser
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Mock original tenant gateway and run protected bridge
        run: |
          python3 - <<'PY'
          import urllib.request
          u="https://production-planner-gateway-production.up.railway.app/"
          req=urllib.request.Request(u,headers={"User-Agent":"ProdPlan-CI-ReadOnly-HTML-Fixture/1.0"})
          with urllib.request.urlopen(req,timeout=40) as r:
              html=r.read()
          assert b'id="ganttScroll"' in html,len(html)
          open("/tmp/pp-gateway-fixture.html","wb").write(html)
          print("MOCK_UPSTREAM_FIXTURE_READY",len(html))
          model_request=urllib.request.Request("https://production-planner-gateway-production.up.railway.app/api/model",headers={"User-Agent":"ProdPlan-ReadOnly-Test-Model/1.0"})
          with urllib.request.urlopen(model_request,timeout=40) as model_response:
              fixture=model_response.read()
          open("/tmp/pp-ceramics-live-model.json","wb").write(fixture)
          print("MODEL_FIXTURE_READY",len(fixture))
          PY
          node tests/ga-resource-repair.cjs
          bun tests/auth-gateway-mock.ts >/tmp/mock-gateway.log 2>&1 &
          mockpid=$!
          bun tests/planner-html-mock.ts >/tmp/mock-planner.log 2>&1 &
          plannerpid=$!
          PP_PLANNER_HTML_ORIGIN=http://127.0.0.1:18081 PP_AUTH_GATEWAY_ORIGIN=http://127.0.0.1:18080 PORT=8080 bun index.ts >/tmp/secured-bridge.log 2>&1 &
          bridgepid=$!
          trap 'kill "$bridgepid" "$plannerpid" "$mockpid" 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/__bridge_health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          python3 tests/auth-gateway-smoke.py
          node tests/login-session-browser.cjs
          node tests/ga-resource-integration.cjs
          grep PP_SECURE_GATE_BUILD_OK /tmp/secured-bridge.log || true
          RAILWAY_PUBLIC_DOMAIN=pp-progress-fix-qa-20261010-production.up.railway.app PP_PLANNER_HTML_ORIGIN=http://127.0.0.1:18081 PP_AUTH_GATEWAY_ORIGIN=http://127.0.0.1:18080 PORT=8081 bun index.ts >/tmp/proxy-origin-bridge.log 2>&1 &
          proxypid=$!
          trap 'kill "$proxypid" "$bridgepid" "$plannerpid" "$mockpid" 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do
            if curl -fsS --max-time 2 http://127.0.0.1:8081/__bridge_health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          python3 tests/auth-proxy-origin.py
          PP_AUTH_PUBLIC_ORIGIN=production-planner-gateway-v2-production.up.railway.app PP_PLANNER_HTML_ORIGIN=http://127.0.0.1:18081 PP_AUTH_GATEWAY_ORIGIN=http://127.0.0.1:18080 PORT=8082 bun index.ts >/tmp/canonical-origin-bridge.log 2>&1 &
          prodpid=$!
          trap 'kill "$prodpid" "$proxypid" "$bridgepid" "$plannerpid" "$mockpid" 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do
            if curl -fsS --max-time 2 http://127.0.0.1:8082/__bridge_health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          PP_ORIGIN_TEST_BASE=http://127.0.0.1:8082 PP_ORIGIN_TEST_ALLOWED=https://production-planner-gateway-v2-production.up.railway.app python3 tests/auth-proxy-origin.py
