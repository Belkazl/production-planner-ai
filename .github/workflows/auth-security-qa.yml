name: Security test authenticated ProdPlan bridge
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - name: Validate authentication server code syntax
        run: |
          bun build ./auth-runtime.js --target=bun --outdir=/tmp/pp-auth-check
          bun build ./auth-bridge.ts --target=bun --outdir=/tmp/pp-auth-builder-check
      - name: Compile approved plan and secure bridge
        run: |
          bun run build-bridge.ts
          bun run feature-stop.ts
          bun run gantt-details.ts
          bun run order-accordion.ts
          bun run auth-bridge.ts
          bun build ./index.ts --target=bun --outdir=/tmp/pp-auth-release-check
      - name: Mock original tenant gateway and run protected bridge
        run: |
          python3 - <<'PY'
          import urllib.request
          u="https://production-planner-gateway-production.up.railway.app/"
          req=urllib.request.Request(u,headers={"User-Agent":"ProdPlan-CI-ReadOnly-HTML-Fixture/1.0"})
          with urllib.request.urlopen(req,timeout=40) as r:
              html=r.read()
          assert b'id="ganttScroll"' in html,len(html)
          open("/tmp/pp-gateway-fixture.html","wb").write(html)
          print("MOCK_UPSTREAM_FIXTURE_READY",len(html))
          PY
          bun tests/auth-gateway-mock.ts >/tmp/mock-gateway.log 2>&1 &
          mockpid=$!
          PP_AUTH_GATEWAY_ORIGIN=http://127.0.0.1:18080 PORT=8080 bun index.ts >/tmp/secured-bridge.log 2>&1 &
          bridgepid=$!
          trap 'kill "$bridgepid" "$mockpid" 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/__bridge_health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          python3 tests/auth-gateway-smoke.py
          grep PP_SECURE_GATE_BUILD_OK /tmp/secured-bridge.log || true
