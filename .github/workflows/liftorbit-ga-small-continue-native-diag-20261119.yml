name: LiftOrbit isolated small-model native first and Continue POST diagnosis
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-small-continue-native-diag-20261119.yml
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Real two sequential authenticated server jobs without UI wrappers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.57.0
          node ops/ovh/ga-post502-isolation-20261119/generate-small-direct-continue.mjs
          node --check ops/ovh/ga-post502-isolation-20261119/_small-continue.mjs
          node ops/ovh/ga-post502-isolation-20261119/_small-continue.mjs
