name: LiftOrbit OVH gateway bootstrap - safe static launcher audit
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ovh-integration-control.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == 'Belkazl/production-planner-ai' && github.head_ref == 'ops/ovh-gateway-debug-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Examine only the gateway launcher's AST on OVH
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$OVH_HOST" == '51.255.163.121' && "$OVH_USER" == 'liftorbit-ci' ]] || exit 2
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$temp/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$temp/hosts"
          chmod 600 "$temp/key" "$temp/hosts"
          ssh -i "$temp/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$temp/hosts" \
            "$OVH_USER@$OVH_HOST" 'python3 -' <<'PY'
          import ast, json, pathlib, re
          data=json.loads((pathlib.Path.home()/'liftorbit-migration/production/current/gateway.json').read_text())
          source=data['PP_GENERIC_RESTORE_LAUNCH_V2']
          lines=source.splitlines()
          print('GATEWAY_LAUNCHER_LINE_COUNT',len(lines))
          tree=ast.parse(source)
          target=571
          funcs=[]
          for n in ast.walk(tree):
              if not isinstance(n,ast.Call) or not hasattr(n,'lineno'):
                  continue
              if n.lineno <= target <= getattr(n,'end_lineno',n.lineno):
                  f=ast.unparse(n.func)
                  if re.fullmatch(r'[a-zA-Z0-9_.]{1,70}',f):funcs.append(f)
          print('GATEWAY_LINE_571_CALLS',','.join(dict.fromkeys(funcs)) or 'NONE')
          tokens=set(re.findall(r'[A-Za-z_][A-Za-z0-9_]*',lines[target-1] if target<=len(lines) else ''))
          allowed={'subprocess','run','check_call','check_output','Popen','pip','install','python','python3','bash','sh','curl','wget','apt','git','exec','raise','RuntimeError','CalledProcessError','timeout','check','env','shell','source','compile','restore','import','get','set','default','flush','open','json'}
          print('GATEWAY_LINE_571_ALLOWED_TOKENS',','.join(sorted(tokens&allowed)) or 'NONE')
          found=[]
          for n in ast.walk(tree):
              if isinstance(n,ast.Call) and hasattr(n,'lineno') and abs(n.lineno-target)<=25:
                  f=ast.unparse(n.func)
                  if re.fullmatch(r'[a-zA-Z0-9_.]{1,70}',f):
                      found.append((n.lineno,f))
          print('GATEWAY_NEARBY_CALL_SIGNATURES',','.join(str(n)+':'+f for n,f in sorted(found)[:24]))
          print('GATEWAY_LAUNCHER_AST_AUDIT_COMPLETE')
          PY
