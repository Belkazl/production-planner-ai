name: LiftOrbit OVH integration control - isolated six-service check
# Runner validates 12-order GA load, complete large storage responses, and etalon behavior in a disposable six-service clone.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ovh-integration-control.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-six-service-integration
  cancel-in-progress: false

jobs:
  integrated-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/railway-migration-20261108
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 4a1457d6f33e7ef5b6e8ad59c3e21ef345b8c25f
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e0d0b7a5d4e625c4fe47acb2a26436ad3071c9e1
          path: auth
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 788a06c269330d70528d3ac75a89ec729c12fe0b
          path: ga
          persist-credentials: false
      - name: Retrieve encrypted-in-transit copies, never upload artifacts
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$OVH_HOST" == 51.255.163.121 && "$OVH_USER" == liftorbit-ci ]] || exit 2
          [[ -n "$OVH_SSH_PRIVATE_KEY" && -n "$OVH_SSH_KNOWN_HOSTS" ]] || exit 2
          work="$RUNNER_TEMP/liftorbit-integration"
          mkdir -p "$work/config" "$work/backups"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$work/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$work/hosts"
          chmod 600 "$work/key" "$work/hosts"
          opts=(-i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/hosts")
          host="$OVH_USER@$OVH_HOST"
          # Stream protected JSON directly through the SSH connection, never logs.
          ssh "${opts[@]}" "$host" 'tar -cf - -C "$HOME/liftorbit-migration/production/current" gateway.json auth-gateway.json auth-app.json ga-worker.json postgres.json postgres-me4i.json' | tar -xf - -C "$work/config"
          remote="/home/liftorbit-ci/liftorbit-migration/backups/backup-42475681877-1"
          for f in postgres.dump postgres-me4i.dump SHA256SUMS.txt; do
            scp -q "${opts[@]}" "$host:$remote/$f" "$work/backups/$f"
          done
          (cd "$work/backups" && sha256sum --check --quiet SHA256SUMS.txt)
          echo 'PRIVATE_PRODUCTION_SNAPSHOTS_DOWNLOADED_TO_EPHEMERAL_RUNNER'
      - name: Prepare patched source trees, private runtime configs and Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          node ops/ops/ovh/patch-runtime-origins.mjs app
          node ops/ops/ovh/repair-planner-ui.mjs app
          node ops/ops/ovh/repair-ga-state.mjs app
          node ops/ops/ovh/repair-ga-load.mjs app
          node ops/ops/ovh/repair-continuation.mjs app
          node --test ops/ops/ovh/ga-state-recovery.test.mjs ops/ops/ovh/ga-load.test.mjs ops/ops/ovh/ga-legacy-continue.test.mjs
          node ops/ops/ovh/repair-async-ga.mjs app
          python3 -m py_compile ops/ops/ovh/test-async-ga.py
          # Synthetic account session cookie is explicitly retained in local test
          sudo mkdir -p /opt/liftorbit/sources/{app,auth,ga} /opt/liftorbit/secrets
          sudo mkdir -p /opt/liftorbit/sources/planner
          sudo cp -a ops/ops/ovh/planner/. /opt/liftorbit/sources/planner/
          sudo cp -a app/. /opt/liftorbit/sources/app/
          sudo cp -a auth/ga_python_workers/qa_auth/. /opt/liftorbit/sources/auth/
          sudo cp -a ga/ga_python_workers/. /opt/liftorbit/sources/ga/
          sudo python3 ops/ops/ovh/render-secrets.py \
            --source "$RUNNER_TEMP/liftorbit-integration/config" \
            --output /opt/liftorbit/secrets
          sudo cp ops/ops/ovh/full.compose.yml /opt/liftorbit/full.compose.yml
          sudo docker compose -f /opt/liftorbit/full.compose.yml config --quiet
          echo 'INTEGRATION_RUNNER_RUNTIME_CONFIG_READY'
      - name: Restore both PostgreSQL databases in disposable Docker volumes
        shell: bash
        run: |
          set -euo pipefail
          cfg=/opt/liftorbit/full.compose.yml
          sudo docker compose -f "$cfg" up -d postgres-main postgres-auth
          for spec in postgres-main postgres-auth; do
            cid=$(sudo docker compose -f "$cfg" ps -q "$spec")
            healthy=no
            for i in {1..70}; do
              if [ "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$cid")" = healthy ]; then healthy=yes; break; fi
              sleep 2
            done
            [ "$healthy" = yes ] || { echo "PG18_HEALTH_FAILED $spec"; exit 3; }
          done
          for spec in "postgres-main:postgres:12" "postgres-auth:postgres-me4i:6"; do
            IFS=: read -r service source minimum <<< "$spec"
            cid=$(sudo docker compose -f "$cfg" ps -q "$service")
            path="$RUNNER_TEMP/liftorbit-integration/backups/$source.dump"
            db=$(sudo sed -n 's/^POSTGRES_DB=//p' "/opt/liftorbit/secrets/$service.env")
            docker cp "$path" "$cid:/tmp/restore.dump" > /dev/null
            docker exec -u 0 "$cid" chmod 0644 /tmp/restore.dump
            docker exec -u postgres "$cid" pg_restore --exit-on-error \
              --no-owner --no-privileges -U postgres -d "$db" /tmp/restore.dump > /dev/null
            docker exec "$cid" rm -f /tmp/restore.dump
            tables=$(docker exec -u postgres "$cid" psql -U postgres -d "$db" -At -c \
              "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
            test "$tables" -ge "$minimum"
            echo "INTEGRATION_DB_RESTORED $service tables=$tables"
          done
      - name: Start production-pinned planner, auth, GA and application
        shell: bash
        run: |
          set -euo pipefail
          cfg=/opt/liftorbit/full.compose.yml
          sudo env COMPOSE_BAKE=false docker compose -f "$cfg" up -d --build planner-gateway auth-gateway ga-worker app
          echo 'INTEGRATION_FULL_COMPOSE_UP_COMPLETED'
          for name in planner-gateway auth-gateway ga-worker app; do
            cid=$(sudo docker compose -f "$cfg" ps -q "$name")
            test -n "$cid"
            state=starting
            for attempt in {1..80}; do
              state=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
              if [[ "$state" == healthy ]]; then break; fi
              if [[ "$state" == unhealthy || "$state" == exited || "$state" == dead ]]; then break; fi
              sleep 2
            done
            echo "INTEGRATION_SERVICE_HEALTH $name=$state"
            test "$state" = healthy
          done
          curl --fail --silent --max-time 12 http://127.0.0.1:18082/__bridge_health > /dev/null
          status=$(curl -s -o /dev/null -w '%{http_code}' -m 12 http://127.0.0.1:18082/)
          test "$status" = 200 || test "$status" = 302 || test "$status" = 303
          echo "OVH_SIX_SERVICE_INTEGRATION_SMOKE_OK http_status=$status"
      - name: Diagnose authenticated planner HTML in disposable restored stack (no customer writes)
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import urllib.request,urllib.error,json,uuid,secrets
          base='http://127.0.0.1:18082'
          h={'Origin':'https://app.liftorbit.app','Sec-Fetch-Site':'same-origin','Accept':'text/html,application/json'}
          def call(path,method='GET',data=None,cookie=None):
              headers=dict(h)
              if cookie:headers['Cookie']=cookie
              if data is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request(base+path,method=method,headers=headers,data=json.dumps(data).encode() if data is not None else None)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:return r.status,r.headers,r.read(12000)
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read(12000)
          status,_,body=call('/')
          print('INTEGRATION_GUEST_HTML',status,'html='+str(body.lstrip().startswith(b'<!doctype')),flush=True)
          user='migration-disposable-'+uuid.uuid4().hex+'@liftorbit.invalid'
          status,headers,body=call('/api/auth/register','POST',{'email':user,'password':secrets.token_urlsafe(36),'company':'Disposable QA'})
          cookie=headers.get('set-cookie','').split(';')[0]
          print('INTEGRATION_REGISTER',status,'has_cookie='+str(bool(cookie)),flush=True)
          if status==200 and cookie:
              status,_,body=call('/api/auth/me',cookie=cookie)
              print('INTEGRATION_AUTH_ME',status,flush=True)
              status,_,body=call('/?utm_source=chatgpt.com',cookie=cookie)
              print('INTEGRATION_AUTH_ROOT',status,'html='+str(body.lstrip().startswith(b'<!doctype')),'bridge_error='+str(b'bridge_unavailable' in body),flush=True)
              if status!=200 or not body.lstrip().startswith(b'<!doctype') or b'bridge_unavailable' in body: raise SystemExit('AUTHENTICATED_PLANNER_HTML_STILL_BROKEN')
          PY
          cid=$(sudo docker compose -f /opt/liftorbit/full.compose.yml ps -q app)
          if [[ -n "$cid" ]]; then
            sudo docker logs --tail 350 "$cid" 2>&1 | python3 -c '
          import re,sys
          for line in sys.stdin:
              if "APS_BRIDGE_ERROR" in line:
                  chunk=line.split("APS_BRIDGE_ERROR",1)[1].strip()[:170]
                  if re.fullmatch(r"[A-Za-z0-9_.,:() \\-]+",chunk) and "@" not in chunk and "password" not in chunk.lower():
                      print("INTEGRATION_SAFE_BRIDGE_ERROR",chunk)
                  else:
                      print("INTEGRATION_BRIDGE_ERROR_NOT_SAFE_TO_PRINT")
          '
          fi
          exit 0
      - name: Probe etalon UI compatibility (safe metadata only)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,uuid,secrets,json
          base="http://127.0.0.1:18082"
          headers={"Origin":"https://app.liftorbit.app","Sec-Fetch-Site":"same-origin","Accept":"text/html,application/json"}
          def call(path,method="GET",body=None,cookie=None):
              h=dict(headers)
              if cookie:h["Cookie"]=cookie
              if body is not None:h["Content-Type"]="application/json"
              req=urllib.request.Request(base+path,method=method,headers=h,data=json.dumps(body).encode() if body is not None else None)
              try:
                  with urllib.request.urlopen(req,timeout=35) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
          email="ui-diagnostic-"+uuid.uuid4().hex+"@liftorbit.invalid"
          code,h,b=call("/api/auth/register","POST",{"email":email,"password":secrets.token_urlsafe(36),"company":"Disposable UI QA"})
          cookie=(h.get("set-cookie") or "").split(";")[0]
          print("ETALON_PROBE_REGISTER",code,"cookie="+str(bool(cookie)),flush=True)
          if code!=200 or not cookie:raise SystemExit("ETALON_PROBE_AUTH_FAILURE")
          cases=[
            ("normal","/"),
            ("no_guard","/?ppOptGuard=off"),
            ("no_guard_strict","/?ppOptGuard=off&ppStrict=off"),
            ("no_guard_strict_motion","/?ppOptGuard=off&ppStrict=off&ppMotion=off"),
            ("all_legacy_modifiers_off","/?ppOptGuard=off&ppStrict=off&ppMotion=off&ppEquipFix=off&ppPoll=off&ppKpi=off&ppGaPoll=off")
          ]
          for name,path in cases:
              code,h,b=call(path,cookie=cookie)
              body=b.decode("utf8","replace")
              indicators={
                "gantt_tool":'id="pp-gantt-tool-v2-script"' in body,
                "stop_ui":'id="ppStopOptimizationV1"' in body,
                "start_over":'id="pp-restart-optimizer-ui"' in body,
                "language":'id="ppLanguageUiJs"' in body,
                "async_transport":'id="ppAsyncPlanTransport"' in body,
                "native_gantt":'id="ganttScroll"' in body,
                "etalon_decision":"function ppIncumbentDecision(a,b){" in body,
                "strict_incumbent":"function ppIncumbentCurrentPlan(){let saved=null;" in body,
                "saved_plan_restore":'id="pp-ovh-etalon-state-restore"' in body,
                "live_panel":'id="ppLivePanelV2"' in body,
                "live_motion":'__PP_LIVE_MOTION_STATE__' in body,
                "native_live_120ms":'setInterval(()=>poll(my),120)' in body,
                "sequential_live_1400ms":'timer=setTimeout(next,1400)' in body
              }
              print("ETALON_PROBE",name,"status="+str(code),
                    "ui="+str(h.get("x-liftorbit-ui","none")),
                    "gantt="+str(h.get("x-pp-gantt-component","none")),
                    "markers="+json.dumps(indicators,sort_keys=True),flush=True)
          PY
      - name: Browser-check restored etalon UI and optimizer readiness without production writes
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.57.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node <<'NODE'
          const {chromium}=require('playwright');
          const {randomUUID,randomBytes}=require('node:crypto');
          (async()=>{
            const base='http://127.0.0.1:18082';
            const email='browser-qa-'+randomUUID()+'@liftorbit.invalid';
            const r=await fetch(base+'/api/auth/register',{method:'POST',headers:{'content-type':'application/json',origin:'https://app.liftorbit.app','sec-fetch-site':'same-origin'},body:JSON.stringify({email,password:randomBytes(32).toString('hex'),company:'Disposable UI QA'})});
            if(!r.ok)throw Error('DISPOSABLE_ACCOUNT_FAILED '+r.status);
            const cookie=(r.headers.get('set-cookie')||'').split(';')[0];
            if(!cookie)throw Error('NO_TEST_COOKIE');
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const ctx=await browser.newContext({viewport:{width:1570,height:1000},extraHTTPHeaders:{cookie}});
              const page=await ctx.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e).slice(0,110)));
              const response=await page.goto(base+'/',{waitUntil:'domcontentloaded',timeout:50000});
              await page.waitForTimeout(1200);
              const state=await page.evaluate(()=>{
                const b=document.getElementById('opt');
                return {
                  authenticated:!!document.getElementById('planView'),
                  ganttScript:!!window.__PP_GANTT_TOOL_V2_INSTALLED__,
                  ganttStage:!!document.getElementById('ppGanttToolV2'),
                  ganttBars:document.querySelectorAll('.pg2-bar').length,
                  restartInstalled:!!window.__ppFreshOptimizerUiInstalled,
                  stopInstalled:!!document.getElementById('ppStopOptimizer'),
                  languageInstalled:!!window.__PP_LANGUAGE__,
                  buttonExists:!!b,
                  buttonDisabled:b?.disabled??null,
                  buttonLabel:b?.textContent?.trim().slice(0,45),
                  modelReady:typeof modelReady==='undefined'?null:!!modelReady,
                  hasResult:typeof hasResult==='undefined'?null:!!hasResult,
                  modelOrders:typeof model==='undefined'?null:((model?.orders||[]).length),
                  modelReadyCheck:(()=>{try{return typeof model_ready==='function'?model_ready(model):null}catch(e){return 'error'}})(),
                  visiblePlan:!!(window.__ppTabPlan||window.__ppOptimizerCommittedPlan),
                  modelRevision:typeof model==='undefined'?null:model?.revision??null,
                  optimizeOnclick:typeof b?.onclick==='function',
                  validBadge:document.getElementById('valid')?.textContent?.trim().slice(0,48),
                  metaStatus:document.getElementById('meta')?.textContent?.trim().slice(0,55)
                };
              });
              console.log('ETALON_BROWSER_UI_STATE',JSON.stringify({http:response.status(),...state,pageErrors:errors.length}));
              if(!state.authenticated||!state.ganttScript||!state.ganttStage||!state.restartInstalled||!state.buttonExists||!state.stopInstalled)throw Error('ETALON_BROWSER_UI_MODULES_MISSING');
              if(errors.length)console.log('ETALON_BROWSER_PAGEERROR_CLASSES',JSON.stringify(errors.map(x=>x.split(':')[0]).slice(0,5)));
            }finally{await browser.close()}
          })().catch(e=>{console.error('ETALON_BROWSER_FAILED',e.message);process.exit(1)})
          NODE
      - name: Diagnose browser optimization API routing with a disposable tenant
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const {randomUUID,randomBytes}=require('node:crypto');
          (async()=>{
            const base='http://127.0.0.1:18082';
            const browserBase='http://localhost:18082';
            const headers={'content-type':'application/json',origin:'https://app.liftorbit.app','sec-fetch-site':'same-origin'};
            const email='route-qa-'+randomUUID()+'@liftorbit.invalid';
            const rr=await fetch(base+'/api/auth/register',{method:'POST',headers,body:JSON.stringify({email,password:randomBytes(32).toString('hex'),company:'Route QA'})});
            const cookie=(rr.headers.get('set-cookie')||'').split(';')[0];
            if(rr.status!==200||!cookie)throw Error('QA_REGISTER_FAILED '+rr.status);
            const eq='EQ1',person='EMP1',tp='TP1';
            const requirement=(type,id)=>({resource_type:type,match_mode:'specific',resource_ref:id,resource_refs:[id],quantity:1});
            const model={
              scheduler_mode:'resource',start:'2026-11-10T08:00:00',equipment:[{id:eq,name:'Test station',kind:'workstation',capacity:10,capacity_unit:'pcs'}],
              employees:[{id:person,name:'Operator',shift:'day'}],shifts:{day:[['08:00','12:00'],['13:00','17:00']]},
              orders:[{id:'ORDER_A',quantity:5,unit:'pcs',technical_process_id:tp,parameters:{color:'A'}},{id:'ORDER_B',quantity:5,unit:'pcs',technical_process_id:tp,parameters:{color:'B'}}],
              technical_processes:[{id:tp,name:'Assembly',operations:[{id:'OP1',name:'Press',sequence:1,duration_min:30,resource_requirements:[requirement('equipment',eq),requirement('employee',person)]}]}],
              setup_rules:[],materials:[]
            };
            const project='route-qa-'+randomUUID();
            const storage={'prodplan.projects.v2':JSON.stringify([{id:project,name:'QA TEST',model,revision:1}]),'prodplan.project.active.v2':project};
            const saved=await fetch(base+'/api/db-storage',{method:'POST',headers:{...headers,cookie},body:JSON.stringify({storage})});
            console.log('BROWSER_ROUTE_STORAGE',saved.status);
            if(!saved.ok)throw Error('QA_STORAGE_FAILED');
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const context=await browser.newContext({viewport:{width:1500,height:930},extraHTTPHeaders:{cookie,origin:'https://app.liftorbit.app','sec-fetch-site':'same-origin'}});
              const page=await context.newPage(),routes=[],planMethods=[],pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e.message||e).split(':')[0].slice(0,45)));
              page.on('request',req=>{const u=new URL(req.url());if(u.pathname==='/api/plan')planMethods.push(req.method());});
              page.on('response',async r=>{
                const u=new URL(r.url());if(!u.pathname.startsWith('/api/'))return;
                const status=r.status();let err='';
                if(status>=400){try{const data=await r.json();err=String(data.error||'').slice(0,75)}catch{}}
                routes.push({method:r.request().method(),path:u.pathname,status,...(err?{error:err}:{})});
              });
              await page.goto(browserBase+'/',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(1300);
              const before=await page.evaluate(()=>({
                modelOrders:typeof model==='undefined'?null:model?.orders?.length,
                modelReady:typeof modelReady==='undefined'?null:modelReady,
                planButtonDisabled:document.getElementById('opt')?.disabled,
                planButtonText:document.getElementById('opt')?.textContent?.trim().slice(0,70),
                rootText:document.getElementById('validator')?.textContent?.trim().slice(0,90),
                apiInOnclick:[...new Set((document.getElementById('opt')?.onclick?.toString()||'').match(/\/api\/[a-z0-9_/-]+/g)||[])].slice(0,15)
              }));
              console.log('BROWSER_ROUTE_BEFORE',JSON.stringify(before));
              const cad=await page.evaluate(()=>Array.from(document.scripts).some(s=>String(s.textContent||'').includes('timer=setInterval(poll,2000)')));
              console.log('BROWSER_GA_POLL_2_SECONDS',cad);
              if(!cad)throw Error('GA_POLL_INTERVAL_NOT_TWO_SECONDS');

              const planSource=await page.evaluate(()=>{
                const found=[];
                for(const tag of document.scripts){
                  const code=String(tag.textContent||"");
                  const needle="/api/plan";let index=-1,count=0;
                  while((index=code.indexOf(needle,index+1))>=0 && count++<8){
                    const section=code.slice(Math.max(0,index-210),Math.min(code.length,index+250));
                    found.push({script:tag.id||"inline",section:section.replace(/\s+/g," ").slice(0,460)});
                  }
                }
                return found.slice(0,16);
              });
              console.log('BROWSER_PLAN_CALL_SOURCE',JSON.stringify(planSource));

              await page.evaluate(()=>{
                // Synthetic QA model is known to the account API; bypass the
                // legacy demo-ready flag solely in this disposable browser.
                // The server retains all tenant/model validation gates.
                try{modelReady=true;busy=false}catch{}
                const b=document.getElementById('opt');if(b)b.disabled=false;
              });
              const fresh=page.locator('#ppOptimizerStartOver');
              if(await fresh.isVisible()){
                await fresh.click({timeout:6000});
                await page.waitForTimeout(9000);
              }else{
                await page.locator('#opt').click({timeout:6000});
                await page.waitForTimeout(9000);
              }
              const after=await page.evaluate(()=>({
                validator:document.getElementById('validator')?.textContent?.trim().slice(0,110),
                badge:document.getElementById('valid')?.textContent?.trim().slice(0,80),
                button:document.getElementById('opt')?.textContent?.trim().slice(0,75),
                disabled:document.getElementById('opt')?.disabled,
                freshMode:!!window.__ppFreshRestartMode
              }));
              console.log('BROWSER_ROUTE_AFTER',JSON.stringify(after));
              if(after.validator==='ga_fresh_starting'||after.badge==='GA error')
                throw Error('GA_TRANSITION_MISCLASSIFIED_AS_FAILURE');
              console.log('BROWSER_ROUTE_NETWORK',JSON.stringify(routes.filter(x=>x.method!=='GET'||x.status>=400).slice(-30)));
              console.log('BROWSER_PLAN_HTTP_METHODS',JSON.stringify(planMethods));
              if(!planMethods.includes('POST')||planMethods.includes('GET')||
                 routes.some(x=>x.path==='/api/plan'&&x.status>=400))
                throw Error('NATIVE_GA_GET_ROUTE_REGRESSION');

              console.log('BROWSER_ROUTE_PAGE_ERRORS',JSON.stringify(pageErrors.slice(0,8)));
            }finally{await browser.close()}
          })().catch(e=>{console.error('BROWSER_ROUTE_DIAGNOSTIC_FAILED',String(e.message||e).slice(0,120));process.exit(1)})
          NODE
      - name: Browser-verify continuation of pre-migration saved plan
        shell: bash
        run: |
          node ops/ops/ovh/test-legacy-continue-browser.cjs
      - name: Verify synthetic-account async GA model, job progress and completion
        shell: bash
        run: python3 ops/ops/ovh/test-async-ga.py
      - name: Verify heavy 12-order 14-machine GA progress and cancellation on disposable account
        shell: bash
        run: |
          python3 ops/ops/ovh/test-high-volume-ga.py
      - name: Test pre-migration saved-plan continuation and account state on disposable GA
        shell: bash
        run: |
          python3 ops/ops/ovh/test-legacy-continuation.py
      - name: Sanitize failure diagnostics (no raw user-data logs)
        if: failure()
        shell: bash
        run: |
          set +e
          cfg=/opt/liftorbit/full.compose.yml
          for name in postgres-main postgres-auth planner-gateway auth-gateway ga-worker app; do
            cid=$(sudo docker compose -f "$cfg" ps -q "$name" 2>/dev/null)
            if test -n "$cid"; then
              docker inspect --format 'SERVICE_HEALTH_CHECK {{.Name}} {{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}} OOM={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' "$cid"
            else
              echo "SERVICE_HEALTH_CHECK $name MISSING"
            fi
          done
      - name: Classify container startup errors without exposing logs
        if: failure()
        shell: bash
        run: |
          set +e
          root=/opt/liftorbit/full.compose.yml
          for service in planner-gateway auth-gateway ga-worker app; do
            cid=$(sudo docker compose -f "$root" ps -q "$service" 2>/dev/null)
            if test -z "$cid"; then continue; fi
            log="$RUNNER_TEMP/staging-private-$service.log"
            docker logs --tail 150 "$cid" > "$log" 2>&1
            python3 - "$service" "$log" <<'PY'
          import re,sys,pathlib,collections
          name=sys.argv[1]
          s=pathlib.Path(sys.argv[2]).read_text(errors='replace')
          matches=re.findall(r'(?m)^([A-Za-z_][A-Za-z_0-9]*(?:Error|Exception))(?::|$)',s)
          print('SAFE_RUNTIME_ERROR_CLASS',name,','.join(dict.fromkeys(matches)) or 'UNKNOWN')
          for line in s.splitlines():
              if re.fullmatch(r'OVH_GATEWAY_BOOT_(?:EXCEPTION|MISSING_KEY|MISSING_MODULE|SYSTEM_EXIT_CODE|SUBPROCESS_FAILED)(?: [A-Za-z0-9_.=-]{1,72}){1,3}',line):
                  print('SAFE_PLANNER_CLASSIFICATION',line)
          m=re.search(r"No module named '([a-zA-Z_][a-zA-Z0-9_.]{0,45})'",s)
          if m: print('SAFE_MISSING_IMPORT',name,m.group(1))
          for label,pattern in [
              ('POSTGRES_AUTH','password authentication failed'),
              ('DATABASE_DNS','could not translate host name'),
              ('DATABASE_CONNECT','connection refused'),
              ('MISSING_ENV','KeyError:'),
              ('SOURCE_HASH','sha256 mismatch'),
              ('SOURCE_BOOTSTRAP','PP_GENERIC'),
              ('INVALID_JSON','JSONDecodeError'),
              ('SYNTAX','SyntaxError'),
              ('MEMORY','MemoryError'),
              ('LIBRARY','ModuleNotFoundError'),
          ]:
              if pattern.lower() in s.lower(): print('SAFE_STARTUP_DIAG',name,label)
          PY
            rm -f "$log"
          done
      - name: Remove ephemeral databases and secrets
        if: always()
        run: |
          sudo docker compose -f /opt/liftorbit/full.compose.yml down --volumes --remove-orphans > /dev/null 2>&1 || true
          sudo rm -rf /opt/liftorbit "$RUNNER_TEMP/liftorbit-integration"
