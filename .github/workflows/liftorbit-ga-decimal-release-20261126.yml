name: Verify and release exact decimal GA progress
on:
  push:
    branches: [fix/ga-decimal-progress-20261126]
    paths:
      - ops/ovh/ga-decimal-progress-20261126/approved-release.json
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/liftorbit-decimal-test --no-save --no-package-lock playwright-core@1.58.2
      - name: Check release script syntax
        run: |
          bash -n ops/ovh/ga-decimal-progress-20261126/release.sh
          python3 -m py_compile ops/ovh/ga-decimal-progress-20261126/patch.py
          node --check ops/ovh/ga-decimal-progress-20261126/browser-unit.mjs
          node --check ops/ovh/ga-decimal-progress-20261126/browser-live.mjs
      - name: Test captured code, deploy and verify true fractional progress
        env:
          DEPLOY_HOST: ${{ vars.OVH_HOST }}
          DEPLOY_USER: ${{ vars.OVH_USER }}
          DEPLOY_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: bash ops/ovh/ga-decimal-progress-20261126/release.sh
