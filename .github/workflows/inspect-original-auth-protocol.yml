name: Inspect original auth session protocol
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read public legacy auth client implementation only
        run: |
          python3 - <<'PY'
          import urllib.request,re,json
          host="https://prodplan-auth-backend-production.up.railway.app"
          req=urllib.request.Request(host+"/",headers={"User-Agent":"ProdPlanAuthProtocolInspection/1.0"})
          with urllib.request.urlopen(req,timeout=45) as resp:
            html=resp.read(1200000).decode("utf8","replace")
          print("SOURCE_HTML_LENGTH",len(html),flush=True)
          print("SCRIPT_TAGS",[(m.start(),m.group(1)[:170]) for m in re.finditer(r'<script([^>]*)>',html,re.I)][:25],flush=True)
          for token in ["api/auth/login","api/auth/me","/api/auth/login","/api/auth/me","credentials:","localStorage","sessionStorage","authorization","Bearer","document.cookie","set-cookie","async function","loginForm","loginTab","loginBtn","Войти"]:
            hits=list(re.finditer(re.escape(token),html,re.I))
            print("TOKEN",token,"COUNT",len(hits),flush=True)
            for hit in hits[:6]:
              a=max(0,hit.start()-650);b=min(len(html),hit.start()+2100)
              ctx=html[a:b]
              # Never show secrets from HTML inputs.
              ctx=re.sub(r'(?i)(<input[^>]*)(value\s*=\s*)(["\']).*?\3',r'\1\2\3[REDACTED]\3',ctx)
              print("CLIENT_CONTEXT",token,hit.start(),json.dumps(ctx,ensure_ascii=False),flush=True)
          PY
