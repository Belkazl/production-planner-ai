name: OVH migration - safely stage Railway config on VPS

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ovh-railway-config-stage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovh-railway-config-staging
  cancel-in-progress: false

jobs:
  stage-config:
    # Never run with production secrets from unreviewed pull requests.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'Belkazl/production-planner-ai' && github.head_ref == 'ops/railway-migration-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install Railway CLI with version fallback during GitHub release outage
        shell: bash
        run: |
          set -euo pipefail
          for version in 5.70.0 5.69.0 5.68.0; do
            echo "Trying Railway CLI $version"
            if timeout 100s npm install --global "@railway/cli@$version"; then
              railway --version
              exit 0
            fi
          done
          echo 'RAILWAY_CLI_INSTALL_UNAVAILABLE' >&2
          exit 1
      - name: Export current service configuration to private runner directory
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${RAILWAY_TOKEN:-}" || { echo 'RAILWAY_TOKEN missing'; exit 2; }
          export OUTPUT="$RUNNER_TEMP/railway-config-private"
          mkdir -p "$OUTPUT"
          # Never print variables, CLI error output, or the token.
          services=(
            'gateway:871cdaaf-0f30-4137-8d03-8ad7c97c039f'
            'auth-app:2bf88ff3-774c-474f-a102-981452c23abd'
            'auth-gateway:5ac4cb17-744f-46d5-a70e-99c8f3a4df2a'
            'python-ga-app:ea7c565e-a530-43c1-aafe-da5d4009bd1d'
            'ga-worker:96d35be3-7c33-4fb7-85dd-8793c8b67b0f'
            'postgres:49ab352b-7b4c-4422-910d-3b1fefaa1e37'
            'postgres-me4i:aaf9a34e-78c2-476a-b53c-3629e78a98c8'
            'gateway-v2:df70f615-c94a-490e-a731-308eeafafe3e'
          )
          for spec in "${services[@]}"; do
            name=${spec%%:*}
            service_id=${spec#*:}
            if ! railway variable list \
              --project 16a27a18-a727-4a65-b75d-4368159b0e3e \
              --environment production --service "$service_id" --json \
              > "$OUTPUT/$name.json" 2> "$OUTPUT/$name.cli-error"; then
              echo "RAILWAY_CONFIG_READ_FAILED: $name (details suppressed)" >&2
              exit 3
            fi
            rm -f "$OUTPUT/$name.cli-error"
          done
          node <<'NODE'
          const fs = require('fs');
          const base = process.env.OUTPUT;
          const specs = {gateway:['DATABASE_URL','PP_RUNTIME_SRC_01'],
            'auth-app':['PP_AUTH_GATEWAY_ORIGIN'],
            'auth-gateway':['DATABASE_URL','PP_QA_STATE_TOKEN'],
            'python-ga-app':['PP_AUTH_GATEWAY_ORIGIN'],
            'ga-worker':['PP_PY_GA_ADAPTER','PP_RUNTIME_SRC_01'],
            postgres:['DATABASE_URL'],
            'postgres-me4i':['DATABASE_URL'],
            'gateway-v2':['DATABASE_URL']};
          for (const [name,keys] of Object.entries(specs)){
            const o=JSON.parse(fs.readFileSync(`${base}/${name}.json`, 'utf8'));
            if(!o||typeof o!=='object'||Array.isArray(o))throw Error(name+':bad_json_shape');
            for(const k of keys) if(!Object.hasOwn(o,k)||typeof o[k]!=='string'||!o[k])throw Error(name+':missing_'+k);
            process.stdout.write('RAILWAY_CONFIG_EXPORT_VALID: '+name+' count='+Object.keys(o).length+'\n');
          }
          NODE
          (cd "$OUTPUT" && sha256sum ./*.json > manifest.sha256)
          tar -czf "$RUNNER_TEMP/railway-config-private.tgz" -C "$OUTPUT" \
            gateway.json auth-app.json auth-gateway.json python-ga-app.json ga-worker.json postgres.json postgres-me4i.json gateway-v2.json manifest.sha256
          test -s "$RUNNER_TEMP/railway-config-private.tgz"

      - name: Secure transfer to OVH, stored under CI user only
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$OVH_HOST" == '51.255.163.121' && "$OVH_USER" == 'liftorbit-ci' ]] || exit 2
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          for v in OVH_SSH_PRIVATE_KEY OVH_SSH_KNOWN_HOSTS; do
            test -n "${!v:-}" || { echo "Missing $v"; exit 2; }
          done
          mkdir -p "$HOME/.ssh"
          key="$HOME/.ssh/railway_migration_ovh"
          hosts="$HOME/.ssh/railway_migration_known_hosts"
          trap 'rm -f "$key" "$hosts"; rm -rf "$RUNNER_TEMP/railway-config-private" "$RUNNER_TEMP/railway-config-private.tgz"' EXIT
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$hosts"
          chmod 600 "$key" "$hosts"
          opts=(-i "$key" -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$hosts")
          target="$OVH_USER@$OVH_HOST"
          ssh "${opts[@]}" "$target" 'umask 077; mkdir -p "$HOME/liftorbit-migration/production/incoming" "$HOME/liftorbit-migration/production/releases"; chmod 700 "$HOME/liftorbit-migration" "$HOME/liftorbit-migration/production" "$HOME/liftorbit-migration/production/incoming" "$HOME/liftorbit-migration/production/releases"'
          scp -q "${opts[@]}" "$RUNNER_TEMP/railway-config-private.tgz" \
            "$target:/home/liftorbit-ci/liftorbit-migration/production/incoming/$GITHUB_SHA.tgz"
          ssh "${opts[@]}" "$target" "RELEASE_SHA=$GITHUB_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          umask 077
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          home="$HOME/liftorbit-migration/production"
          release="$home/releases/$RELEASE_SHA"
          mkdir -p "$release"
          tar -xzf "$home/incoming/$RELEASE_SHA.tgz" -C "$release"
          chmod 600 "$release"/*.json "$release/manifest.sha256"
          (cd "$release" && sha256sum --check --quiet manifest.sha256)
          python3 - "$release" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          files=['gateway','auth-app','auth-gateway','python-ga-app','ga-worker','postgres','postgres-me4i','gateway-v2']
          for n in files:
              d=json.loads((p/(n+'.json')).read_text())
              if not isinstance(d,dict) or not d: raise SystemExit('invalid_json_'+n)
          print('OVH_RAILWAY_CONFIG_STAGED_VALID service_count=8')
          PY
          ln -sfn "$release" "$home/current.next"
          mv -Tf "$home/current.next" "$home/current"
          rm -f "$home/incoming/$RELEASE_SHA.tgz"
          echo 'OVH_RAILWAY_CONFIG_PRIVATE_TRANSFER_OK'
          REMOTE

      - name: Clean ephemeral runner copies
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/railway-config-private" "$RUNNER_TEMP/railway-config-private.tgz" || true
