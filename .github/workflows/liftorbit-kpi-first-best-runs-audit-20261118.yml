name: LiftOrbit inspect first-best KPI rollout workflow status
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-kpi-first-best-runs-audit-20261118.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Get exact KPI first-best release run status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          target=ops/ovh/test-results/kpi-first-best-release-runs-latest.txt
          mkdir -p "$(dirname "$target")"
          gh api 'repos/Belkazl/production-planner-ai/actions/workflows/liftorbit-ovh-kpi-first-best-release-20261118.yml/runs?per_page=8' --jq '.workflow_runs[] | "run_id=\(.id) status=\(.status) conclusion=\(.conclusion) event=\(.event) sha=\(.head_sha[0:10])"' > "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record first-best KPI release workflow status'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
          fi
