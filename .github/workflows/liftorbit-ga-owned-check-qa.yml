name: LiftOrbit GA owned-plan recovery and tenant isolation regression
on:
  push:
    branches: [fix/account-owner-upstream-20261113]
    paths:
      - python-ga-upstream.mjs
      - tests/ga-account-owned-recovery.test.mjs
      - .github/workflows/liftorbit-ga-owned-check-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-owner-upstream-20261113
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and all previous tenant isolation contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check python-ga-upstream.mjs
          node --test tests/python-ga-upstream.test.mjs tests/ga-account-owned-recovery.test.mjs
