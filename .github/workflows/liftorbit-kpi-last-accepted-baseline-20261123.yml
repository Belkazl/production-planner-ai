name: LiftOrbit compare Continue against the last accepted plan, not historical KPI
on:
  push:
    branches: [main, fix/kpi-use-last-accepted-plan-20261123]
    paths:
      - .github/workflows/liftorbit-kpi-last-accepted-baseline-20261123.yml
      - ops/ovh/kpi-last-accepted-20261123/**
permissions: {contents: read}
concurrency:
  group: liftorbit-kpi-last-accepted-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: One function source patch with safe OVH rollout
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HOST" = 51.255.163.121
          test "$USER" = liftorbit-ci
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$KEY" > "$d/key"
          printf '%s\n' "$KH" > "$d/kh"
          chmod 600 "$d/key" "$d/kh"
          ssh_call(){ ssh -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" -o ConnectTimeout=20 "$@"; }
          scp_call(){ scp -q -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" -o ConnectTimeout=20 "$@"; }
          root=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app
          scp_call "$USER@$HOST:$root/current/restart-optimizer-ui.js" "$d/old.js"
          node ops/ovh/kpi-last-accepted-20261123/patch.mjs "$d/old.js" "$d/new.js"
          node --check "$d/new.js"
          node - "$d/old.js" "$d/new.js" <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const before=fs.readFileSync(process.argv[2],'utf8'),after=fs.readFileSync(process.argv[3],'utf8');
          const a=before.indexOf('function readyContinue(){'),b=before.indexOf('// STOP\'s plan chooser',a);
          const c=after.indexOf('function readyContinue(){'),d=after.indexOf('// STOP\'s plan chooser',c);
          assert(a>=0&&b>a&&c>=0&&d>c);
          assert.equal(after.slice(0,c)+before.slice(a,b)+after.slice(d),before,'only readyContinue may change');
          assert(after.slice(c,d).includes('"latest_accepted"'));
          assert(after.slice(c,d).includes('record.compare===false'));
          for(const mark of ['quick:Object.freeze({generations:3,population:6})','function ppFixedFirstBestKpiDelta(){',
            'window.__PP_CONTINUATION_SEED_V2__','function ppOneSseProgressAndGantt(){',
            'window.__PP_KPI_SELECTED_REFERENCE_V2__=']){
            assert(before.includes(mark));assert(after.includes(mark));
          }
          console.log('KPI_LAST_ACCEPTED_PRECISE_ONE_FUNCTION_PATCH_PASS');
          JS
          if [ "$GITHUB_REF" != refs/heads/main ];then
            echo KPI_LAST_ACCEPTED_PREFLIGHT_PASS
            exit 0
          fi
          old_sha=$(sha256sum "$d/old.js"|cut -d' ' -f1)
          new_sha=$(sha256sum "$d/new.js"|cut -d' ' -f1)
          stage="$root/restart-optimizer-ui.kpi-last-accepted.next"
          scp_call "$d/new.js" "$USER@$HOST:$stage"
          ssh_call "$USER@$HOST" bash -s -- "$old_sha" "$new_sha" <<'REMOTE'
          set -euo pipefail
          root="$HOME/liftorbit-migration/sources/ovh-app"
          target="$root/current/restart-optimizer-ui.js"
          stage="$root/restart-optimizer-ui.kpi-last-accepted.next"
          backup="$HOME/liftorbit-migration/patch-backups/kpi-last-accepted-20261123"
          sha(){ sha256sum "$1"|cut -d' ' -f1; }
          test "$(sha "$target")" = "$1" || { echo KPI_LAST_ACCEPTED_SOURCE_DRIFT;exit 5; }
          test "$(sha "$stage")" = "$2" || { echo KPI_LAST_ACCEPTED_UPLOAD_CORRUPT;exit 5; }
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          mkdir -p "$backup"
          cp -p "$target" "$backup/restart-optimizer-ui.js"
          rollback(){
            trap - ERR
            cp -p "$backup/restart-optimizer-ui.js" "$target" || true
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo KPI_LAST_ACCEPTED_ROLLBACK_ATTEMPTED
          }
          trap rollback ERR
          mv "$stage" "$target"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          healthy=no
          for i in $(seq 1 40);do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1;then healthy=yes;break;fi
            sleep 5
          done
          test "$healthy" = yes
          test "$(sha "$target")" = "$2"
          trap - ERR
          echo KPI_LAST_ACCEPTED_DEPLOYED_SMOKE_PASS
          REMOTE
          scp_call "$USER@$HOST:$root/current/restart-optimizer-ui.js" "$d/deployed.js"
          test "$(sha256sum "$d/deployed.js"|cut -d' ' -f1)" = "$new_sha"
          echo KPI_LAST_ACCEPTED_DEPLOYED_CHECKSUM_PASS
      - name: Public healthy app and auth isolation
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          good=no
          for i in $(seq 1 12);do
            health=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/__bridge_health || true)
            guest=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/api/auth/me || true)
            if [ "$health" = 200 ] && [ "$guest" = 401 ];then good=yes;break;fi
            sleep 5
          done
          test "$good" = yes
          echo KPI_LAST_ACCEPTED_PUBLIC_HEALTH_PASS
  browser:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Regression for 8290-to-8290, explicit manual selection and repeated Continue
        run: node ops/ovh/kpi-last-accepted-20261123/live.mjs