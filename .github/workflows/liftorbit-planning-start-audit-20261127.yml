name: Planning start integration audit
on:
  push:
    branches: [fix/planning-start-20261127]
    paths:
      - ops/ovh/planning-start-20261127/audit.mjs
      - .github/workflows/liftorbit-planning-start-audit-20261127.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/liftorbit-planning-start-test --no-save --no-package-lock --ignore-scripts playwright-core@1.58.2
      - run: node ops/ovh/planning-start-20261127/audit.mjs
