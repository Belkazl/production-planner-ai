name: LiftOrbit audit authentic KPI delta renderer and selectors
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-kpi-delta-audit-20261118.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read only KPI markup from disposable authenticated account
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/kpi-layout-audit.txt"
          import json,uuid,secrets,urllib.request,http.cookiejar,re
          base='https://app.liftorbit.app'
          cookie=http.cookiejar.CookieJar()
          client=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookie))
          payload=json.dumps({'email':'kpi-audit-'+uuid.uuid4().hex+'@liftorbit.invalid','password':secrets.token_urlsafe(27),'company':'Disposable KPI delta audit'}).encode()
          req=urllib.request.Request(base+'/api/auth/register',data=payload,method='POST',headers={'Content-Type':'application/json','Accept':'application/json','Origin':base})
          with client.open(req,timeout=40) as r: print('registration_status='+str(r.status))
          with client.open(base+'/',timeout=40) as r:
            html=r.read(12000000).decode('utf-8','replace')
            print('authenticated_status='+str(r.status))
          for key in ['function renderKpisWithDelta(', 'function renderKpiDelta(', "renderKpiDelta('durDelta'", 'previousKpiMetrics', 'window.__ppKpiBaselinePlan', 'function ppProjectAfterPlan(', 'window.ppProjectAfterPlan=function(d)', 'function restorePlan(']:
            hits=[i.start() for i in re.finditer(re.escape(key),html)]
            print('anchor_'+re.sub('[^A-Za-z0-9]','_',key)[:40]+'='+str(len(hits)))
            for i in hits[:2]:print('snippet_'+re.sub('[^A-Za-z0-9]','_',key)[:40]+'='+repr(html[max(0,i-260):i+850])[:1200])
          print('delta_ids='+','.join(sorted(set(re.findall(r'id=[\"\']([^\"\']*Delta)[\"\']',html)))))
          PY
      - uses: actions/checkout@v4
        if: always()
      - name: Publish non-sensitive KPI audit markers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          target=ops/ovh/test-results/kpi-delta-html-audit-20261118.txt
          mkdir -p "$(dirname "$target")"
          if test -s "$RUNNER_TEMP/kpi-layout-audit.txt"; then cp "$RUNNER_TEMP/kpi-layout-audit.txt" "$target"; else echo 'audit_unavailable' > "$target"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record KPI renderer selector inspection'
            for n in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
          fi
