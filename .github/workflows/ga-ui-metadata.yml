name: Diagnose GA progress UI
on:
  push:
    branches: [fix/ga-99-progress-status-20261012]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public progress indicators
        run: |
          python3 - <<'PY'
          import urllib.request,re,json
          u='https://aps-setup-bridge-candidate-v2-production.up.railway.app/'
          with urllib.request.urlopen(u,timeout=40) as r:h=r.read().decode('utf8')
          for ident in ['ppRealOptProgressV1','ppLivePanelV2']:
            m=re.search(r'<script id="'+ident+r'">(.*?)</script>',h,re.S)
            if not m:print('NO_SCRIPT',ident);continue
            script=m.group(1)
            print('SCRIPT_ID',ident,'LENGTH',len(script))
            for needle in ['update(','function render(','async function poll(','btn.textContent=','opt.textContent=','d.percent','d.generation','d.iteration','d.running','d.success','setInterval(','clearInterval(']:
              i=script.find(needle)
              if i>=0:print('CONTEXT',ident,needle,json.dumps(script[max(0,i-180):i+550],ensure_ascii=False))
          for needle in ['opt.onclick=','opt.onclick =','async function optimize(','async function runOptimize(']:
            i=h.find(needle)
            if i>=0:print('CLICK_HANDLER',needle,json.dumps(h[max(0,i-200):i+2800],ensure_ascii=False))
          PY
