name: Release verified integrated native setup results

# Only a deliberate marker change can deploy. App patches/tests never deploy by themselves.
on:
  push:
    branches: [fix/gantt-zoom-500-20261124]
    paths:
      - ops/ovh/integrated-setup-release-20261125/release.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/fix/gantt-zoom-500-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public release guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/ovh/integrated-setup-release-20261125/release.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s ops/ovh/integrated-setup-release-20261125 -p 'test_*.py'
      - name: Verify exact native and app acceptance then deploy its app bytes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ vars.OVH_HOST }}
          DEPLOY_USER: ${{ vars.OVH_USER }}
          DEPLOY_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: bash ops/ovh/integrated-setup-release-20261125/release.sh
      - name: Remove temporary private app sources and verification logs
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP"/integrated-setup-release.*
