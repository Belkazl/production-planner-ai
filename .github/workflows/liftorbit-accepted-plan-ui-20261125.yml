name: Guard accepted results in the authenticated planner UI
on:
  push:
    branches: [main, fix/accepted-plan-ui-20261125]
    paths:
      - .github/workflows/liftorbit-accepted-plan-ui-release-20261123.yml
      - ops/ovh/accepted-plan-ui-20261125/**
permissions: {contents: read}
concurrency:
  group: liftorbit-accepted-plan-ui-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Add first new result reference and update OVH on main after guarded preflight
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HOST" = 51.255.163.121
          test "$USER" = liftorbit-ci
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$KEY" > "$d/key"
          printf '%s\n' "$KH" > "$d/kh"
          chmod 600 "$d/key" "$d/kh"
          ssh_call(){ ssh -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" -o ConnectTimeout=20 "$@"; }
          scp_call(){ scp -q -i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/kh" -o ConnectTimeout=20 "$@"; }
          root=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app
          scp_call "$USER@$HOST:$root/current/restart-optimizer-ui.js" "$d/old.js"
          node ops/ovh/accepted-plan-ui-20261125/patch.mjs "$d/old.js" "$d/new.js"
          node --check "$d/new.js"
          old_sha=$(sha256sum "$d/old.js"|cut -d' ' -f1)
          new_sha=$(sha256sum "$d/new.js"|cut -d' ' -f1)
          if [ "$GITHUB_REF" != refs/heads/main ];then
            echo FRESH_FIRST_REFERENCE_READONLY_PREFLIGHT_PASS
            exit 0
          fi
          stage="$root/restart-optimizer-ui.accepted-plan-ui.next"
          scp_call "$d/new.js" "$USER@$HOST:$stage"
          ssh_call "$USER@$HOST" bash -s -- "$old_sha" "$new_sha" <<'REMOTE'
          set -euo pipefail
          root="$HOME/liftorbit-migration/sources/ovh-app"
          target="$root/current/restart-optimizer-ui.js"
          stage="$root/restart-optimizer-ui.accepted-plan-ui.next"
          backup="$HOME/liftorbit-migration/patch-backups/accepted-plan-ui-20261125"
          sha(){ sha256sum "$1"|cut -d' ' -f1; }
          test "$(sha "$target")" = "$1" || { echo FRESH_REFERENCE_SOURCE_DRIFT;exit 5; }
          test "$(sha "$stage")" = "$2" || { echo FRESH_REFERENCE_UPLOAD_CORRUPT;exit 5; }
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          mkdir -p "$backup"
          cp -p "$target" "$backup/restart-optimizer-ui.js"
          rollback(){
            trap - ERR
            cp -p "$backup/restart-optimizer-ui.js" "$target" || true
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo FRESH_FIRST_REFERENCE_ROLLBACK_ATTEMPTED
          }
          trap rollback ERR
          mv "$stage" "$target"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          good=no
          for i in $(seq 1 40);do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1;then good=yes;break;fi
            sleep 5
          done
          test "$good" = yes
          test "$(sha "$target")" = "$2"
          trap - ERR
          echo FRESH_FIRST_REFERENCE_OVH_DEPLOYED_HEALTHY
          REMOTE
          scp_call "$USER@$HOST:$root/current/restart-optimizer-ui.js" "$d/deployed.js"
          test "$(sha256sum "$d/deployed.js"|cut -d' ' -f1)" = "$new_sha"
          echo FRESH_FIRST_REFERENCE_DEPLOYED_SHA_PASS
  browser:
    if: github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Verify deployed continuation persistence in Chrome
        run: node ops/ovh/continue-incumbent-20261125/live.mjs
