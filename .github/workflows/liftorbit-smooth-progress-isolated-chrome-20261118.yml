name: LiftOrbit isolated Chrome smooth GA percent acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-smooth-progress-isolated-chrome-20261118.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome driver
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Verify one percent at a time, Stop and reload
        id: test
        run: node ops/ovh/smooth-verified-ga-progress-20261118/chrome-isolated.mjs
      - uses: actions/checkout@v4
        if: always()
      - name: Record result
        if: always()
        shell: bash
        env:
          QA_RUN: ${{ github.run_id }}
          QA_RESULT: ${{ steps.test.outcome }}
        run: |
          set -euo pipefail
          p=ops/ovh/test-results/smooth-progress-isolated-chrome-latest.txt
          mkdir -p "$(dirname "$p")"
          printf 'workflow_run=%s\nchrome_acceptance=%s\n' "$QA_RUN" "$QA_RESULT" > "$p"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record isolated Chrome one-percent animation test'
            for n in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
          fi
