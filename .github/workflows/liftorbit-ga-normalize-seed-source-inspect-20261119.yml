name: LiftOrbit read only exact normalized continue seed source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-normalize-seed-source-inspect-20261119.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read a bounded source section for continuation complexity
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$HOME/liftorbit-migration/sources/ovh-app/current"
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          p=Path('python-ga-upstream.mjs');lines=p.read_text().splitlines()
          print('SOURCE_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          for j in range(101,min(185,len(lines))):
            line=lines[j]
            if re.search(r'password|secret|token|credential|cookie|authorization|private.key|database_url|api.key|email|https?://',line,re.I):line='[redacted]'
            print('CODE',j+1,line[:270])
          PY
          REMOTE
