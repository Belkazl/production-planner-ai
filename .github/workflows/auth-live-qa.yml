name: Verify deployed auth QA anonymously
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify anonymous API is blocked, login UI available, CSRF denied
        run: python3 tests/auth-live-qa.py
