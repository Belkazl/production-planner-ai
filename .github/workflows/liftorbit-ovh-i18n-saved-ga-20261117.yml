name: LiftOrbit OVH English Saved plans and GA text localization 2026-11-17
# Translate dynamic Saved plans, conditions warnings, Stop validator, and Best found previews only.
# Only language-ui.js changes; guard current Stop UI, Python GA, Gantt and all project data.
# Locale regression 44064396450 passed including RU/EN roundtrip and live DOM insertions.
# Validate deployed HTML translation source using a disposable authenticated account.
# Exact live file SHA, Docker build, HTTPS auth boundary and rollback required.
# Verified in isolated localization regression workflow 44064396450.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ovh-i18n-saved-ga-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'release(liftorbit): translate saved plans and GA notices on OVH')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable production app
        uses: actions/checkout@v4
        with:
          ref: 4a1457d6f33e7ef5b6e8ad59c3e21ef345b8c25f
          path: pinned
          persist-credentials: false
      - name: Checkout previous verified OVH patch
        uses: actions/checkout@v4
        with:
          ref: 4765adaf3fe2c22f6130a23b87544dd36eb4b36f
          path: prior
          persist-credentials: false
      - name: Checkout tested English localization
        uses: actions/checkout@v4
        with:
          ref: 42f2ec3280bd6406b37f20e2a4a4f714ce1c027d
          path: repaired
          persist-credentials: false
      - name: Checkout already released GA JSON compactor
        uses: actions/checkout@v4
        with:
          ref: 0158a0514b7bca113fee92b2389747d081a8a1f6
          path: compact
          persist-credentials: false
      - name: Verify exact one-file change and pinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p old/app new/app app
          cp -a pinned/. old/app/
          cp -a pinned/. new/app/
          cp repaired/language-ui.js new/app/language-ui.js
          for side in old new; do
            for script in patch-runtime-origins.mjs repair-planner-ui.mjs repair-ga-state.mjs repair-ga-load.mjs repair-continuation.mjs repair-async-ga.mjs; do
              node "prior/ops/ovh/$script" "$side/app"
            done
            node compact/ops/ovh/compact-ga-progress.mjs "$side/app"
          done
          node --check old/app/language-ui.js
          node --check new/app/language-ui.js
          grep -q 'Conditions changed:' new/app/language-ui.js
          grep -q 'PP_I18N_SAVED_PLANS' repaired/tests/liftorbit-i18n-saved-stop-live.test.mjs
          diff -qr old/app new/app > "$RUNNER_TEMP/i18n-patch-diff" || test "$?" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/i18n-patch-diff")" -eq 1
          grep -Fqx 'Files old/app/language-ui.js and new/app/language-ui.js differ' "$RUNNER_TEMP/i18n-patch-diff"
          grep -q '[Вв]ременный' new/app/language-ui.js
          sha256sum old/app/language-ui.js | cut -d' ' -f1 > old.language-ui.sha
          sha256sum new/app/language-ui.js | cut -d' ' -f1 > new.language-ui.sha
          echo 'I18N_EXACT_ONE_LANGUAGE_UI_CHANGED'
          docker build --quiet -t liftorbit-i18n-release:preflight new/app > "$RUNNER_TEMP/i18n-docker-build.log" 2>&1 || {
            echo 'I18N_DOCKER_BUILD_FAILED'
            exit 22
          }
          echo 'I18N_DOCKER_BUILD_PASS'
      - name: Apply guarded OVH app update with automatic rollback
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test "$OVH_HOST" = "51.255.163.121"
          test "$OVH_USER" = "liftorbit-ci"
          test -n "$OVH_SSH_PRIVATE_KEY"
          test -n "$OVH_SSH_KNOWN_HOSTS"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20)
          target="$OVH_USER@$OVH_HOST"
          oldSha=$(cat old.language-ui.sha)
          newSha=$(cat new.language-ui.sha)
          root=/home/liftorbit-ci/liftorbit-migration
          scp -q "${opts[@]}" new/app/language-ui.js "$target:$root/sources/ovh-app/language-ui.js.i18n.next"
          ssh "${opts[@]}" "$target" bash -s -- "$oldSha" "$newSha" <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/liftorbit-migration"
          app="$root/sources/ovh-app/current/language-ui.js"
          next="$root/sources/ovh-app/language-ui.js.i18n.next"
          backup="$root/patch-backups/i18n-saved-ga-20261117"
          expectedOld="$1"; expectedNew="$2"
          sha(){ sha256sum "$1" | cut -d' ' -f1; }
          test -f "$app" && test -f "$next"
          test "$(sha "$app")" = "$expectedOld" || { echo 'I18N_SOURCE_DRIFT_ABORT'; exit 5; }
          test "$(sha "$next")" = "$expectedNew" || { echo 'I18N_UPLOAD_HASH_MISMATCH'; exit 5; }
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null || { echo 'I18N_PREDEPLOY_SMOKE_FAILED'; exit 6; }
          mkdir -p "$backup"
          cp -p "$app" "$backup/language-ui.js"
          test "$(sha "$backup/language-ui.js")" = "$expectedOld"
          rollback(){
            trap - ERR
            cp -p "$backup/language-ui.js" "$app" || true
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo 'I18N_AUTOMATIC_ROLLBACK_ATTEMPTED'
          }
          trap rollback ERR
          mv "$next" "$app"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          healthy=no
          for attempt in $(seq 1 24); do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes || { echo 'I18N_POSTDEPLOY_HEALTH_FAILED'; false; }
          test "$(sha "$app")" = "$expectedNew"
          trap - ERR
          echo 'I18N_OVH_DEPLOYED_HEALTHY'
          REMOTE
      - name: Public HTTPS, guest boundary and no redirect
        shell: bash
        run: |
          set -euo pipefail
          healthy=no
          for attempt in $(seq 1 15); do
            public=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 https://app.liftorbit.app/__bridge_health || true)
            direct=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 --resolve app.liftorbit.app:443:51.255.163.121 https://app.liftorbit.app/__bridge_health || true)
            auth=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 18 https://app.liftorbit.app/api/auth/me || true)
            if [[ "$public" = 200 && "$direct" = 200 && "$auth" = 401 ]]; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes
          echo 'I18N_PUBLIC_API_HEALTHY'
