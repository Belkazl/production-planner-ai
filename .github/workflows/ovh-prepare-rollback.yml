name: LiftOrbit OVH - pre-cutover rollback backups
on:
  push:
    branches: [ops/railway-migration-20261108]
    paths: [.github/workflows/ovh-prepare-rollback.yml]
permissions:
  contents: read
concurrency:
  group: liftorbit-ovh-cutover-operations
  cancel-in-progress: false
jobs:
  rollback-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Save both current OVH databases for rollback without promoting or altering DNS
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$OVH_HOST" == 51.255.163.121 && "$OVH_USER" == liftorbit-ci ]]
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$tmp/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$tmp/hosts"
          chmod 600 "$tmp/key" "$tmp/hosts"
          ssh -i "$tmp/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/hosts" \
            "$OVH_USER@$OVH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          sudo -n /usr/local/sbin/liftorbit-cutover-ops prepare
          sudo -n /usr/local/sbin/liftorbit-cutover-ops status
          sudo -n /usr/local/sbin/liftorbit-ops smoke
          sudo -n /usr/local/sbin/liftorbit-edge-ops status
          echo OVH_PRECUTOVER_ROLLBACK_BACKUPS_READY
          REMOTE
