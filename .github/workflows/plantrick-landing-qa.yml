name: QA LiftOrbit landing rebrand
on:
  push:
    branches: [domain/liftorbit-landing-2026-10-15]
  workflow_dispatch:
jobs:
  brand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated website
        run: |
          test -f index.html
          test ! -f auth-bridge.ts
          bun build ./server.ts --target=bun --outdir=/tmp/liftorbit-landing
          node --check site.js
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Browser-check original components and rebranding
        run: |
          PORT=3000 bun server.ts >/tmp/liftorbit-landing.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          node tests/landing-smoke.cjs
          node tests/landing-benefits.cjs
          node tests/landing-v4-no-russian-gallery.cjs
          node tests/plantrick-landing-browser.cjs
      - name: Archive rebranded desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liftorbit-landing-desktop-mobile
          path: |
            liftorbit-landing-*.png
          if-no-files-found: ignore
          retention-days: 7
