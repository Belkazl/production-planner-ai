name: QA click Gantt operation details
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Click live Gantt bars and verify details
        run: node tests/gantt-browser.cjs
      - name: Save visual QA screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gantt-operation-click-dialog
          path: gantt-click-dialog.png
          retention-days: 3
          if-no-files-found: ignore
