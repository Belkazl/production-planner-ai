name: LiftOrbit read-only finalization and setup worker source audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ovh-setup-finalization-audit-20261119.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check source call sites and active service types safely
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$OVH_HOST" = "51.255.163.121"
          test "$OVH_USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=15 "$OVH_USER@$OVH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$HOME/liftorbit-migration/sources/ovh-app/current"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          files=["worker-manager.ts","ga-worker-core.ts","ga-workers-enable.ts","index.ts","baselines/2026-10-10/aps-setup-bridge/index.ts","python-ga-upstream.mjs","restart-optimizer-ui.js"]
          for f in files:
              p=Path(f)
              if not p.exists():
                  print("MISSING",f)
                  continue
              s=p.read_text()
              print("SOURCE",f,"bytes",len(s),"sha256",hashlib.sha256(s.encode()).hexdigest())
              if f=="index.ts" or f.endswith("/index.ts") or f=="ga-workers-enable.ts":
                  for token in ["async function progress(req)","async function plan(req)","function convertOne(","function cachedFinal(","function saveFinal(","ppWorkerSearch(","await searchWithSetup(","ppPythonGAUpstream.fetch(req,","function ppCachedProgress("]:
                      pos=0
                      for _ in range(4):
                          i=s.find(token,pos)
                          if i<0:break
                          print("SOURCE_SITE",f,token,json.dumps(s[max(0,i-360):i+1150]))
                          pos=i+len(token)
              if f=="worker-manager.ts":
                  for token in ["PP_WORKER_TIMEOUT_MS","async function runIsolatedSetupSearch","child=Bun.spawn"]:
                      i=s.find(token)
                      if i>=0: print("WORKER_SITE",token,json.dumps(s[max(0,i-220):i+650]))
          PY
          REMOTE
