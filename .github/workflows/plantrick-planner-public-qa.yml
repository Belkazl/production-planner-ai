name: Verify published LiftOrbit protected planner
on:
  push:
    branches: [brand/liftorbit-planner-2026-10-15]
    paths:
      - .github/workflows/plantrick-planner-public-qa.yml
  workflow_dispatch:
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Wait for production LiftOrbit brand
        run: |
          for i in $(seq 1 80); do
            html="$(curl -fsS --max-time 8 'https://production-planner-gateway-v2-production.up.railway.app/' || true)"
            if printf '%s' "$html" | grep -q 'Вход — LiftOrbit' && ! printf '%s' "$html" | grep -q '<title>Вход — ProdPlan AI</title>'; then
              echo "LiftOrbit authentication UI is live"
              exit 0
            fi
            sleep 2
          done
          echo "LiftOrbit production login not visible"
          exit 1
      - name: Check live login EN and RU and anonymous account security
        env:
          LIFTORBIT_PLANNER_PUBLIC_URL: https://production-planner-gateway-v2-production.up.railway.app/
        run: node tests/plantrick-planner-public.cjs
      - name: Archive published LiftOrbit login screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liftorbit-live-login-en-ru
          path: liftorbit-live-login-*.png
          retention-days: 7
          if-no-files-found: ignore
