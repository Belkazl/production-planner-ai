name: Release Solar Linear sidebar icons after active optimization is finished
on:
  push:
    branches: [fix/solar-sidebar-icons-20261126]
    paths:
      - ops/ovh/solar-sidebar-icons-20261126/DEPLOY_APPROVED
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/liftorbit-solar-test --no-save --no-package-lock --ignore-scripts @iconify-json/solar@1.2.5 playwright-core@1.58.2
      - name: Recheck candidate before authorized release
        run: |
          set -euo pipefail
          node --test ops/ovh/solar-sidebar-icons-20261126/test.mjs
          node ops/ovh/solar-sidebar-icons-20261126/browser.mjs
      - name: Install navigation-only change and verify production
        env:
          DEPLOY_HOST: ${{ vars.OVH_HOST }}
          DEPLOY_USER: ${{ vars.OVH_USER }}
          DEPLOY_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: bash ops/ovh/solar-sidebar-icons-20261126/release.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: solar-sidebar-live
          path: /tmp/liftorbit-solar-sidebar-live.png
          retention-days: 7
