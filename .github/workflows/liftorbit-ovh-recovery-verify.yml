name: LiftOrbit OVH read-only recovery verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ovh-recovery-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read-only service status after automatic rollback
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test "$OVH_HOST" = 51.255.163.121
          test "$OVH_USER" = liftorbit-ci
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/hosts"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/hosts"
          opts=(-i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/hosts" -o ConnectTimeout=15)
          ssh "${opts[@]}" "$OVH_USER@$OVH_HOST" 'sudo -n /usr/local/sbin/liftorbit-ops status; sudo -n /usr/local/sbin/liftorbit-ops smoke'
      - name: Verify public endpoint and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 12 https://app.liftorbit.app/__bridge_health > /dev/null
          status=$(curl --silent -o /dev/null -w '%{http_code}' --max-time 12 https://app.liftorbit.app/api/auth/me)
          test "$status" = 401
          echo 'PUBLIC_OVH_AUTH_SERVICE_RECOVERED'
