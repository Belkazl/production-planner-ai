name: LiftOrbit Chrome confirm 1 percent UI without GA prediction
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-smooth-verified-progress-chrome-20261118.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm protected rollout and no public availability regression
        run: |
          set -euo pipefail
          grep -Fqx 'preflight=success' ops/ovh/test-results/smooth-ga-progress-release-latest.txt
          grep -Fqx 'rollout=success' ops/ovh/test-results/smooth-ga-progress-release-latest.txt
          grep -Fqx 'public_health=success' ops/ovh/test-results/smooth-ga-progress-release-latest.txt
          command -v google-chrome
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://app.liftorbit.app/__bridge_health)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://app.liftorbit.app/api/auth/me)" = 401
      - name: Install lightweight Chrome driver
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Verify 10 11 12 13 20; Stop; reload with fresh confirmed value
        id: acceptance
        run: node ops/ovh/smooth-verified-ga-progress-20261118/chrome.mjs
      - uses: actions/checkout@v4
        if: always()
      - name: Record exact Chrome UI acceptance
        if: always()
        env:
          RUN: ${{ github.run_id }}
          RESULT: ${{ steps.acceptance.outcome }}
        run: |
          set -euo pipefail
          file=ops/ovh/test-results/smooth-ga-progress-chrome-latest.txt
          mkdir -p "$(dirname "$file")"
          printf 'workflow_run=%s\nchrome_acceptance=%s\n' "$RUN" "$RESULT" > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record smooth verified GA progress in real Chrome'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            echo 'CHROME_REPORT_PUSH_UNAVAILABLE'
            exit 0
          fi
