name: Read-only ceramic resource eligibility audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect model resources and exact operation requirements without changing data
        run: python3 tests/diagnose-ceramic-resources.py
