name: LiftOrbit SEO and browser QA
on:
  push:
    branches: [seo/liftorbit-2026-10-15]
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional public landing URL to verify after deployment
        required: false
        default: ''
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.20'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checks
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start unchanged production runtime with SEO server
        if: inputs.target_url == '' || github.event_name == 'push'
        run: |
          bun run server.ts > /tmp/liftorbit-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/liftorbit-server.log
          exit 1
      - name: Verify SEO, responsive layout and trial dialog
        env:
          LANDING_URL: ${{ inputs.target_url || 'http://127.0.0.1:3000' }}
        run: node tests/landing-seo.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liftorbit-seo-evidence
          path: |
            liftorbit-seo-*.png
            liftorbit-seo-report.json
          if-no-files-found: warn
          retention-days: 7
