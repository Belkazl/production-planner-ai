name: LiftOrbit read-only inspect repeated GA start 502
on:
  push:
    branches: [main]
    paths: [.github/workflows/liftorbit-ga-start-live-readonly-audit-20261119.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect live async start handler and local host capacity without changing production
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121" && test "$USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$HOME/liftorbit-migration/sources/ovh-app/current"
          echo "READONLY_MACHINE_CAPACITY"
          free -m | head -n 3
          df -h . | tail -n 1
          echo "READONLY_FILES"
          sha256sum python-ga-upstream.mjs async-plan-transport.js | cut -d ' ' -f1
          python3 - <<'PY'
          from pathlib import Path
          import re
          for fn in ['python-ga-upstream.mjs','async-plan-transport.js']:
            p=Path(fn)
            lines=p.read_text(errors='replace').splitlines()
            if fn=='python-ga-upstream.mjs':
              words=r'__pp_async_start|/api/plan|optimization_running_stop_first|ga_start|startGa|startOptimization|start.*worker|spawn\(|fork\(|timeout|502'
              radius=9
            else:
              words=r'joinOrStart\(|progressOnce\(|async_start|waitForPlan\('
              radius=8
            target=[i for i,l in enumerate(lines) if re.search(words,l,re.I)]
            shown=set()
            for i in target[:24]:
              for j in range(max(0,i-radius),min(len(lines),i+radius+1)):shown.add(j)
            print('FILE',fn,'LINES',len(lines),'TARGET_MATCHES',len(target))
            for j in sorted(shown)[:310]:
              line=lines[j].rstrip()
              if re.search(r'password|credential|private.key|api.key|secret|cookie|authorization|database.url|access.key|email|token',line,re.I):
                line='[sensitive source line redacted]'
              if len(line)>220:line=line[:220]+' ...'
              print('SRC',fn,j+1,line)
          PY
          echo "READONLY_HEALTH"
          curl -sS -o /dev/null -w "internal_health_status=%{http_code}\n" --max-time 10 http://127.0.0.1:8080/__bridge_health || true
          REMOTE
