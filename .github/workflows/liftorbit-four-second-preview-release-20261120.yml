name: LiftOrbit release four-second 140-op candidate fog preview
# authenticated direct current-candidate snapshot route diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/liftorbit-four-second-preview-release-20261120.yml]
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Pin all five production sources and unit-test the exact patch without live edits
        id: preflight
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121" && test "$USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20)
          base=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/current
          mkdir -p old/ga_python_workers/ga_workers new
          for file in python-ga-upstream.mjs restart-optimizer-ui.js auth-runtime.js; do
            scp -q "${opts[@]}" "$USER@$HOST:$base/$file" "old/$file"
          done
          for file in manager.py full_runtime_adapter.py; do
            scp -q "${opts[@]}" "$USER@$HOST:$base/ga_python_workers/ga_workers/$file" "old/ga_python_workers/ga_workers/$file"
          done
          cp -a old/. new/
          node ops/ovh/four-second-fog-preview-20261120/patch.mjs new
          node --check new/python-ga-upstream.mjs
          node --check new/restart-optimizer-ui.js
          node --check new/auth-runtime.js
          python3 -m py_compile new/ga_python_workers/ga_workers/manager.py new/ga_python_workers/ga_workers/full_runtime_adapter.py
          node ops/ovh/four-second-fog-preview-20261120/build-probe.mjs
          node --check ops/ovh/four-second-fog-preview-20261120/_probe.mjs
          for file in python-ga-upstream.mjs restart-optimizer-ui.js auth-runtime.js; do
            sha256sum "old/$file" | cut -d' ' -f1 > "$RUNNER_TEMP/old-$file.sha"
            sha256sum "new/$file" | cut -d' ' -f1 > "$RUNNER_TEMP/new-$file.sha"
          done
          for file in manager.py full_runtime_adapter.py; do
            sha256sum "old/ga_python_workers/ga_workers/$file" | cut -d' ' -f1 > "$RUNNER_TEMP/old-$file.sha"
            sha256sum "new/ga_python_workers/ga_workers/$file" | cut -d' ' -f1 > "$RUNNER_TEMP/new-$file.sha"
          done
          command -v google-chrome
          npm install --no-save --no-package-lock playwright-core@1.57.0
          echo FOG_140_PREFLIGHT_SUCCESS
      - name: Install exact verified files with backups and automatic rollback on server failure
        id: rollout
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20)
          root=/home/liftorbit-ci/liftorbit-migration
          for file in python-ga-upstream.mjs restart-optimizer-ui.js auth-runtime.js; do
            scp -q "${opts[@]}" "new/$file" "$USER@$HOST:$root/sources/ovh-app/pp-fog-$file.next"
          done
          for file in manager.py full_runtime_adapter.py; do
            scp -q "${opts[@]}" "new/ga_python_workers/ga_workers/$file" "$USER@$HOST:$root/sources/ovh-app/pp-fog-$file.next"
          done
          ssh "${opts[@]}" "$USER@$HOST" bash -s --             "$(cat "$RUNNER_TEMP/old-python-ga-upstream.mjs.sha")" "$(cat "$RUNNER_TEMP/new-python-ga-upstream.mjs.sha")"             "$(cat "$RUNNER_TEMP/old-restart-optimizer-ui.js.sha")" "$(cat "$RUNNER_TEMP/new-restart-optimizer-ui.js.sha")"             "$(cat "$RUNNER_TEMP/old-manager.py.sha")" "$(cat "$RUNNER_TEMP/new-manager.py.sha")"             "$(cat "$RUNNER_TEMP/old-full_runtime_adapter.py.sha")" "$(cat "$RUNNER_TEMP/new-full_runtime_adapter.py.sha")" "$(cat "$RUNNER_TEMP/old-auth-runtime.js.sha")" "$(cat "$RUNNER_TEMP/new-auth-runtime.js.sha")" <<'REMOTE'
          set -euo pipefail
          root="$HOME/liftorbit-migration"
          base="$root/sources/ovh-app"
          backup="$root/patch-backups/four-second-fog-preview-20261120"
          names=(python-ga-upstream.mjs restart-optimizer-ui.js manager.py full_runtime_adapter.py auth-runtime.js)
          files=("$base/current/python-ga-upstream.mjs"
                 "$base/current/restart-optimizer-ui.js"
                 "$base/current/ga_python_workers/ga_workers/manager.py"
                 "$base/current/ga_python_workers/ga_workers/full_runtime_adapter.py"
                 "$base/current/auth-runtime.js")
          staged=("$base/pp-fog-python-ga-upstream.mjs.next"
                  "$base/pp-fog-restart-optimizer-ui.js.next"
                  "$base/pp-fog-manager.py.next"
                  "$base/pp-fog-full_runtime_adapter.py.next"
                  "$base/pp-fog-auth-runtime.js.next")
          expected=("$@")
          test "${#expected[@]}" -eq 10
          sha(){ sha256sum "$1" | cut -d' ' -f1; }
          for i in 0 1 2 3 4; do
            test "$(sha "${files[$i]}")" = "${expected[$((2*i))]}"
            test "$(sha "${staged[$i]}")" = "${expected[$((2*i+1))]}"
          done
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          mkdir -p "$backup"
          for i in 0 1 2 3 4; do
            cp -p "${files[$i]}" "$backup/${names[$i]}"
            test "$(sha "$backup/${names[$i]}")" = "${expected[$((2*i))]}"
          done
          rollback(){
            trap - ERR
            for i in 0 1 2 3 4; do cp -p "$backup/${names[$i]}" "${files[$i]}" || true; done
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo FOG_ROLLBACK_ATTEMPTED
          }
          trap rollback ERR
          for i in 0 1 2 3 4; do mv "${staged[$i]}" "${files[$i]}"; done
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          healthy=no
          for attempt in $(seq 1 26); do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes
          for i in 0 1 2 3 4; do test "$(sha "${files[$i]}")" = "${expected[$((2*i+1))]}"; done
          trap - ERR
          echo FOG_140_PRODUCTION_DEPLOYED
          REMOTE
      - name: Verify production health and unauthenticated access boundary
        id: health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            health=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/__bridge_health || true)
            guest=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/api/auth/me || true)
            if [[ "$health" = 200 && "$guest" = 401 ]]; then echo FOG_PUBLIC_HEALTHY; exit 0; fi
            sleep 4
          done
          exit 1
      - name: E2E synthetic 886-operation live optimization, four-second candidate fog, verified full 100, Continue and 502 recovery
        id: live
        shell: bash
        env:
          FREEZE_TEST_MODE: deployed
        run: |
          set -euo pipefail
          node ops/ovh/four-second-fog-preview-20261120/_probe.mjs
          echo FOG_140_TWO_RUN_LIVE_ACCEPTANCE_PASS
      - name: Restore five exact previous sources if real browser acceptance fails
        if: ${{ failure() && steps.rollout.outcome == 'success' }}
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          root="$HOME/liftorbit-migration"
          base="$root/sources/ovh-app/current"
          backup="$root/patch-backups/four-second-fog-preview-20261120"
          for file in python-ga-upstream.mjs restart-optimizer-ui.js manager.py full_runtime_adapter.py auth-runtime.js; do test -r "$backup/$file"; done
          cp -p "$backup/python-ga-upstream.mjs" "$base/python-ga-upstream.mjs"
          cp -p "$backup/restart-optimizer-ui.js" "$base/restart-optimizer-ui.js"
          cp -p "$backup/manager.py" "$base/ga_python_workers/ga_workers/manager.py"
          cp -p "$backup/full_runtime_adapter.py" "$base/ga_python_workers/ga_workers/full_runtime_adapter.py"
          cp -p "$backup/auth-runtime.js" "$base/auth-runtime.js"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/qa-rollback-private.log" 2>&1
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          echo FOG_140_ROLLBACK_VERIFIED
          REMOTE
      - name: Summary
        if: always()
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          ROLLOUT: ${{ steps.rollout.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          LIVE: ${{ steps.live.outcome }}
        run: echo "FOG_140_RELEASE preflight=$PREFLIGHT rollout=$ROLLOUT health=$HEALTH live=$LIVE"