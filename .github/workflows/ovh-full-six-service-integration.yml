name: OVH migration - six-service integration on isolated GitHub runner
# Runner executes only after the explicitly scoped migration workflow changes.
on:
  push:
    branches:
      - ops/railway-migration-20261108
    paths:
      - .github/workflows/ovh-full-six-service-integration.yml
      - ops/ovh/full.compose.yml
      - ops/ovh/render-secrets.py
      - ops/ovh/patch-runtime-origins.mjs
      - ops/ovh/planner/Dockerfile
      - ops/ovh/planner/apt-get
permissions:
  contents: read
concurrency:
  group: ovh-six-service-integration
  cancel-in-progress: false

jobs:
  integrated-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/railway-migration-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 4a1457d6f33e7ef5b6e8ad59c3e21ef345b8c25f
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e0d0b7a5d4e625c4fe47acb2a26436ad3071c9e1
          path: auth
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 788a06c269330d70528d3ac75a89ec729c12fe0b
          path: ga
          persist-credentials: false
      - name: Retrieve encrypted-in-transit copies, never upload artifacts
        shell: bash
        env:
          OVH_HOST: ${{ vars.OVH_HOST }}
          OVH_USER: ${{ vars.OVH_USER }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$OVH_HOST" == 51.255.163.121 && "$OVH_USER" == liftorbit-ci ]] || exit 2
          [[ -n "$OVH_SSH_PRIVATE_KEY" && -n "$OVH_SSH_KNOWN_HOSTS" ]] || exit 2
          work="$RUNNER_TEMP/liftorbit-integration"
          mkdir -p "$work/config" "$work/backups"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$work/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$work/hosts"
          chmod 600 "$work/key" "$work/hosts"
          opts=(-i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/hosts")
          host="$OVH_USER@$OVH_HOST"
          # Stream protected JSON directly through the SSH connection, never logs.
          ssh "${opts[@]}" "$host" 'tar -cf - -C "$HOME/liftorbit-migration/production/current" gateway.json auth-gateway.json auth-app.json ga-worker.json postgres.json postgres-me4i.json' | tar -xf - -C "$work/config"
          remote="/home/liftorbit-ci/liftorbit-migration/backups/backup-42475681877-1"
          for f in postgres.dump postgres-me4i.dump SHA256SUMS.txt; do
            scp -q "${opts[@]}" "$host:$remote/$f" "$work/backups/$f"
          done
          (cd "$work/backups" && sha256sum --check --quiet SHA256SUMS.txt)
          echo 'PRIVATE_PRODUCTION_SNAPSHOTS_DOWNLOADED_TO_EPHEMERAL_RUNNER'
      - name: Prepare patched source trees, private runtime configs and Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          node ops/ops/ovh/patch-runtime-origins.mjs app
          sudo mkdir -p /opt/liftorbit/sources/{app,auth,ga,planner} /opt/liftorbit/secrets
          sudo cp -a ops/ops/ovh/planner/. /opt/liftorbit/sources/planner/
          sudo cp -a app/. /opt/liftorbit/sources/app/
          sudo cp -a auth/ga_python_workers/qa_auth/. /opt/liftorbit/sources/auth/
          sudo cp -a ga/ga_python_workers/. /opt/liftorbit/sources/ga/
          sudo python3 ops/ops/ovh/render-secrets.py \
            --source "$RUNNER_TEMP/liftorbit-integration/config" \
            --output /opt/liftorbit/secrets
          sudo cp ops/ops/ovh/full.compose.yml /opt/liftorbit/full.compose.yml
          sudo docker compose -f /opt/liftorbit/full.compose.yml config --quiet
          echo 'INTEGRATION_RUNNER_RUNTIME_CONFIG_READY'
      - name: Classify protected planner launcher bootstrap without printing code or secrets
        shell: bash
        run: |
          sudo python3 - <<'PY'
          import ast, json, pathlib, re
          p=pathlib.Path('/opt/liftorbit/secrets/planner.json')
          obj=json.loads(p.read_text())
          launcher=obj.get('PP_GENERIC_RESTORE_LAUNCH_V2')
          if not isinstance(launcher,str):
              raise SystemExit('OVH_PLANNER_LAUNCHER_MISSING')
          lines=launcher.splitlines()
          print('OVH_LAUNCHER_LINE_COUNT',len(lines))
          print('OVH_LAUNCHER_EXPECTED_POSTGRES_CLIENT',bool(re.search(r'postgresql-client',launcher)))
          print('OVH_LAUNCHER_EXPECTED_APT_GET',bool(re.search(r'apt-get',launcher)))
          tree=ast.parse(launcher)
          methods=set()
          for node in ast.walk(tree):
              if isinstance(node,ast.Call):
                  call=node.func
                  if isinstance(call,ast.Attribute):
                      kind=call.attr
                      if kind in ('run','check_call','check_output','Popen','system','execv','execvp'):
                          methods.add(kind)
          print('OVH_LAUNCHER_SUBPROCESS_METHODS',','.join(sorted(methods)) or 'none')
          for line_no in (565,568,570,571,572,573,575):
              if line_no <= len(lines):
                  row=lines[line_no-1].strip()
                  terms=('apt-get','subprocess','check_call','check_output','pip','shell=True','os.system','postgresql-client')
                  print('OVH_LAUNCHER_LINE_CLASS',line_no,','.join(t for t in terms if t in row) or 'other')
          PY
      - name: Verify legacy planner package-command compatibility inside production image
        shell: bash
        run: |
          set -euo pipefail
          sudo docker compose -f /opt/liftorbit/full.compose.yml build planner-gateway > /dev/null
          for args in "update" "update -qq" "install -y postgresql-client" "install -qq -y postgresql-client"; do
            read -ra tokens <<< "$args"
            sudo docker run --rm --entrypoint /usr/bin/apt-get liftorbit/planner:ovh-staging "${tokens[@]}" > /dev/null
            echo "OVH_APT_WRAPPER_SAFE_PROBE_OK argc=${#tokens[@]}"
          done
      - name: Restore both PostgreSQL databases in disposable Docker volumes
        shell: bash
        run: |
          set -euo pipefail
          cfg=/opt/liftorbit/full.compose.yml
          sudo docker compose -f "$cfg" up -d postgres-main postgres-auth
          for spec in postgres-main postgres-auth; do
            cid=$(sudo docker compose -f "$cfg" ps -q "$spec")
            healthy=no
            for i in {1..70}; do
              if [ "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$cid")" = healthy ]; then healthy=yes; break; fi
              sleep 2
            done
            [ "$healthy" = yes ] || { echo "PG18_HEALTH_FAILED $spec"; exit 3; }
          done
          for spec in "postgres-main:postgres:12" "postgres-auth:postgres-me4i:6"; do
            IFS=: read -r service source minimum <<< "$spec"
            cid=$(sudo docker compose -f "$cfg" ps -q "$service")
            path="$RUNNER_TEMP/liftorbit-integration/backups/$source.dump"
            db=$(sudo sed -n 's/^POSTGRES_DB=//p' "/opt/liftorbit/secrets/$service.env")
            docker cp "$path" "$cid:/tmp/restore.dump" > /dev/null
            docker exec -u 0 "$cid" chmod 0644 /tmp/restore.dump
            docker exec -u postgres "$cid" pg_restore --exit-on-error \
              --no-owner --no-privileges -U postgres -d "$db" /tmp/restore.dump > /dev/null
            docker exec "$cid" rm -f /tmp/restore.dump
            tables=$(docker exec -u postgres "$cid" psql -U postgres -d "$db" -At -c \
              "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
            test "$tables" -ge "$minimum"
            echo "INTEGRATION_DB_RESTORED $service tables=$tables"
          done
      - name: Classify the exact patched planner shell command in disposable container
        shell: bash
        run: |
          set -euo pipefail
          sudo docker run --rm --network liftorbit-ovh-staging_backend \
            -v /opt/liftorbit/secrets/planner.json:/run/liftorbit/config.json:ro \
            --entrypoint python3 liftorbit/planner:ovh-staging -c "$(cat <<'PY'
          import ast,json,os,re,shlex,subprocess
          data=json.load(open('/run/liftorbit/config.json'))
          env=dict(os.environ)
          env.update(data)
          core=shlex.split(data.get('D_START_GOOD',''))
          tree=ast.parse(data.get('PP_CAP_BATCH_BOOT_V2',''))
          nodes=[n for n in ast.walk(tree) if isinstance(n,ast.Call)
                 and isinstance(n.func,ast.Attribute) and n.func.attr=='replace'
                 and getattr(n,'lineno',0)==68 and len(n.args)>=2]
          if len(core)!=3 or len(nodes)!=1:
              raise SystemExit('OVH_PATCHED_LEGACY_PROBE_SHAPE_INVALID')
          n=nodes[0]
          if not all(isinstance(x,ast.Constant) and isinstance(x.value,str) for x in n.args[:2]):
              raise SystemExit('OVH_PATCHED_LEGACY_PROBE_REPLACEMENT_DYNAMIC')
          old,new=[a.value for a in n.args[:2]]
          count=n.args[2].value if len(n.args)>=3 and isinstance(n.args[2],ast.Constant) else 1
          cmd=core[2].replace(old,new,count)
          print('OVH_PATCHED_LEGACY_PROBE_MATCH_COUNT',core[2].count(old))
          allowed={'apt-get','python3','test','base64','printf','cat','mkdir','cd','echo','sh','bash',
                   'sleep','pip','pg_isready','psql','export','true','false','touch','chmod',
                   'cp','exec','exit','env'}
          try:
              result=subprocess.run(['sh','-x','-c',cmd],env=env,
                         stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=35)
              err=result.stderr.decode('utf8','replace')
              out=result.stdout.decode('utf8','replace')
              print('OVH_PATCHED_PROBE_EXIT',result.returncode)
              print('OVH_PATCHED_PROBE_STDERR_BYTES',len(err))
              print('OVH_PATCHED_PROBE_STDOUT_BYTES',len(out))
              traces=[line for line in err.splitlines() if line.startswith('+ ')]
              print('OVH_PATCHED_PROBE_TRACE_COUNT',len(traces))
              for line in traces[-8:]:
                  m=re.match(r'\+\s*(\S+)',line)
                  p=(m.group(1).rsplit('/',1)[-1] if m else 'OTHER')
                  print('OVH_PATCHED_PROBE_LAST_COMMAND',p if p in allowed else 'OTHER')
              recognized=('ModuleNotFoundError','ImportError','FileNotFoundError',
                          'PermissionError','SyntaxError','IndentationError','ConnectionRefusedError',
                          'OperationalError','KeyError','ValueError','TypeError','RuntimeError',
                          'OSError','NameError','AttributeError','AssertionError')
              print('OVH_PATCHED_PROBE_EXCEPTION_TYPES',
                    ','.join(t for t in recognized if re.search(r'\b'+re.escape(t)+r'\b',err)) or 'NONE')
              for label,phrase in [('TRACEBACK','Traceback (most recent call last)'),
                                   ('BASE64_INVALID','base64: invalid input'),('MISSING_FILE','no such file'),
                                   ('MISSING_MODULE','no module named'),('DATABASE','connection refused'),
                                   ('PASSWORD','password authentication failed'),('BIND','address already in use'),
                                   ('SHELL_SYNTAX','syntax error'),('NO_SPACE','no space left'),
                                   ('PERMISSION','permission denied'),('PIP','pip install')]:
                  if phrase.lower() in err.lower(): print('OVH_PATCHED_PROBE_DIAG',label)
          except subprocess.TimeoutExpired:
              print('OVH_PATCHED_PROBE_STAYED_RUNNING_35_SECONDS')
          PY
          )"
      - name: Start production-pinned planner, auth, GA and application
        shell: bash
        run: |
          set -euo pipefail
          cfg=/opt/liftorbit/full.compose.yml
          sudo docker compose -f "$cfg" up -d --build planner-gateway auth-gateway ga-worker app
          echo 'INTEGRATION_FULL_COMPOSE_UP_COMPLETED'
          for name in planner-gateway auth-gateway ga-worker app; do
            cid=$(sudo docker compose -f "$cfg" ps -q "$name")
            test -n "$cid"
            state=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$cid")
            echo "INTEGRATION_SERVICE_HEALTH $name=$state"
            test "$state" = healthy
          done
          curl --fail --silent --max-time 12 http://127.0.0.1:18082/__bridge_health > /dev/null
          status=$(curl -s -o /dev/null -w '%{http_code}' -m 12 http://127.0.0.1:18082/)
          test "$status" = 200 || test "$status" = 302 || test "$status" = 303
          echo "OVH_SIX_SERVICE_INTEGRATION_SMOKE_OK http_status=$status"
      - name: Sanitize failure diagnostics (no raw user-data logs)
        if: failure()
        shell: bash
        run: |
          set +e
          cfg=/opt/liftorbit/full.compose.yml
          for name in postgres-main postgres-auth planner-gateway auth-gateway ga-worker app; do
            cid=$(sudo docker compose -f "$cfg" ps -q "$name" 2>/dev/null)
            if test -n "$cid"; then
              docker inspect --format 'SERVICE_HEALTH_CHECK {{.Name}} {{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}} OOM={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' "$cid"
            else
              echo "SERVICE_HEALTH_CHECK $name MISSING"
            fi
          done
      - name: Classify container startup errors without exposing logs
        if: failure()
        shell: bash
        run: |
          set +e
          root=/opt/liftorbit/full.compose.yml
          for service in planner-gateway auth-gateway ga-worker app; do
            cid=$(sudo docker compose -f "$root" ps -q "$service" 2>/dev/null)
            if test -z "$cid"; then continue; fi
            log="$RUNNER_TEMP/staging-private-$service.log"
            docker logs --tail 150 "$cid" > "$log" 2>&1
            python3 - "$service" "$log" <<'PY'
          import re,sys,pathlib,collections
          name=sys.argv[1]
          s=pathlib.Path(sys.argv[2]).read_text(errors='replace')
          matches=re.findall(r'(?m)^([A-Za-z_][A-Za-z_0-9]*(?:Error|Exception))(?::|$)',s)
          print('SAFE_RUNTIME_ERROR_CLASS',name,','.join(dict.fromkeys(matches)) or 'UNKNOWN')
          for line in s.splitlines():
              if re.fullmatch(r'OVH_GATEWAY_BOOT_(?:EXCEPTION|MISSING_KEY|MISSING_MODULE|SYSTEM_EXIT_CODE|SUBPROCESS_FAILED)(?: [A-Za-z0-9_.=-]{1,72}){1,3}',line):
                  print('SAFE_PLANNER_CLASSIFICATION',line)
              if re.fullmatch(r'OVH_GATEWAY_SUBPROCESS_(?:FAILED|DIAG_ERROR)(?: [A-Za-z0-9_.=-]{1,72}){1,3}',line):
                  print('SAFE_PLANNER_CLASSIFICATION',line)
              if re.fullmatch(r'OVH_GATEWAY_APT_PACKAGE_NAMES [a-zA-Z0-9_,.+-]{1,200}',line):
                  print('SAFE_PLANNER_CLASSIFICATION',line)
              if re.fullmatch(r'OVH_GATEWAY_APT_COMMAND_SHAPE (?:[a-zA-Z0-9_=]+ ){0,5}[a-zA-Z0-9_=]+',line):
                  print('SAFE_PLANNER_CLASSIFICATION',line)
              if re.fullmatch(r'OVH_GATEWAY_SHELL_SEQUENCE [A-Za-z0-9_,.-]{1,180}',line):
                  print('SAFE_PLANNER_CLASSIFICATION',line)
              if re.fullmatch(r'OVH_GATEWAY_SHELL_ERROR_CLASS [A-Z_]{1,40}',line):
                  print('SAFE_PLANNER_CLASSIFICATION',line)
              if line in ('OVH_COMPAT_APT_SKIP_UPDATE','OVH_COMPAT_APT_SKIP_INSTALL','OVH_COMPAT_APT_FALLBACK'):
                  print('SAFE_PLANNER_CLASSIFICATION',line)
          m=re.search(r"No module named '([a-zA-Z_][a-zA-Z0-9_.]{0,45})'",s)
          if m: print('SAFE_MISSING_IMPORT',name,m.group(1))
          for label,pattern in [
              ('POSTGRES_AUTH','password authentication failed'),
              ('DATABASE_DNS','could not translate host name'),
              ('DATABASE_CONNECT','connection refused'),
              ('MISSING_ENV','KeyError:'),
              ('SOURCE_HASH','sha256 mismatch'),
              ('SOURCE_BOOTSTRAP','PP_GENERIC'),
              ('INVALID_JSON','JSONDecodeError'),
              ('SYNTAX','SyntaxError'),
              ('MEMORY','MemoryError'),
              ('LIBRARY','ModuleNotFoundError'),
          ]:
              if pattern.lower() in s.lower(): print('SAFE_STARTUP_DIAG',name,label)
          PY
            rm -f "$log"
          done
      - name: Remove ephemeral databases and secrets
        if: always()
        run: |
          sudo docker compose -f /opt/liftorbit/full.compose.yml down --volumes --remove-orphans > /dev/null 2>&1 || true
          sudo rm -rf /opt/liftorbit "$RUNNER_TEMP/liftorbit-integration"
