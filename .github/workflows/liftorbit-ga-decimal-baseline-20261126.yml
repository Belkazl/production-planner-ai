name: Verify real planner launch and SSE before decimal release
on:
  push:
    branches: [fix/ga-decimal-progress-20261126]
    paths: [.github/workflows/liftorbit-ga-decimal-baseline-20261126.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/liftorbit-decimal-test --no-save --no-package-lock playwright-core@1.58.2
      - name: Observe native UI startup and real SSE on current version without deployment
        run: |
          node --check ops/ovh/ga-decimal-progress-20261126/browser-live.mjs
          DECIMAL_BASELINE=1 node ops/ovh/ga-decimal-progress-20261126/browser-live.mjs
