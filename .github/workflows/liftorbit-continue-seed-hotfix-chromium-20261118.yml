name: LiftOrbit Chromium acceptance sanitized Continue legacy seed
on:
  workflow_run:
    workflows:
      - LiftOrbit guarded OVH sanitize legacy Continue seed and restore missing orders
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chromium:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify sanitized Continue production release succeeded
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'preflight=success' ops/ovh/test-results/ga-continue-seed-hotfix-release-latest.txt
          grep -Fqx 'rollout=success' ops/ovh/test-results/ga-continue-seed-hotfix-release-latest.txt
          grep -Fqx 'public_health=success' ops/ovh/test-results/ga-continue-seed-hotfix-release-latest.txt
      - name: Install isolated Chromium
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Click native Continue after reload and assert no untrusted score is sent
        id: browser
        shell: bash
        run: node ops/ovh/continuation-seed-ui-20261118/chromium.mjs
      - uses: actions/checkout@v4
        if: always()
      - name: Record live browser acceptance
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          QA: ${{ steps.browser.outcome }}
        run: |
          set -euo pipefail
          file=ops/ovh/test-results/ga-continue-seed-hotfix-chromium-latest.txt
          mkdir -p "$(dirname "$file")"
          printf 'workflow_run=%s\nchromium_acceptance=%s\n' "$RUN_ID" "$QA" > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record sanitized Continue seed Chromium acceptance'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            echo 'ACCEPTANCE_REPORT_PUSH_UNAVAILABLE'
            exit 0
          fi
