name: LiftOrbit legacy browser progress poll source inspection
on:
  push:
    branches: [fix/sse-zero-rest-progress-poll-20261120]
permissions: {contents: read}
concurrency:
  group: liftorbit-source-inspect-no-deploy
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read native UI modules and list all progress polling owners
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          scp -q -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST:/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/current/restart-optimizer-ui.js" "$RUNNER_TEMP/native-ui.js"
          echo "=== APP_HTTP_STATUS_CALLS_BY_FILE ==="
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" bash -s <<'REMOTE'
          set -u
          base=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/current
          find "$base" -maxdepth 3 -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.html' \) -not -path '*/node_modules/*' -not -path '*/.git/*' -size -3M | while IFS= read -r f; do
            matches=$(grep -nc 'api/plan-progress' "$f" 2>/dev/null || true)
            if [ "$matches" != 0 ] && [ -n "$matches" ];then
              echo "SOURCE ${f#$base/} count=$matches"
              grep -nE 'plan-progress|setInterval|setTimeout' "$f" | head -n 35 | cut -c1-200 || true
            fi
          done
          REMOTE
          echo "=== ALL_PROGRESS_REFS ==="
          grep -n -C 3 'plan-progress' "$RUNNER_TEMP/native-ui.js" | head -n 300 | cut -c1-200 || true
          echo "=== MODULE_OWNERS ==="
          UI="$RUNNER_TEMP/native-ui.js" node - <<'JS'
          const fs=require('node:fs'),s=fs.readFileSync(process.env.UI,'utf8');
          const blocks=[...s.matchAll(/;\(function\s+([a-zA-Z0-9_$]+)\s*\(\)\s*\{/g)];
          const rows=[];
          for(let i=0;i<blocks.length;i++){
           const a=blocks[i].index,b=i+1<blocks.length?blocks[i+1].index:s.length;
           const src=s.slice(a,b),name=blocks[i][1];
           if(/plan-progress|setInterval|setTimeout|__PP_.*PROGRESS|optimizer-started/.test(src)){
             rows.push({name,lines:src.split('\n').length,progress:(src.match(/plan-progress/g)||[]).length,
              intervals:(src.match(/setInterval/g)||[]).length,timers:(src.match(/setTimeout/g)||[]).length,
              hasDispose:/dispose\s*\(/.test(src),hasStop:/stop\s*\(/.test(src),
              nativeFetch:/originalFetch|nativeFetch|fetch\.bind|\.fetch\.bind/.test(src)});
           }
          }
          console.log(JSON.stringify(rows,null,2));
          const xs=[...s.matchAll(/.{0,110}\/api\/plan-progress.{0,170}/g)].slice(0,35);
          console.log('PROGRESS_CALL_CONTEXTS',xs.map(x=>x[0].trim()).join('\n'));
          JS
          echo "=== PUBLIC_BROWSER_SCRIPT_STATUS_HANDLERS ==="
          npm install --no-save --no-package-lock playwright-core@1.57.0 >/dev/null 2>&1
          node - <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({headless:true,channel:'chrome',args:['--no-sandbox']});
            try{
              const p=await b.newPage();
              await p.goto('https://app.liftorbit.app',{waitUntil:'domcontentloaded',timeout:30000});
              const a=await p.evaluate(()=>{
                const out=[];
                for(const [i,x] of [...document.scripts].entries()){
                  const s=x.textContent||'';
                  const keys=['plan-progress','__PP_','setInterval','optimizer-started'];
                  const contexts=[];
                  for(const k of keys){let pos=-1,n=0;while((pos=s.indexOf(k,pos+1))>=0&&n++<7)contexts.push({k,around:s.slice(Math.max(0,pos-100),Math.min(s.length,pos+130)).replace(/\s+/g,' ')})}
                  out.push({i,src:x.src.split('?')[0].slice(-85),inlineBytes:s.length,contexts:contexts.slice(0,12)});
                }
                return out;
              });
              console.log(JSON.stringify(a,null,2).slice(0,16000));
            }finally{await b.close()}
          })().catch(e=>{console.error('BROWSER_AUDIT_FAILED',String(e));process.exitCode=1});
          JS
