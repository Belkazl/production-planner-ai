name: LiftOrbit inspect safe live error-log access for second GA gateway crash
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-second-502-runtime-logs-readonly-20261119.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check nonmutating service log access and deployment response paths without secrets
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = 51.255.163.121 && test "$USER" = liftorbit-ci
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          echo SUDO_PERMISSIONS
          sudo -n -l 2>/dev/null | grep -F '/usr/local/sbin/liftorbit-ops' | cut -c1-300 || true
          echo OPS_SCRIPT_MODE
          stat -c '%a %U %G %n' /usr/local/sbin/liftorbit-ops || true
          echo SYSTEM_LOG_PERMISSIONS
          for f in /var/log/nginx/error.log /var/log/nginx/access.log /var/log/syslog /var/log/caddy/caddy.log; do
            if test -r "$f"; then echo "READABLE $f"; else echo "INACCESSIBLE $f"; fi
          done
          echo DOCKER_SOCKET
          stat -c '%a %U %G' /var/run/docker.sock 2>/dev/null || true
          echo BUN_RUNNING_PROCESSES
          ps -C bun -o pid=,rss=,etimes=,comm= | head -n 14
          echo DEPLOY_CURRENT_SOURCE
          cd "$HOME/liftorbit-migration/sources/ovh-app/current"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.ts")
          print("INDEX_EXISTS",p.exists())
          if p.exists():
            lines=p.read_text(errors='replace').splitlines()
            terms=['APS_BRIDGE_ERROR','ppPythonGAUpstream.fetch','ppAuthenticatedHandler','ppTenantModel','handler(req)','Bun.serve','plan-progress']
            for i,line in enumerate(lines):
              if not any(x in line for x in terms):continue
              for j in range(max(0,i-3),min(len(lines),i+5)):
                v=lines[j]
                if re.search(r'secret|password|token|credential|cookie|authorization|private.key|process.env|bun.env|database_url|https?://|email',v,re.I):v='[redacted]'
                print('INDEX',j+1,v[:220])
          PY
          echo HOST_HEALTH
          curl -sS -o /dev/null -w 'health=%{http_code}\n' --max-time 12 https://app.liftorbit.app/__bridge_health
          REMOTE
