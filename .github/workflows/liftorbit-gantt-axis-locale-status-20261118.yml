name: LiftOrbit inspect Gantt axis locale hotfix release status
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-gantt-axis-locale-status-20261118.yml
permissions:
  actions: read
  contents: write
jobs:
  state:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Save guarded Gantt axis patch run status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file=ops/ovh/test-results/gantt-axis-locale-runs-latest.txt
          mkdir -p "$(dirname "$file")"
          gh api 'repos/Belkazl/production-planner-ai/actions/workflows/liftorbit-ovh-gantt-axis-locale-hotfix-20261118.yml/runs?per_page=5' --jq '.workflow_runs[] | "run_id=\(.id) status=\(.status) conclusion=\(.conclusion) sha=\(.head_sha[0:10])"' > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record shared Gantt axis hotfix run state'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
          fi
