name: LiftOrbit compare native Continue 502 with exact same-body replay
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-native-header-compare-20261120.yml
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: First 886-operation plan, native Continue, then exact-body direct POST when safe
        shell: bash
        env:
          FREEZE_TEST_MODE: skip-gantt
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.57.0
          node ops/ovh/ga-post502-isolation-20261119/generate-native-header-compare.mjs
          node --check ops/ovh/ga-post502-isolation-20261119/_native-header-compare.mjs
          node ops/ovh/ga-post502-isolation-20261119/_native-header-compare.mjs