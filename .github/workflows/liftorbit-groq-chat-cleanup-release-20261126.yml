name: Remove legacy chat collapse and demo notice
on:
  push:
    branches: [fix/groq-chat-cleanup-20261126]
    paths:
      - .github/workflows/liftorbit-groq-chat-cleanup-release-20261126.yml
      - ops/ovh/groq-chat-cleanup-20261126/release.sh
      - ops/ovh/groq-chat-cleanup-20261126/patch-cleanup.mjs
      - ops/ovh/groq-chat-cleanup-20261126/browser.mjs
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/liftorbit-groq-test --no-save --no-package-lock playwright-core@1.58.2
      - name: Verify legacy cleanup and retained chat behavior before release
        run: |
          set -euo pipefail
          node --check ops/ovh/groq-chat-cleanup-20261126/patch-cleanup.mjs
          bash -n ops/ovh/groq-chat-cleanup-20261126/release.sh
          node ops/ovh/groq-chat-cleanup-20261126/browser.mjs
      - name: Deploy cleanup only after passing browser regression
        env:
          DEPLOY_HOST: ${{ vars.OVH_HOST }}
          DEPLOY_USER: ${{ vars.OVH_USER }}
          DEPLOY_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: bash ops/ovh/groq-chat-cleanup-20261126/release.sh
