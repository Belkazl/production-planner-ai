name: LiftOrbit inspect main and secondary Gantt engines for unification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-gantt-engine-audit-20261118.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only Gantt source structure in disposable account
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/liftorbit-gantt-engines.txt"
          import http.cookiejar,urllib.request,json,uuid,secrets,re
          base='https://app.liftorbit.app'
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          payload=json.dumps({'email':'gantt-engine-audit-'+uuid.uuid4().hex+'@liftorbit.invalid','password':secrets.token_urlsafe(26),'company':'Disposable Gantt renderer audit'}).encode()
          req=urllib.request.Request(base+'/api/auth/register',data=payload,method='POST',headers={'Content-Type':'application/json','Accept':'application/json','Origin':base})
          with op.open(req,timeout=35) as r:print('register='+str(r.status))
          with op.open(base+'/',timeout=35) as r:
            html=r.read(12000000).decode('utf8','replace')
            print('authenticated='+str(r.status),'length='+str(len(html)))
          for term in ['function renderPlan(', 'function renderGantt(', 'function drawGantt(', 'function renderEqGantt(', 'function renderOrders(', 'function ppTab(', 'function renderTabs(', 'function renderTab(', 'pp3-secondary-gantts-js', 'id="ppTabsView"','id="ganttContent"', 'class="ppt ppTabGantt"', 'function renderEmployee','Equipment utilization','ppTabGantt']:
            hits=[m.start() for m in re.finditer(re.escape(term),html)]
            print('\nTARGET',term,'count',len(hits))
            for i in hits[:2]:
              before=600 if term in ('function renderPlan(', 'function renderGantt(', 'function drawGantt(', 'function renderEqGantt(') else 200
              after=8800 if term=='function renderPlan(' else 1500
              print('AT',i,repr(html[max(0,i-before):min(len(html),i+after)])[:10000])
          for term in ['ppGanttToolV2','PP_GANTT_TOOL_V2','__PP_GANTT','ppGanttOperationDetails','function buildGanttSkeleton','function renderGenericPlan','function renderGenericGantt','function ppGantt', 'ppGanttTool', 'function renderEquipment', '#ppTabsView']:
            hits=[m.start() for m in re.finditer(re.escape(term),html,re.I)]
            print('\\nCORE',term,'hits',len(hits))
            for i in hits[:5]:print('CTX',i,repr(html[max(0,i-500):min(len(html),i+3200)])[:3800])
          for m in re.finditer(r'<script([^>]*)>([\\s\\S]*?)</script>',html,re.I):
            content=m.group(2)
            if 'ppGanttToolV2' not in content:continue
            print('\\nMAIN_GANTT_SCRIPT',m.start(),'bytes',len(content),'attrs',repr(m.group(1)))
            print('MAIN_SCRIPT_START',repr(content[:8500]))
            for match in list(re.finditer(r'(?:function\\s+[A-Za-z_$][\\w$]*\\s*\\(|(?:const|let|var)\\s+[A-Za-z_$][\\w$]*\\s*=\\s*(?:function|\\(|[a-zA-Z_]+\\s*=>))',content))[:90]:
              i=match.start();print('MAIN_FUNCTION',i,repr(content[i:i+300]))
            for key in ['function render(', 'function draw(', 'function build(', 'function paint(', 'function setPlan(', 'function rows(', 'renderPlan(', 'renderGantt(', 'function refresh(', 'querySelector(', 'insertAdjacent', 'appendChild(', 'ppGanttToolV2','__PP_GANTT']:
              hits=[x.start() for x in re.finditer(re.escape(key),content)]
              print('MAIN_REF',key,len(hits))
              for i in hits[:5]:print('MAIN_CONTEXT',i,repr(content[max(0,i-450):i+1200])[:1700])
          for pattern in [r'<script[^>]*src=["\']([^"\']+)',r'<div[^>]+id=["\'](?:ganttContent|ppTabsView)["\'][^>]*>',r'#[a-zA-Z][\w-]*(?:gantt|Gantt)[\w-]*\s*\{[^}]{0,260}\}']:
            matches=re.findall(pattern,html,re.I)
            print('\nPATTERN',pattern,'count',len(matches))
            for item in matches[:25]:print('CSS_OR_TAG',repr(item)[:450])
          PY
      - uses: actions/checkout@v4
        if: always()
      - name: Save Gantt code excerpts only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          target=ops/ovh/test-results/gantt-engines-html-audit-20261118.txt
          mkdir -p "$(dirname "$target")"
          if test -s "$RUNNER_TEMP/liftorbit-gantt-engines.txt"; then cp "$RUNNER_TEMP/liftorbit-gantt-engines.txt" "$target"; else echo "audit_unavailable" > "$target"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: audit real Gantt renderers and tab containers'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
          fi
