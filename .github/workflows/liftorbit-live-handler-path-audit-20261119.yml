name: LiftOrbit read-only locate active 502 handler source
on:
  push:
    branches: [main]
    paths: [.github/workflows/liftorbit-live-handler-path-audit-20261119.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Enumerate safe source paths and route response branches
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$HOME/liftorbit-migration/sources/ovh-app/current"
          python3 - <<'PY'
          from pathlib import Path
          import re
          print('SOURCE_ROOT_JS')
          for p in Path('.').iterdir():
            if p.is_file() and p.suffix.lower() in ('.js','.mjs','.ts','.json','.toml','.yaml'):
              print('PATH',str(p),p.stat().st_size)
          print('SOURCE_DOCKERFILE')
          for i,l in enumerate(Path('Dockerfile').read_text().splitlines(),1):
            if re.search('secret|token|password|credential|authorization',l,re.I):l='[redacted]'
            print('DOCKER',i,l[:180])
          print('SOURCE_502_CANDIDATES')
          shown=0
          for p in Path('.').rglob('*'):
            if p.is_dir() or p.suffix not in ('.ts','.mjs','.js'):continue
            if any(x in p.parts for x in ('node_modules','.git','tests','ga_python_workers')):continue
            if p.stat().st_size>2500000:continue
            if shown>=100:break
            ls=p.read_text(errors='replace').splitlines()
            matches=[(i,l) for i,l in enumerate(ls) if re.search(r'\b502\b|Bad Gateway|createPythonGAUpstream|api/plan',l,re.I)]
            if matches:
              print('MATCH_FILE',str(p),len(matches))
              for i,l in matches[:8]:
                if re.search(r'password|token|secret|credential|authorization|private.key|database_url|cookie|email',l,re.I):l='[redacted]'
                print('MATCH',i+1,l[:190])
              shown+=1
          PY
          REMOTE