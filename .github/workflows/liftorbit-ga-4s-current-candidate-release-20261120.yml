name: LiftOrbit eliminate progress and Gantt freezes on large plans
# rerun after cross-realm contract assertion correction
on:
  push:
    branches: [main]
    paths: [.github/workflows/liftorbit-ga-4s-current-candidate-release-20261120.yml]
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Test actual 14x10 first-operation projection and exact production UI source
        id: preflight
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121" && test "$USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20)
          base=/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/current
          mkdir -p old new
          for file in auth-runtime.js restart-optimizer-ui.js; do
            scp -q "${opts[@]}" "$USER@$HOST:$base/$file" "old/$file"
            cp "old/$file" "new/$file"
          done
          node ops/ovh/ga-jank-fix-20261120/patch.mjs new
          node --check new/auth-runtime.js
          node --check new/restart-optimizer-ui.js
          node ops/ovh/four-second-fog-preview-20261120/test-contract.cjs
          node ops/ovh/ga-jank-fix-20261120/test-async.cjs
          node ops/ovh/ga-jank-fix-20261120/build-live-qa.mjs
          node --check ops/ovh/ga-jank-fix-20261120/_live-qa.mjs
          for file in auth-runtime.js restart-optimizer-ui.js; do
            sha256sum "old/$file" | cut -d' ' -f1 > "$RUNNER_TEMP/old-$file.sha"
            sha256sum "new/$file" | cut -d' ' -f1 > "$RUNNER_TEMP/new-$file.sha"
          done
          command -v google-chrome
          npm install --no-save --no-package-lock playwright-core@1.57.0
          echo FOG_CURRENT_CANDIDATE_TWOFILE_PREFLIGHT_PASS
      - name: Deploy two SHA-verified files and rollback on failed service update
        id: rollout
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          opts=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20)
          root=/home/liftorbit-ci/liftorbit-migration
          for file in auth-runtime.js restart-optimizer-ui.js; do
            scp -q "${opts[@]}" "new/$file" "$USER@$HOST:$root/sources/ovh-app/fog-current-$file.next"
          done
          ssh "${opts[@]}" "$USER@$HOST" bash -s --            "$(cat "$RUNNER_TEMP/old-auth-runtime.js.sha")" "$(cat "$RUNNER_TEMP/new-auth-runtime.js.sha")"            "$(cat "$RUNNER_TEMP/old-restart-optimizer-ui.js.sha")" "$(cat "$RUNNER_TEMP/new-restart-optimizer-ui.js.sha")" <<'REMOTE'
          set -euo pipefail
          root="$HOME/liftorbit-migration"
          base="$root/sources/ovh-app"
          backup="$root/patch-backups/fog-current-candidate-twofile-20261120"
          files=("$base/current/auth-runtime.js" "$base/current/restart-optimizer-ui.js")
          staged=("$base/fog-current-auth-runtime.js.next" "$base/fog-current-restart-optimizer-ui.js.next")
          names=(auth-runtime.js restart-optimizer-ui.js)
          expected=("$@")
          test "${#expected[@]}" -eq 4
          sha(){ sha256sum "$1" | cut -d' ' -f1; }
          for i in 0 1; do
            test "$(sha "${files[$i]}")" = "${expected[$((2*i))]}"
            test "$(sha "${staged[$i]}")" = "${expected[$((2*i+1))]}"
          done
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          mkdir -p "$backup"
          for i in 0 1; do
            cp -p "${files[$i]}" "$backup/${names[$i]}"
            test "$(sha "$backup/${names[$i]}")" = "${expected[$((2*i))]}"
          done
          rollback(){
            trap - ERR
            for i in 0 1; do cp -p "$backup/${names[$i]}" "${files[$i]}" || true; done
            sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/rollback-private.log" 2>&1 || true
            echo FOG_TWOFILE_DEPLOY_ROLLBACK_ATTEMPTED
          }
          trap rollback ERR
          for i in 0 1; do mv "${staged[$i]}" "${files[$i]}"; done
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/update-private.log" 2>&1
          healthy=no
          for attempt in $(seq 1 28); do
            if sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null 2>&1; then healthy=yes; break; fi
            sleep 5
          done
          test "$healthy" = yes
          for i in 0 1; do test "$(sha "${files[$i]}")" = "${expected[$((2*i+1))]}"; done
          trap - ERR
          echo FOG_TWOFILE_PRODUCTION_INSTALLED
          REMOTE
      - name: Verify public service health and private candidate endpoint
        id: health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            health=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/__bridge_health || true)
            guest=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/api/auth/me || true)
            snapshot=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 'https://app.liftorbit.app/api/ga-candidate-snapshot?ppLight=1' || true)
            if [[ "$health" = 200 && "$guest" = 401 && "$snapshot" = 401 ]]; then echo FOG_PUBLIC_AUTH_BOUNDARY_PASS; exit 0; fi
            sleep 4
          done
          exit 1
      - name: Verify 886-operation live GA, real 4-second 140-op candidate and fog, full 100, second run
        id: live
        shell: bash
        env:
          FREEZE_TEST_MODE: deployed
        run: |
          set -euo pipefail
          node ops/ovh/ga-jank-fix-20261120/_live-qa.mjs
          echo JANK_NONBLOCKING_4SECOND_GANTT_AND_100_PASS
      - name: Restore both exact previous files if real browser QA fails
        if: ${{ failure() && steps.rollout.outcome == 'success' }}
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          root="$HOME/liftorbit-migration"
          backup="$root/patch-backups/fog-current-candidate-twofile-20261120"
          base="$root/sources/ovh-app/current"
          test -f "$backup/auth-runtime.js"
          test -f "$backup/restart-optimizer-ui.js"
          cp -p "$backup/auth-runtime.js" "$base/auth-runtime.js"
          cp -p "$backup/restart-optimizer-ui.js" "$base/restart-optimizer-ui.js"
          sudo -n /usr/local/sbin/liftorbit-ops update > "$backup/qa-rollback-private.log" 2>&1
          sudo -n /usr/local/sbin/liftorbit-ops smoke >/dev/null
          echo FOG_TWOFILE_ROLLBACK_VERIFIED
          REMOTE
      - name: Summary
        if: always()
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          ROLLOUT: ${{ steps.rollout.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          LIVE: ${{ steps.live.outcome }}
        run: echo "JANK_RESOLVED preflight=$PREFLIGHT rollout=$ROLLOUT health=$HEALTH live=$LIVE"