name: LiftOrbit live browser Start again unlock after status failures
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-reconnect-unlock-live-qa-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'test(liftorbit): confirm Start again unlock and safe 409 reattachment on OVH')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Check transient GA status failure, enabled Start again, server 409 rejoin, reload
        shell: bash
        run: node ops/ovh/ga-reconnect-unlock-live-20261117.mjs
      - name: Upload test screenshot with disposable account only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-again-unblocked-after-ga-status-error
          path: ga-start-again-unlocked-20261117.png
          retention-days: 3
          if-no-files-found: ignore
