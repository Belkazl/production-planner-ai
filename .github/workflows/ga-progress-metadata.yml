name: Diagnose GA progress
on:
  push:
    branches: [fix/ga-99-progress-status-20261012]
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Read public optimization progress metadata
        run: |
          python3 - <<'PY'
          import json,urllib.request
          u='https://aps-setup-bridge-candidate-v2-production.up.railway.app/api/plan-progress'
          with urllib.request.urlopen(u,timeout=30) as r:
            d=json.load(r)
          out={k:v for k,v in d.items() if isinstance(v,(str,int,float,bool)) or v is None}
          print('PUBLIC_PROGRESS_METADATA',json.dumps(out,ensure_ascii=False))
          PY
