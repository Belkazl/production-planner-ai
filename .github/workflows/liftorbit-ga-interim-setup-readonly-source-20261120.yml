name: Read GA interim setup source without changing server
on:
  push:
    branches: [diagnostics/ga-preview-changeover-source-20261120]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read source of interim plans and setup operation attachment
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" python3 - <<'PY'
          from pathlib import Path
          root=Path('/home/liftorbit-ci/liftorbit-migration/sources/current/ga/ga_workers')
          files=['full_runtime_adapter.py','compile_legacy_ga.py','manager.py','server.py']
          targets=('setup_operations','candidate_preview','best_preview','on_progress','progress_callback','progress_fn','checkpoint','intermediate','best_plan','generation')
          for name in files:
            path=root/name
            if not path.is_file():continue
            lines=path.read_text().splitlines()
            print('GA_FILE',name,'LINES',len(lines))
            matches=[]
            for i,line in enumerate(lines):
              if any(x in line.lower() for x in targets):matches.append(i)
            ranges=[]
            for i in matches[:110]:
              a=max(0,i-3);b=min(len(lines),i+4)
              if ranges and a<=ranges[-1][1]:
                ranges[-1]=(ranges[-1][0],max(b,ranges[-1][1]))
              else:ranges.append((a,b))
            for a,b in ranges[:42]:
              print('GA_SOURCE_RANGE',name,a+1,b)
              for j in range(a,b):
                print('GA_SOURCE',j+1,lines[j][:215])
          PY
          echo "=== OVH DEPLOY PRECHECK READONLY ==="
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" bash -s <<'REMOTE'
          set +e
          root="$HOME/liftorbit-migration"
          base="$root/sources/ovh-app"
          echo DIAG_CURRENT_SHA
          sha256sum "$base/current/python-ga-upstream.mjs" | cut -d' ' -f1
          echo DIAG_STAGE_EXISTS
          for f in "$base/first-ten-visibility-20261120.next" "$base/sse-first-ten-ops-20261120-python-ga-upstream.mjs.next" "$base/sse-detached-setups-20261120-python-ga-upstream.mjs.next";do
            if test -r "$f";then echo "exists $(basename "$f")";else echo "missing $(basename "$f")";fi
          done
          echo DIAG_WRITABLE_ROOT "$([[ -w "$base" ]] && echo yes || echo no)"
          echo DIAG_WRITABLE_CURRENT "$([[ -w "$base/current/python-ga-upstream.mjs" ]] && echo yes || echo no)"
          echo DIAG_LIFTORBIT_OPS_SMOKE
          sudo -n /usr/local/sbin/liftorbit-ops smoke > /dev/null 2>&1
          echo DIAG_SMOKE_EXIT "$?"
          echo DIAG_SUDO_LIFTORBIT_OPS
          sudo -n -l /usr/local/sbin/liftorbit-ops >/dev/null 2>&1
          echo DIAG_SUDO_OPS_EXIT "$?"
          REMOTE
          echo "=== GANTT RENDERER CHANGEOVER CODE ==="
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" python3 - <<'PY'
          from pathlib import Path
          p=Path("/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/current")
          for name in ("auth-runtime.js","restart-optimizer-ui.js"):
            src=(p/name).read_text()
            patterns=["function renderPlan(", "function renderPlanV2(", "function ppUnifiedGanttV2(", "is_setup","setup_operation","phase==='setup'","phase === 'setup'","pg2-bar","setup"]
            print("GANTT_SOURCE",name,"LEN",len(src))
            for needle in patterns:
              indices=[]
              start=0
              while (pos:=src.find(needle,start))>=0:
                indices.append(pos)
                start=pos+len(needle)
              print("GANTT_NEEDLE",needle,"COUNT",len(indices))
              for i in indices[:2]:print("GANTT_EXCERPT",repr(src[max(0,i-470):i+1500]))
          PY
          echo "=== BRIDGE CHECKPOINT TRANSFORM SOURCE ==="
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" python3 - <<'PY'
          from pathlib import Path
          src=(Path('/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/current')/'python-ga-upstream.mjs').read_text()
          for phrase in ['publicCheckpoint=', 'publicPlan=', 'rememberWorkerBest=', 'verifiedWorkerCheckpoint=', 'setupOperationsDropped=', 'const publicCheckpoint','publicPlan(status.candidate_preview)']:
              pos=src.find(phrase)
              print('PUBLIC_PLAN_TRANSFORM',repr(phrase),'AT',pos)
              if pos>=0:print('PUBLIC_PLAN_EXCERPT',repr(src[max(0,pos-180):pos+3800]))
          PY
          echo "=== SELECTED STATUS AND PUBLIC PLAN BODY ==="
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" python3 - <<'PY'
          from pathlib import Path
          src=(Path('/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/current')/'python-ga-upstream.mjs').read_text()
          for phrase in ['const publicPlan=', 'function publicPlan(', 'const owned=', 'async function progress(req){', "const worker=await call(", "best_preview:state.best", "candidate_preview:state.candidate"]:
              pos=src.find(phrase)
              print('BRIDGE_TARGET',repr(phrase),'AT',pos)
              if pos>=0:print('BRIDGE_TARGET_BODY',repr(src[max(0,pos-280):pos+6100]))
          PY
          echo "=== APP PLAN PREVIEW BRIDGE READONLY ==="
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" python3 - <<'PY'
          from pathlib import Path
          root=Path('/home/liftorbit-ci/liftorbit-migration/sources/ovh-app/current')
          for file in ['python-ga-upstream.mjs','auth-runtime.js']:
              p=root/file
              src=p.read_text()
              needles=['async function progress(','function progress(','best_preview','candidate_preview','setup_operations','slice(0,70)','slice(0,140)','bounded','lightweight','function sanitize','_pp_preview']
              print('BRIDGE_FILE',file,'SIZE',len(src))
              for needle in needles:
                  n=src.count(needle)
                  print('BRIDGE_NEEDLE',needle,n)
                  if n:
                      start=src.index(needle)
                      print('BRIDGE_EXCERPT',repr(src[max(0,start-350):min(len(src),start+2350)]))
          PY
