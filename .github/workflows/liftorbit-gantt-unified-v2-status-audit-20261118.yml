name: LiftOrbit inspect guarded unified Gantt release status
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-gantt-unified-v2-status-audit-20261118.yml
permissions:
  actions: read
  contents: write
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Record status of unified Gantt release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file=ops/ovh/test-results/gantt-unified-v2-runs-latest.txt
          mkdir -p "$(dirname "$file")"
          gh api 'repos/Belkazl/production-planner-ai/actions/workflows/liftorbit-ovh-gantt-unified-v2-release-20261118.yml/runs?per_page=7' --jq '.workflow_runs[] | "run_id=\(.id) status=\(.status) conclusion=\(.conclusion) sha=\(.head_sha[0:10])"' > "$file"
          chrome=ops/ovh/test-results/gantt-unified-v2-chrome-runs-latest.txt
          # Second diagnostic run checks app navigation visibility before clicking.
          gh api 'repos/Belkazl/production-planner-ai/actions/workflows/liftorbit-gantt-unified-v2-chrome-20261118.yml/runs?per_page=7' --jq '.workflow_runs[] | "run_id=\(.id) status=\(.status) conclusion=\(.conclusion) sha=\(.head_sha[0:10])"' > "$chrome"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file" "$chrome"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record Gantt unification release job states'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
          fi
