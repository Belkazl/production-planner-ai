name: LiftOrbit public GA preview and duration consistency diagnostic
# Verify newly deployed previews with a disposable account; no customer data is accessed.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/liftorbit-ga-preview-public-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'test(liftorbit): verify production best and candidate GA previews')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ddcd58045043c5e35cd0234e617047c8980541e
          path: ops
          persist-credentials: false
      - name: Check public HTTPS and login protection
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://app.liftorbit.app/__bridge_health >/dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://app.liftorbit.app/api/auth/me)
          test "$code" = 401
          echo 'PUBLIC_GA_PREVIEW_HEALTH_AND_AUTH_OK'
      - name: Require actual mid-run best and candidate previews on isolated real GA job
        shell: bash
        env:
          PP_REQUIRE_PREVIEW: "1"
        run: |
          python3 ops/ops/ovh/probe-live-ga-previews.py
          echo 'PUBLIC_GA_INTERMEDIATE_BEST_AND_CANDIDATE_ACCEPTANCE_OK'
