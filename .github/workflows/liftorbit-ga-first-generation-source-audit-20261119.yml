name: LiftOrbit precise first-generation GA evaluation progress source audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/liftorbit-ga-first-generation-source-audit-20261119.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect source anchors and first-candidate evaluation only
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HOST" = "51.255.163.121" && test "$USER" = "liftorbit-ci"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/known"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/known"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known" -o ConnectTimeout=20 "$USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$HOME/liftorbit-migration/sources/ovh-app/current"
          python3 - <<'PY'
          from pathlib import Path
          import re
          file=Path('ga_python_workers/ga_workers/full_runtime_adapter.py')
          lines=file.read_text().splitlines()
          for i in range(1,24): print('ADAPTER',i,lines[i-1][:260])
          for p in [Path('ga_python_workers/ga_workers/compile_legacy_ga.py')]:
            txt=p.read_text().splitlines()
            for i,l in enumerate(txt,1):
              if re.search(r'SOURCE|OUTPUT|assembled|compiled|destination|target',l,re.I):
                print('ASSEMBLER',i,l[:260])
          sources=[p for p in Path('ga_python_workers').rglob('*.py') if 350000<=p.stat().st_size<=3000000]
          print('COMPILED_SOURCE_COUNT',len(sources))
          for p in sources:
            print('COMPILED_FILE',p.name,p.stat().st_size)
            ls=p.read_text().splitlines()
            pats=[r'^def _pp_progress_snapshot\(',r'^def _pp_optimize_generic\(',r'^def optimize\(',r'_pp_progress_state',r'_pp_ga_progress',r'_pp_progress_snapshot',r'for .* in .*population',r'for .* in .*generation']
            for pat in pats:
              matches=[i for i,l in enumerate(ls) if re.search(pat,l)]
              print('PAT',pat,'hits',len(matches),'first',matches[:5])
              if pat.startswith('^def'):
                for i in matches[:2]:
                  for j in range(max(0,i-5),min(len(ls),i+85)):
                    print('SOURCE',j+1,ls[j][:250] if not re.search('SECRET|PASSWORD|TOKEN|KEY|ENVIRON|AUTH',ls[j],re.I) else '[redacted]')
                  print('END_SOURCE')
          PY
          REMOTE
