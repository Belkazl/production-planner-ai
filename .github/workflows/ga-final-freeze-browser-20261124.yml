name: Diagnose GA completed-state freeze without running optimizer
on:
  push:
    branches: [diagnose/ga-final-ui-freeze-20261124]
    paths:
      - .github/workflows/ga-final-freeze-browser-20261124.yml
      - ops/ovh/ga-final-freeze-20261124/probe.mjs
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Simulate SSE completed response and report UI mutation recursion
        run: node ops/ovh/ga-final-freeze-20261124/probe.mjs