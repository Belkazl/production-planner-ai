name: Ship-by deadlines OVH release
on:
  push:
    branches: [fix/order-ship-by-20261127]
    paths:
      - ops/ovh/order-ship-by-20261127/**
      - .github/workflows/liftorbit-ship-by-release-20261127.yml
permissions:
  contents: read
concurrency:
  group: liftorbit-production-etalon-repair
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test worker and browser helpers
        run: |
          (cd ops/ovh/order-ship-by-20261127 && python3 -m unittest discover -v)
          node --test ops/ovh/order-ship-by-20261127/test_*.mjs
          node --check ops/ovh/order-ship-by-20261127/patch_app.mjs
          node --check ops/ovh/order-ship-by-20261127/browser_accept.mjs
          bash -n ops/ovh/order-ship-by-20261127/release.sh
          bash -n ops/ovh/order-ship-by-20261127/remote_release.sh
      - run: npm install --prefix /tmp/liftorbit-order-ship-by-test --no-save --no-package-lock --ignore-scripts playwright-core@1.58.2
      - name: Stage current OVH code, test real editor, deploy and verify with rollback
        env:
          DEPLOY_HOST: ${{ vars.OVH_HOST }}
          DEPLOY_USER: ${{ vars.OVH_USER }}
          DEPLOY_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: bash ops/ovh/order-ship-by-20261127/release.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ship-by-live
          path: /tmp/ship-by-live.png
          retention-days: 7
