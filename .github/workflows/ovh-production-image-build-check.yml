name: OVH migration - build pinned Railway app and GA images

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ovh-production-image-build-check.yml

permissions:
  contents: read

jobs:
  app-image:
    if: github.event.pull_request.head.repo.full_name == 'Belkazl/production-planner-ai' && github.head_ref == 'ops/railway-migration-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact production application commit
        uses: actions/checkout@v4
        with:
          ref: 4a1457d6f33e7ef5b6e8ad59c3e21ef345b8c25f
          persist-credentials: false
      - name: Build application image and execute embedded contract tests
        run: docker build --pull -t liftorbit-app:ovh-build-check .
      - name: Confirm image metadata
        run: |
          docker inspect --format '{{.Config.ExposedPorts}}' liftorbit-app:ovh-build-check
          echo 'OVH_PINNED_APP_IMAGE_BUILD_OK'

  ga-image:
    if: github.event.pull_request.head.repo.full_name == 'Belkazl/production-planner-ai' && github.head_ref == 'ops/railway-migration-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact isolated GA worker commit
        uses: actions/checkout@v4
        with:
          ref: 788a06c269330d70528d3ac75a89ec729c12fe0b
          persist-credentials: false
      - name: Build GA worker Docker image
        run: docker build --pull -f ga_python_workers/Dockerfile -t liftorbit-ga:ovh-build-check ga_python_workers
      - name: Compile Python worker modules and confirm runtime
        run: |
          docker run --rm --entrypoint python liftorbit-ga:ovh-build-check -m compileall -q /srv/ga_workers
          echo 'OVH_PINNED_GA_IMAGE_BUILD_OK'
