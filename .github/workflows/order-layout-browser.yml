name: QA order stacked accordion browser
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Test real 12-order editor without saving
        run: node tests/order-layout-browser.cjs
      - name: Save visual comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-layout-stacked-20261013
          path: |
            orders-collapsed.png
            orders-expanded.png
          retention-days: 3
          if-no-files-found: ignore
