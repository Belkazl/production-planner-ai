name: LiftOrbit inspect 502 continue helpers readonly
on:
  push:
    branches: [main]
    paths: [.github/workflows/liftorbit-502-helper-audit-20261119.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect exact currentJob, seed validation and save source
        shell: bash
        env:
          HOST: ${{ vars.OVH_HOST }}
          USER: ${{ vars.OVH_USER }}
          KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/key" "$RUNNER_TEMP/kh"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kh" -o ConnectTimeout=20 "$USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$HOME/liftorbit-migration/sources/ovh-app/current"
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path("python-ga-upstream.mjs").read_text().splitlines()
          anchors=[i for i,s in enumerate(lines) if re.search(r'\b(currentJob|normalizedContinuationSeed|verifiedAccountBest|stateStore|save)\b',s)]
          selected=set()
          for i in anchors:
            if i<270:
              selected.update(range(max(0,i-5),min(len(lines),i+8)))
          for i in sorted(selected)[:245]:
            s=lines[i]
            if re.search(r'password|token|secret|credential|authorization|private.key|process\.env|Bun\.env|database.url|http(s)?://|api.key|email',s,re.I):
              s='[redacted]'
            print('HELPER',i+1,s[:210])
          PY
          REMOTE