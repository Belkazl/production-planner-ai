name: liftorbit-ovh-staging

x-logging: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

x-security: &security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres-main:
    image: postgres:18
    restart: unless-stopped
    shm_size: "64m"
    env_file:
      - /opt/liftorbit/secrets/postgres-main.env
    volumes:
      - postgres_main:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 400m
    pids_limit: 100
    logging: *log

  postgres-auth:
    image: postgres:18
    restart: unless-stopped
    shm_size: "64m"
    env_file:
      - /opt/liftorbit/secrets/postgres-auth.env
    volumes:
      - postgres_auth:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 400m
    pids_limit: 100
    logging: *log

  planner-gateway:
    build:
      context: /opt/liftorbit/sources/planner
    image: liftorbit/planner:ovh-staging
    restart: unless-stopped
    working_dir: /srv
    environment:
      PYTHONUNBUFFERED: "1"
    command:
      - python3
      - -c
      - |
        import json, os, re, traceback
        try:
            with open('/run/liftorbit/config.json', encoding='utf-8') as f:
                os.environ.update(json.load(f))
            import subprocess
            _ovh_real_run=subprocess.run
            def _ovh_safe_run(*argv,**kwargs):
                call=argv[0] if argv else kwargs.get('args')
                pieces=list(call) if isinstance(call,(list,tuple)) else []
                targeted=(kwargs.get('check') and len(pieces)>=3 and
                          str(pieces[0]).rsplit('/',1)[-1] in ('sh','bash') and
                          isinstance(pieces[-1],str) and 'apt-get' in pieces[-1])
                if not targeted:
                    return _ovh_real_run(*argv,**kwargs)
                opts=dict(kwargs)
                opts['check']=False
                if 'stdout' not in opts and 'capture_output' not in opts:
                    opts['stdout']=subprocess.PIPE
                if 'stderr' not in opts and 'capture_output' not in opts:
                    opts['stderr']=subprocess.PIPE
                outcome=_ovh_real_run(*argv,**opts)
                if outcome.returncode:
                    print('OVH_PLANNER_SHELL_CAPTURED_FAILURE code='+str(outcome.returncode),flush=True)
                    err=outcome.stderr if isinstance(outcome.stderr,bytes) else str(outcome.stderr or '').encode()
                    out=outcome.stdout if isinstance(outcome.stdout,bytes) else str(outcome.stdout or '').encode()
                    print('OVH_PLANNER_SHELL_OUTPUT_SIZES stderr='+str(len(err))+' stdout='+str(len(out)),flush=True)
                    body=(err+out).decode('utf8','replace').lower()
                    for name,word in [
                        ('ADDRESS_IN_USE','address already in use'),
                        ('MISSING_FILE','no such file'),
                        ('MISSING_MODULE','no module named'),
                        ('DATABASE_REFUSED','connection refused'),
                        ('DATABASE_PASSWORD','password authentication failed'),
                        ('DATABASE_DNS','could not translate host name'),
                        ('SHELL_SYNTAX','syntax error'),
                        ('NO_SPACE','no space left'),
                        ('PERMISSION','permission denied'),
                        ('INVALID_BASE64','invalid input'),
                        ('NO_TABLE','relation does not exist'),
                        ('MISSING_VAR','keyerror'),
                        ('TRACEBACK','traceback (most recent call last)'),
                    ]:
                        if word in body:
                            print('OVH_PLANNER_SHELL_DIAGNOSTIC '+name,flush=True)
                    recognized=('ModuleNotFoundError','ImportError','FileNotFoundError',
                                'SyntaxError','KeyError','ValueError','TypeError','RuntimeError',
                                'OSError','NameError','AttributeError','OperationalError')
                    for token in recognized:
                        if token.lower() in body:
                            print('OVH_PLANNER_PYTHON_EXCEPTION '+token,flush=True)
                    outcome.check_returncode()
                return outcome
            subprocess.run=_ovh_safe_run
            # Disposable integration-only diagnostics for the protected batch bootstrap.
            cap=os.environ.get('PP_CAP_BATCH_BOOT_V2','')
            cap_lines=cap.splitlines(keepends=True)
            if len(cap_lines)>=69 and 'subprocess.run' in cap_lines[68]:
                helper=__import__('textwrap').dedent(r'''
            def _ovh_debug_run(*_args,**_kwargs):
                import os as _os,re as _re,subprocess as _sp
                options=dict(_kwargs)
                options['check']=False
                options['stdout']=_sp.PIPE
                options['stderr']=_sp.PIPE
                out=_sp.run(*_args,**options)
                if out.returncode:
                    print('OVH_ACTUAL_BATCH_EXIT',out.returncode,flush=True)
                    err=(out.stderr or b'').decode('utf8','replace')
                    stdout=(out.stdout or b'').decode('utf8','replace')
                    print('OVH_ACTUAL_BATCH_OUTPUT_SIZES',len(err),len(stdout),flush=True)
                    txt=(err+'\n'+stdout).lower()
                    for label,word in [
                        ('MISSING_FILE','no such file'),
                        ("CANNOT_OPEN","can\u0027t open file"),
                        ('MISSING_MODULE','no module named'),
                        ('DATABASE','connection refused'),
                        ('DNS','could not translate host name'),
                        ('BAD_PASSWORD','password authentication failed'),
                        ('BIND','address already in use'),
                        ('SYNTAX','syntax error'),
                        ('NO_SPACE','no space left'),
                        ('PERMISSION','permission denied'),
                        ('INVALID_INPUT','invalid input'),
                        ('TRACEBACK','traceback (most recent call last)'),
                        ('EACCES','errno 13'),
                        ('ENOENT','errno 2'),
                    ]:
                        if word in txt: print('OVH_ACTUAL_BATCH_ERROR_CLASS',label,flush=True)
                    for name in ('ModuleNotFoundError','ImportError','FileNotFoundError',
                                 'SyntaxError','IndentationError','KeyError','ValueError',
                                 'TypeError','RuntimeError','OSError','NameError',
                                 'OperationalError','AssertionError'):
                        if name.lower() in txt: print('OVH_ACTUAL_BATCH_PY_ERROR',name,flush=True)
                    # Only enum hints and numeric traceback locations leave the disposable runner.
                    _messages=[x.split('RuntimeError:',1)[-1].strip() for x in err.splitlines() if 'RuntimeError:' in x]
                    if _messages:
                        _message=_messages[-1].lower()
                        _signals=[tag for tag,term in (
                            ('HASH','hash'),('SHA256','sha256'),('ANCHOR','anchor'),
                            ('SOURCE','source'),('MISSING','missing'),('PATCH','patch'),
                            ('RESTORE','restore'),('STATE','state'),('COMMAND','command'),
                            ('EXPECTED','expected'),('INVALID','invalid'),('FILE','file'),
                            ('ENV','env')) if term in _message]
                        print('OVH_ACTUAL_BATCH_RUNTIME_HINTS',','.join(_signals) if _signals else 'NONE',flush=True)
                        print('OVH_ACTUAL_BATCH_RUNTIME_MESSAGE_LENGTH',len(_messages[-1]),flush=True)
                        _code=_messages[-1].strip()
                        if _re.fullmatch(r'PP_[A-Z][A-Z0-9_]{4,70}_(?:MISSING|INVALID|FAILED|REQUIRED)',_code):
                            print('OVH_ACTUAL_BATCH_SAFE_ERROR_CODE',_code,flush=True)
                    _trace=[]
                    for _row in err.splitlines():
                        if _row.lstrip().startswith('File "') and ', line ' in _row:
                            _num=_row.rsplit(', line ',1)[-1].split(',',1)[0].strip()
                            if _num.isdigit(): _trace.append(_num)
                    print('OVH_ACTUAL_BATCH_TRACE_LINES',','.join(_trace[-8:]) if _trace else 'NONE',flush=True)
                    paths=list(dict.fromkeys(_re.findall(r'/tmp/[A-Za-z0-9_.-]+',err)))
                    for name in paths[:9]:
                        print('OVH_ACTUAL_BATCH_TMP_RELATION',
                              'len='+str(len(name)),'exists='+str(_os.path.exists(name)).lower(),flush=True)
                    out.check_returncode()
                return out
            ''')
                cap_lines[68]=cap_lines[68].replace('subprocess.run','_ovh_debug_run',1)
                os.environ['PP_CAP_BATCH_BOOT_V2']=helper+''.join(cap_lines)
                print('OVH_ACTUAL_BATCH_DIAGNOSTIC_HOOK_INSTALLED',flush=True)
            exec(os.environ['PP_GENERIC_RESTORE_LAUNCH_V2'])
        except BaseException as e:
            frames=traceback.extract_tb(e.__traceback__) if e.__traceback__ else []
            frame=frames[-1] if frames else None
            line=frame.lineno if frame else 0
            print('OVH_GATEWAY_BOOT_EXCEPTION', type(e).__name__, 'line='+str(line), flush=True)
            if isinstance(e,KeyError) and e.args and re.fullmatch(r'[A-Z_][A-Z0-9_]{1,70}',str(e.args[0])):
                print('OVH_GATEWAY_BOOT_MISSING_KEY',str(e.args[0]),flush=True)
            if isinstance(e,ModuleNotFoundError) and getattr(e,'name',None) and re.fullmatch(r'[A-Za-z0-9_.]{1,60}',e.name):
                print('OVH_GATEWAY_BOOT_MISSING_MODULE',e.name,flush=True)
            if isinstance(e,SystemExit):
                print('OVH_GATEWAY_BOOT_SYSTEM_EXIT_CODE',str(e.code) if isinstance(e.code,int) else 'noninteger',flush=True)
            try:
                if type(e).__name__ == 'CalledProcessError':
                    raw=getattr(e,'cmd',None)
                    parts=list(raw) if isinstance(raw,(list,tuple)) else str(raw or '').split()
                    program=str(parts[0]).rsplit('/',1)[-1] if parts else 'unknown'
                    program=''.join(c for c in program if c.isalnum() or c in '._-')[:45] or 'unknown'
                    prefix=' '.join(str(v).lower() for v in parts[:5])
                    kind=('APT_GET' if 'apt-get' in prefix else
                          'PIP_INSTALL' if 'pip' in prefix else
                          'PYTHON_MODULE' if 'python' in prefix else
                          'SHELL' if program in ('sh','bash') else
                          'CURL' if program=='curl' else 'OTHER')
                    print('OVH_GATEWAY_SUBPROCESS_FAILED',program,kind,'exit='+str(getattr(e,'returncode','unknown')),flush=True)
                    if kind=='APT_GET':
                        import re as _diag_re
                        raw_text=' '.join(str(v) for v in parts)
                        match=_diag_re.search(r'apt-get\s+install\s+(?:-y\s+)?(?:--no-install-recommends\s+)?([a-zA-Z0-9+_.\- ]{1,130})',raw_text)
                        if match:
                            packages=[x for x in match.group(1).split() if _diag_re.fullmatch(r'[a-z][a-z0-9+_.-]{1,45}',x)]
                            print('OVH_GATEWAY_APT_PACKAGE_NAMES',','.join(packages[:18]) or 'none',flush=True)
                        shape=('path=ABS' if '/usr/bin/apt-get' in raw_text else 'path=SEARCH')
                        shape+=' count='+str(min(raw_text.count('apt-get'),9))
                        shape+=' update='+str(bool(_diag_re.search(r'apt-get\s+update\b',raw_text))).lower()
                        shape+=' install='+str(bool(_diag_re.search(r'apt-get\s+install\b',raw_text))).lower()
                        shape+=' quiet='+str(('-qq' in raw_text) or ('-q' in raw_text)).lower()
                        print('OVH_GATEWAY_APT_COMMAND_SHAPE',shape,flush=True)
                        shell_steps=_diag_re.split(r'\s*(?:&&|;|\|\|)\s*',raw_text)
                        programs=[]
                        for step in shell_steps[:14]:
                            matched=_diag_re.search(r'(?:^|\s)(apt-get|pip3?|python3?|curl|mkdir|cp|bash|sh|ls|pg_isready|psql|test|echo|grep|find|wget|git|dpkg|which|chmod|chown)(?:\s|$)',step)
                            programs.append(matched.group(1) if matched else 'OTHER')
                        print('OVH_GATEWAY_SHELL_SEQUENCE',','.join(programs),flush=True)
                        captured=getattr(e,'stderr',None) or getattr(e,'output',None) or b''
                        if isinstance(captured,bytes):
                            captured=captured.decode('utf-8',errors='replace')
                        else:
                            captured=str(captured)
                        for label,pattern in [
                            ('PERMISSION','permission denied'),
                            ('MISSING_BINARY','not found'),
                            ('MISSING_MODULE','no module named'),
                            ('MISSING_FILE','no such file'),
                            ('PIP','pip'),
                            ('APT','apt-get'),
                            ('DATABASE','connection refused'),
                            ('DNS','could not resolve'),
                            ('SHELL_SYNTAX','syntax error'),
                            ('NO_SPACE','no space left'),
                        ]:
                            if pattern.lower() in captured.lower():
                                print('OVH_GATEWAY_SHELL_ERROR_CLASS',label,flush=True)
            except BaseException as diag:
                print('OVH_GATEWAY_SUBPROCESS_DIAG_ERROR',type(diag).__name__,flush=True)
            raise SystemExit(1)
    volumes:
      - /opt/liftorbit/secrets/planner.json:/run/liftorbit/config.json:ro
    depends_on:
      postgres-main:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/db_health',timeout=4).read()"
      interval: 20s
      timeout: 6s
      retries: 8
      start_period: 90s
    mem_limit: 600m
    pids_limit: 160
    logging: *log
    <<: *security

  auth-gateway:
    build:
      context: /opt/liftorbit/sources/auth
    image: liftorbit/qa-auth:ovh-staging
    restart: unless-stopped
    command:
      - bun
      - -e
      - "Object.assign(Bun.env, await Bun.file('/run/liftorbit/config.json').json()); await import('/app/index.ts')"
    volumes:
      - /opt/liftorbit/secrets/auth.json:/run/liftorbit/config.json:ro
    depends_on:
      postgres-auth:
        condition: service_healthy
      postgres-main:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "let r=await fetch('http://127.0.0.1:8080/health');process.exit(r.ok?0:1)"
      interval: 20s
      timeout: 6s
      retries: 8
      start_period: 50s
    mem_limit: 350m
    pids_limit: 128
    logging: *log
    <<: *security

  ga-worker:
    build:
      context: /opt/liftorbit/sources/ga
    image: liftorbit/ga:ovh-staging
    restart: unless-stopped
    command:
      - python
      - -c
      - |
        import json, os, runpy
        with open('/run/liftorbit/config.json', encoding='utf-8') as f:
            os.environ.update(json.load(f))
        runpy.run_module('ga_workers.compile_legacy_ga',run_name='__main__')
        runpy.run_module('ga_workers.server',run_name='__main__')
    volumes:
      - /opt/liftorbit/secrets/ga.json:/run/liftorbit/config.json:ro
    depends_on:
      auth-gateway:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=4).read()"
      interval: 20s
      timeout: 6s
      retries: 8
      start_period: 100s
    mem_limit: 1100m
    pids_limit: 160
    logging: *log
    <<: *security

  app:
    build:
      context: /opt/liftorbit/sources/app
    image: liftorbit/app:ovh-staging
    restart: unless-stopped
    command:
      - bun
      - -e
      - "Object.assign(Bun.env, await Bun.file('/run/liftorbit/config.json').json()); await import('/app/index.ts')"
    volumes:
      - /opt/liftorbit/secrets/app.json:/run/liftorbit/config.json:ro
    depends_on:
      auth-gateway:
        condition: service_healthy
      ga-worker:
        condition: service_healthy
      planner-gateway:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "127.0.0.1:18082:8080"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "let r=await fetch('http://127.0.0.1:8080/__bridge_health');process.exit(r.ok?0:1)"
      interval: 20s
      timeout: 6s
      retries: 8
      start_period: 75s
    mem_limit: 650m
    pids_limit: 160
    logging: *log
    <<: *security

networks:
  backend:
    driver: bridge

volumes:
  postgres_main:
  postgres_auth:
